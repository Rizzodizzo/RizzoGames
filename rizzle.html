<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rizzle</title>
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<script src="games.js" data-game="rizzle" data-show-when="#home:not(.hidden)" data-hide-when=".panel.show" data-sounds="sfx" data-top="16" data-left="16" data-pill-top="64"></script>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rizzle">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ======================================================================
   COLOURS: light or dark, following the device. Tile colours are the game's
   language: green = right letter, right spot; yellow = in the word; grey = not in it.
   ====================================================================== */
:root{--ease:cubic-bezier(.2,.8,.2,1);
  --bg:#f6f5f1;--panel:#ffffff;--ink:#1f2328;--muted:#6b7078;--line:#dedfe3;--soft:#ecebe6;
  --accent:#3b3f47;--hi:#5a5f69;--edge:#1c1e23;--onaccent:#ffffff;--shade:rgba(40,30,10,.10);--boom:#d6453d;
  --ok:#4aa564;--mid:#d9a92c;--no:#878c95;--onok:#ffffff;
  --tile:#ffffff;--tline:#d5d7dc;--tfull:#8b8f97;--key:#e3e5e9;--keyink:#1f2328;
  --rz-btn-bg:var(--panel);--rz-btn-fg:var(--accent);--rz-btn-border:1px solid var(--line);--rz-btn-radius:12px;--rz-btn-shadow:0 2px 8px var(--shade);--rz-btn-size:42px}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --bg:#121317;--panel:#1d1f25;--ink:#eceef2;--muted:#9aa0aa;--line:#2e3139;--soft:#272a32;
  --accent:#d6d9df;--hi:#f1f2f5;--edge:#7d828c;--onaccent:#16181d;--shade:rgba(0,0,0,.45);--boom:#ef5a52;
  --ok:#3f9358;--mid:#c29627;--no:#3b3e46;
  --tile:transparent;--tline:#3a3d46;--tfull:#62666f;--key:#3b3e47;--keyink:#eceef2}}
/* colour-blind friendly colours (Settings) */
html.cb{--ok:#f2743a;--mid:#5aa9e8;--onok:#ffffff}
*{box-sizing:border-box}
html{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;height:100%;overflow-y:auto;overscroll-behavior:none;-webkit-overflow-scrolling:touch;background:var(--bg);color:var(--ink);
  font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 12px)}
.app{max-width:1100px;margin:0 auto;height:100%}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.iconbtn{width:42px;height:42px;border-radius:12px;display:inline-grid;place-items:center;background:var(--panel);border:1px solid var(--line);box-shadow:0 2px 8px var(--shade)}
.iconbtn:active{transform:scale(.94)}
.primary{background:linear-gradient(180deg,var(--hi),var(--accent));color:var(--onaccent);box-shadow:0 4px 0 var(--edge),0 8px 18px var(--shade)}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}

/* ================= HOME ================= */
.home{max-width:480px;margin:0 auto;height:100%;min-height:560px;display:flex;flex-direction:column;padding-top:54px}
.homeset{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px}
/* the title: letter tiles that flip over into the game's colours */
.wtitle{flex:none;display:flex;justify-content:center;gap:clamp(4px,1.2vw,8px);margin:clamp(4px,2vh,22px) 0 clamp(12px,3vh,30px)}
.wtitle span{width:clamp(40px,min(13vw,7vh),64px);aspect-ratio:1;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:clamp(1.5rem,min(8vw,4.4vh),2.5rem);
  box-shadow:0 4px 0 rgba(0,0,0,.16);animation:tflip .7s var(--ease) both,tbob 4s ease-in-out infinite;animation-delay:calc(var(--k) * 110ms),calc(1s + var(--k) * 180ms)}
.wtitle .ok{background:var(--ok)}.wtitle .mid{background:var(--mid)}.wtitle .no{background:var(--no);color:#fff}
@keyframes tflip{0%{transform:rotateX(90deg);opacity:0}60%{transform:rotateX(-15deg);opacity:1}100%{transform:none}}
@keyframes tbob{0%,90%,100%{translate:0 0}95%{translate:0 -6px}}
/* mode cards you swipe between */
.modes{position:relative;flex:1 1 0;min-height:150px;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:20px 22% 12px;margin:0 -16px;
  scrollbar-width:none;overscroll-behavior-x:contain;align-items:stretch}
.modes::-webkit-scrollbar{display:none}
@media (hover:hover) and (pointer:fine){.modes{cursor:grab}.modes.dragging{cursor:grabbing;scroll-snap-type:none}}
.mode{container-type:size;flex:0 0 100%;scroll-snap-align:center;max-height:330px;align-self:center;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vh,16px);
  background:var(--panel);border-radius:26px;box-shadow:0 6px 20px var(--shade);transition:transform .3s var(--ease),opacity .3s;position:relative}
.mode.active{outline:2.5px solid var(--accent);outline-offset:-2.5px}
/* the daily streak: a little flame badge in the corner of the Daily card */
/* it hangs off the card's top-right corner, straddling the outline */
.streakb{position:absolute;top:-15px;right:-15px;z-index:2;display:flex;align-items:center;gap:3px;background:#412402;color:#fac775;border-radius:99px;padding:6px 14px 6px 9px;font-weight:900;font-size:1.2rem;font-variant-numeric:tabular-nums;box-shadow:0 0 0 3px var(--bg),0 4px 12px rgba(65,36,2,.35)}
.streakb svg{width:27px;height:27px;animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%}
.streakb.pop{animation:spop .6s var(--ease)}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.1) rotate(3deg)}}
@keyframes spop{40%{transform:scale(1.25)}}
.mode:not(.active){transform:scale(.84);opacity:.45}
.mode h2{margin:0;font-size:clamp(1.15rem,3vh,1.55rem);font-weight:900}
.mode p{margin:-4px 12px 0;color:var(--muted);font-weight:800;font-size:.85rem;text-align:center}
.mart{width:min(clamp(110px,min(52vw,25vh),220px),calc((100cqh - 126px) * 1.6));height:auto;flex:none;min-width:60px}
.mode:has(.streakb){padding-top:26px}
/* short phones (like the iPhone SE): smaller drawings so everything fits inside the card */
@media (max-height:720px) and (orientation:portrait){.mode{gap:6px}.mode h2{font-size:1.1rem}.wtitle{margin-bottom:10px}}
.modenav{flex:none;display:flex;align-items:center;justify-content:center;gap:12px;margin:2px 0 0}
.modearrow{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--muted)}
.modearrow.l svg{transform:scaleX(-1)}
.modearrow:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .25s var(--ease),background .25s}
.dots i.on{width:22px;background:var(--accent)}
/* word length */
.seg{flex:none;display:flex;gap:3px;padding:4px;margin-top:clamp(10px,2.2vh,20px);background:var(--panel);border-radius:14px;box-shadow:0 2px 8px var(--shade)}
.seg button{flex:1;min-width:0;padding:8px 0 7px;border-radius:10px;color:var(--muted);font-weight:800;font-size:.86rem;display:flex;flex-direction:column;align-items:center;gap:4px;transition:background .2s,color .2s}
.seg button.on{background:var(--accent);color:var(--onaccent)}
.seg .ln{display:flex;gap:2px;height:18px;align-items:center}.seg .ln i{width:6px;height:6px;border-radius:1.5px;background:currentColor;opacity:.8}
.playrow{flex:none;margin-top:clamp(10px,1.8vh,16px);display:flex;gap:10px}
.play{flex:1;border-radius:16px;padding:15px;font-size:1.15rem;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:1px}
.play small{font-size:.75rem;font-weight:700;opacity:.88}
.newg{flex:none;width:58px;border-radius:16px;background:var(--panel);color:var(--accent);display:grid;place-items:center;box-shadow:0 2px 8px var(--shade)}
.tiles{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:clamp(14px,2.4vh,22px)}   /* room below Play's shadow */
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px 11px;border-radius:16px;background:var(--panel);font-weight:800;font-size:.84rem;box-shadow:0 2px 8px var(--shade)}
.tile .tic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--soft);color:var(--accent);transition:transform .2s;position:relative}
@media (hover:hover){.tile:hover .tic{transform:translateY(-2px)}}
.badge{position:absolute;top:-6px;right:-8px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--accent);color:var(--onaccent);font-size:.68rem;font-weight:900;display:grid;place-items:center}
/* mode drawings */
.a-ok{fill:var(--ok)}.a-mid{fill:var(--mid)}.a-no{fill:var(--no)}.a-e{fill:var(--tile);stroke:var(--tline);stroke-width:2}
.a-t{font:900 17px Nunito,system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;fill:#fff}
.a-te{fill:var(--ink)}
.a-badge{fill:var(--accent)}.a-bt{fill:var(--onaccent);font:900 13px Nunito,system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}

/* ================= GAME ================= */
.game{height:100%;display:flex;flex-direction:column;align-items:center;max-width:1100px;margin:0 auto}
.ghead{flex:none;width:100%;max-width:560px;display:flex;align-items:center;gap:10px;padding:0 0 0 52px;min-height:44px}   /* R + back on the left, new + settings on the right */
.gtitle{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.gtitle b{font-size:1.12rem;font-weight:900}
.gtitle small{font-size:.78rem;color:var(--muted);font-weight:800}
.ghead .iconbtn:disabled{opacity:.35;pointer-events:none}
.bwrap{flex:1 1 0;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:10px 0;position:relative}
/* the board: one row per guess */
.board{display:grid;gap:var(--g,6px);user-select:none;-webkit-user-select:none}
.row{display:grid;grid-auto-flow:column;gap:var(--g,6px)}
.t{width:var(--ts,56px);height:var(--ts,56px);border-radius:calc(var(--ts,56px) * .14);border:2px solid var(--tline);background:var(--tile);display:grid;place-items:center;
  font-weight:900;font-size:calc(var(--ts,56px) * .56);text-transform:uppercase;color:var(--ink);position:relative;transition:border-color .1s}
.t.full{border-color:var(--tfull)}
.t.cur{border-color:var(--tfull)}
.t.cur::before{content:'';position:absolute;left:22%;right:22%;bottom:12%;height:3px;border-radius:2px;background:var(--ink);opacity:.55;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.12}}
.board:not(.rp) .row .t{cursor:default}
.t.pop{animation:tpop .12s ease-out}
@keyframes tpop{50%{transform:scale(1.1)}}
.t.ghost::after{content:attr(data-g);position:absolute;inset:0;display:grid;place-items:center;color:var(--ok);opacity:.45}
.t.ok,.t.mid,.t.no{border-color:transparent;color:var(--onok)}
.t.ok{background:var(--ok)}.t.mid{background:var(--mid)}.t.no{background:var(--no);color:#fff}
.t.flip{animation:flip .5s ease-in-out both;animation-delay:var(--d,0ms)}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.row.shake{animation:shake .45s}
@keyframes shake{0%,100%{translate:0}20%{translate:-7px 0}40%{translate:7px 0}60%{translate:-4px 0}80%{translate:3px 0}}
.t.win{animation:win .6s var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes win{30%{transform:translateY(-38%)}55%{transform:translateY(6%)}75%{transform:translateY(-8%)}}
/* keyboard */
.kbd{flex:none;width:100%;max-width:520px;display:flex;flex-direction:column;gap:7px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.krow{display:flex;gap:5px;justify-content:center}
.key{flex:1 1 0;min-width:0;max-width:46px;height:clamp(44px,7vh,58px);border-radius:8px;background:var(--key);color:var(--keyink);font-weight:900;font-size:1.05rem;text-transform:uppercase;display:grid;place-items:center;transition:background-color .2s,color .2s}
.key.wide{max-width:72px;flex-grow:1.55;font-size:.74rem;letter-spacing:.02em}
.key.wide svg.ic{width:22px;height:22px}
.krow.mid{padding:0 4.5%}
.key:active{filter:brightness(.88)}
.key.ok{background:var(--ok);color:var(--onok)}.key.mid{background:var(--mid);color:var(--onok)}.key.no{background:var(--no);color:#fff;opacity:.85}
.dk .key.no{opacity:.6}
.kbd.locked .key{pointer-events:none}
.tools{flex:none;display:flex;justify-content:center;gap:10px;margin:10px 0 10px}
/* a number of the key under your thumb, like a phone keyboard */
.keypop{position:fixed;z-index:20;pointer-events:none;display:grid;place-items:center;border-radius:12px;background:var(--panel);color:var(--ink);font-size:2rem;font-weight:900;text-transform:uppercase;
  box-shadow:0 8px 22px rgba(0,0,0,.28),0 0 0 1px var(--line);opacity:0;transform:translateY(8px) scale(.85);transition:opacity .07s,transform .09s}
.keypop.show{opacity:1;transform:none}
/* toasts */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);z-index:9;transform:translate(-50%,-10px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);
  font-weight:900;padding:10px 16px;border-radius:12px;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* result card */
.result{flex:none;width:100%;max-width:520px;margin-top:4px;background:var(--panel);border-radius:20px;padding:14px;box-shadow:0 4px 16px var(--shade);animation:rise .35s var(--ease) both;display:flex;flex-direction:column;gap:12px}
.result .top{display:flex;align-items:center;gap:12px}
.result .ri{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex-shrink:0;color:#fff}
.result .ri svg.ic{width:28px;height:28px}
.result.win .ri{background:var(--ok)}.result.lose .ri{background:var(--boom)}
.result h2{margin:0;font-size:1.3rem;font-weight:900}
.result .word{letter-spacing:.08em}
.result .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.result .chips span{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:.82rem;background:var(--soft);padding:4px 10px;border-radius:99px}
.result .chips svg.ic{width:15px;height:15px}
.result .chips .new{background:#ffd23f;color:#3a2c00}
.result .row2{display:flex;gap:10px}
.result .row2 button{flex:1;padding:13px 8px;border-radius:14px;font-weight:900;font-size:1rem;display:flex;align-items:center;justify-content:center;gap:6px}
.result .row2 .sec{background:var(--soft)}
.result .next{text-align:center;color:var(--muted);font-weight:800;font-size:.85rem;margin:-2px 0 0}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* ================= PANELS (How to play, Stats, History, Timelapse, Settings) ================= */
.panel{position:fixed;inset:0;z-index:6;background:var(--bg);overflow-y:auto;overscroll-behavior:none;border-radius:18px 18px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.25);
  transform:translateY(100%);visibility:hidden;transition:transform .38s var(--ease),visibility 0s .38s}
.panel.show{transform:none;visibility:visible;transition:transform .38s var(--ease),visibility 0s}
.panelin{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.phead h1{flex:1;margin:0;text-align:center;font-size:1.3rem;font-weight:900}
.phead .sp{width:42px;text-align:right;color:var(--muted);font-weight:800;font-size:.85rem}
/* how to play */
.how h2{margin:0 0 12px;font-size:1.25rem;font-weight:900;display:flex;align-items:center;gap:10px}
.how h2 .hn{width:30px;height:30px;border-radius:10px;background:var(--accent);color:var(--onaccent);display:grid;place-items:center;font-size:.95rem}
.stage{background:var(--panel);border-radius:20px;padding:18px 12px;box-shadow:0 2px 10px var(--shade);min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;--ts:46px;--g:5px}
.cap{display:flex;align-items:center;gap:10px;margin-top:12px;background:var(--panel);border-radius:14px;padding:12px 14px;font-weight:800;box-shadow:0 2px 8px var(--shade);min-height:56px;border-left:4px solid var(--accent);line-height:1.4}
.cap .sw{flex:none;width:18px;height:18px;border-radius:5px}
.hownav{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:8px}
.hownav button{min-width:96px;padding:12px 16px;border-radius:14px;font-weight:900}
.hownav .sec{background:var(--soft)}
.howkeys{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.howkeys span{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:99px;padding:7px 12px;font-weight:900;font-size:.88rem}
.howkeys svg.ic{width:17px;height:17px;color:var(--accent)}
/* filters shared by Stats and History */
.hfilt{display:flex;gap:3px;padding:4px;background:var(--panel);border-radius:14px;box-shadow:0 2px 8px var(--shade);margin-bottom:10px}
.hfilt button{flex:1;padding:9px 0;border-radius:10px;font-weight:800;font-size:.85rem;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.hfilt button.on{background:var(--accent);color:var(--onaccent)}
.hfilt svg.ic{width:17px;height:17px}
.hsum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 14px}
.hsum div{background:var(--panel);border-radius:14px;padding:10px 4px;text-align:center;box-shadow:0 2px 8px var(--shade)}
.hsum b{display:block;font-size:1.25rem;font-weight:900;font-variant-numeric:tabular-nums}
.hsum span{display:block;color:var(--muted);font-weight:800;font-size:.72rem;margin-top:2px}
/* stats: how many guesses each win took */
.dist{background:var(--panel);border-radius:16px;padding:12px 14px;box-shadow:0 2px 8px var(--shade);display:flex;flex-direction:column;gap:6px}
.dist h3{margin:0 0 4px;font-size:.78rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dbar{display:flex;align-items:center;gap:8px;font-weight:900;font-variant-numeric:tabular-nums}
.dbar>span{width:14px;text-align:center;color:var(--muted)}
.dbar i{display:flex;justify-content:flex-end;align-items:center;min-width:26px;height:24px;padding:0 8px;border-radius:6px;background:var(--no);color:#fff;font-style:normal;font-size:.85rem;transition:width .5s var(--ease)}
.dbar i.now{background:var(--ok)}
.snote{margin:10px 4px 0;text-align:center;font-weight:800;font-size:.82rem;color:var(--muted);min-height:1em}
/* history */
.hlist{display:flex;flex-direction:column;gap:8px}
.hrow{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:14px;padding:10px 12px;box-shadow:0 2px 8px var(--shade);cursor:pointer}
.hrow .hw{display:flex;gap:2px;flex-shrink:0}
.hrow .hw i{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:.72rem;color:#fff;background:var(--no);text-transform:uppercase}
.hrow .hw i.ok{background:var(--ok)}
.hrow .hm{flex:1;min-width:0}
.hrow .hm b{display:block;font-weight:900}
.hrow .hm small{color:var(--muted);font-weight:700;font-size:.8rem}
.hrow .hv{font-weight:900;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.hrow .hv svg.ic{width:16px;height:16px;color:#c88a00}
.hrow .hv .lose{color:var(--boom)}
.hplay{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);font-style:normal}
.hrow .hv .hplay svg.ic{width:14px;height:14px;color:var(--onaccent)}
.hempty{text-align:center;color:var(--muted);font-weight:800;padding:30px 10px;display:flex;flex-direction:column;align-items:center;gap:10px}
.hempty svg.ic{width:40px;height:40px;opacity:.6}
.danger{display:block;margin:18px auto 0;padding:11px 18px;border-radius:12px;background:var(--soft);color:var(--boom);font-weight:900}
/* timelapse */
#rpPanel .panelin{display:flex;flex-direction:column;min-height:100%}
.rpsub{margin:-8px 0 10px;text-align:center;color:var(--muted);font-weight:800;font-size:.85rem}
.rpwrap{flex:1 1 0;min-height:240px;display:flex;align-items:center;justify-content:center}
.rpctl{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 10px}
.rpctl .rpplay{width:52px;height:52px;padding:0;border-radius:50%;display:grid;place-items:center}
.rpctl .rpbtn{height:44px;min-width:52px;padding:0 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:900;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.rpstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rpstats div{background:var(--panel);border-radius:12px;padding:8px 4px;text-align:center;box-shadow:0 2px 8px var(--shade)}
.rpstats span{display:block;font-size:.72rem;font-weight:800;color:var(--muted)}
.rpstats b{font-size:1.05rem;font-weight:900;font-variant-numeric:tabular-nums}
.cal{background:var(--panel);border-radius:18px;padding:12px 12px 14px;box-shadow:0 2px 8px var(--shade)}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead b{font-size:1.05rem;font-weight:900}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calgrid .wd{font-size:.72rem;font-weight:900;color:var(--muted);text-align:center;padding-bottom:2px}
.cday{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:.95rem;background:var(--soft);color:var(--ink);position:relative;font-variant-numeric:tabular-nums}
.cday.win{background:var(--ok);color:var(--onok)}
.cday.lost{background:var(--no);color:#fff}
.cday.part{box-shadow:inset 0 0 0 2.5px var(--mid)}
.cday.today{outline:2.5px solid var(--accent);outline-offset:2px}
.cday.off{background:none;color:var(--muted);opacity:.35;cursor:default}
.cday:not(.off):active{transform:scale(.92)}
.cnote{margin:12px 4px 8px;text-align:center;font-weight:800;font-size:.88rem;color:var(--muted)}
.calkey{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;font-weight:800;font-size:.78rem;color:var(--muted)}
.calkey span{display:inline-flex;align-items:center;gap:6px}
.calkey i{width:14px;height:14px;border-radius:4px;background:var(--soft)}
.calkey i.win{background:var(--ok)}.calkey i.lost{background:var(--no)}.calkey i.part{box-shadow:inset 0 0 0 2px var(--mid)}
/* settings */
.sgh{margin:18px 4px 8px;font-size:.78rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sgh:first-of-type{margin-top:4px}
.sgroup{background:var(--panel);border-radius:16px;box-shadow:0 2px 8px var(--shade);overflow:hidden}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:13px 14px;text-align:left;border-bottom:1px solid var(--line);cursor:pointer}
.srow:last-child{border-bottom:0}
.srow .sl{display:flex;flex-direction:column;min-width:0;gap:2px}
.srow b{font-weight:800}
.srow small{font-size:.78rem;font-weight:700;color:var(--muted)}
.srow .sr{display:flex;align-items:center;gap:4px;color:var(--muted)}
.srow .sr svg.ic{width:18px;height:18px}
.switch{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;cursor:pointer;flex-shrink:0;transition:background-color .2s;margin:0}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(18px)}

/* ================= SIDEWAYS PHONES: board on the left, keyboard on the right ================= */
@media (orientation:landscape) and (max-height:520px){
  body{padding:calc(env(safe-area-inset-top,0px) + 15px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) calc(env(safe-area-inset-left,0px) + 16px);overflow:hidden}
  .home{max-width:860px;min-height:0;padding:0 56px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr);column-gap:clamp(16px,4vw,40px);align-items:center}
  .wtitle{grid-column:1;grid-row:1;margin:0 0 8px}
  .wtitle span{width:clamp(30px,5vw,44px);font-size:clamp(1.1rem,3vw,1.6rem);border-radius:8px}
  .home>.hl{display:flex;flex-direction:column;grid-column:1;grid-row:2;height:100%;min-height:0}
  .modes{min-height:0;padding:18px 20% 6px}
  .mode{max-height:none;gap:6px;border-radius:20px}
  .mart{width:min(clamp(90px,32vh,150px),calc((100cqh - 100px) * 1.6))}
  .mode h2{font-size:clamp(1rem,4.5vh,1.3rem)}
  .modenav{margin:0}
  .modearrow{width:30px;height:30px}
  .home>.hr{display:flex;flex-direction:column;grid-column:2;grid-row:1/3;justify-content:center;min-height:0}
  .seg{margin-top:0}
  .seg button{padding:6px 0 5px}
  .playrow{margin-top:10px}
  .play{padding:11px}
  .tiles{margin-top:14px;gap:8px}
  .tile{flex-direction:row;justify-content:center;padding:8px 6px;gap:6px;font-size:.8rem}
  .tile .tic{width:34px;height:34px;border-radius:10px}
  .tile .tic svg.ic{width:18px;height:18px}
  .game{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;column-gap:18px;align-items:center}
  .ghead{grid-column:1;grid-row:1;max-width:none}
  .bwrap{grid-column:1;grid-row:2/5;height:100%;padding:4px 0}
  .kbd,.result{grid-column:2;grid-row:1/5;align-self:center}
  .key{height:clamp(36px,13vh,50px)}
  .result{padding:12px;gap:10px}
  .result .ri{width:42px;height:42px;border-radius:13px}
  .result h2{font-size:1.15rem}
}

/* Reduce motion follows the switch in the Settings menu */
html.rz-reduce-motion *,html.rz-reduce-motion *::before,html.rz-reduce-motion *::after{animation:none!important;transition:none!important}
.hl,.hr{display:contents}
</style>
</head>
<body>
<div class="app">

  <!-- ================= HOME ================= -->
  <section class="home" id="home">
    <button class="iconbtn homeset" id="setBtnHome" aria-label="Settings" data-ic="settings"></button>
    <div class="wtitle" id="wtitle" role="img" aria-label="Rizzle"></div>
    <div class="hl">
      <div class="modes" id="modes" aria-label="Mode"></div>
      <div class="modenav">
        <button class="modearrow l" id="modePrev" aria-label="Previous mode"></button>
        <div class="dots" id="modeDots"></div>
        <button class="modearrow" id="modeNext" aria-label="Next mode"></button>
      </div>
    </div>
    <div class="hr">
      <div class="seg" id="lenSeg" role="radiogroup" aria-label="Word length"></div>
      <div class="playrow">
        <button class="primary play" id="playBtn"></button>
        <button class="newg hidden" id="newBtnHome" aria-label="New word"></button>
        <button class="newg hidden" id="calBtnHome" aria-label="Calendar of daily words" data-ic="calendar"></button>
      </div>
      <div class="tiles">
        <button class="tile" id="howBtn"><span class="tic" data-ic="help"></span>How to play</button>
        <button class="tile" id="statsBtn"><span class="tic" data-ic="chart"></span>Stats</button>
        <button class="tile" id="historyBtn"><span class="tic" data-ic="history"><b class="badge hidden" id="histBadge"></b></span>History</button>
      </div>
    </div>
  </section>

  <!-- ================= GAME ================= -->
  <section class="game hidden" id="game">
    <div class="ghead">
      <button class="iconbtn" id="homeBtn" aria-label="Home" data-ic="back"></button>
      <div class="gtitle"><b id="gMode">Daily</b><small id="gSub">5 letters</small></div>
      <button class="iconbtn" id="newBtn" aria-label="New word" data-ic="refresh"></button>
      <button class="iconbtn hidden" id="calBtnGame" aria-label="Calendar of daily words" data-ic="calendar"></button>
      <button class="iconbtn" id="setBtnGame" aria-label="Settings" data-ic="settings"></button>
    </div>
    <div class="bwrap" id="bwrap"><div class="board" id="board" role="grid" aria-label="Guesses"></div></div>
    <div class="kbd" id="kbd" aria-label="Keyboard"></div>
    <div class="result hidden" id="result"></div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ================= PANELS ================= -->
<div class="panel" id="setPanel" role="dialog" aria-label="Settings"><div class="panelin">
  <div class="grab"></div>
  <div class="phead"><button class="iconbtn" data-close data-ic="back" aria-label="Close"></button><h1>Settings</h1><span class="sp"></span></div>
  <h3 class="sgh">Every game</h3>
  <div class="sgroup">
    <button class="srow" id="sMenu"><span class="sl"><b>Sound, motion &amp; updates</b></span><span class="sr"><span data-ic="chevron"></span></span></button>
  </div>
  <h3 class="sgh">Game</h3>
  <div class="sgroup">
    <label class="srow"><span class="sl"><b>Hard mode</b><small>Letters you've found must be used</small></span><input type="checkbox" class="switch" data-p="hard"></label>
    <label class="srow"><span class="sl"><b>Colour-blind colours</b></span><input type="checkbox" class="switch" data-p="cb"></label>
  </div>
  <h3 class="sgh">Controls</h3>
  <div class="sgroup">
    <label class="srow"><span class="sl"><b>Letter pop-up</b></span><input type="checkbox" class="switch" data-p="keypop"></label>
    <label class="srow" id="sBuzzRow"><span class="sl"><b>Vibration</b></span><input type="checkbox" class="switch" data-p="buzz"></label>
  </div>
  <h3 class="sgh">Data</h3>
  <button class="danger" id="sReset">Reset stats &amp; streaks</button>
  <p class="snote" id="sResetNote"></p>
</div></div>

<div class="panel" id="howPanel" role="dialog" aria-label="How to play"><div class="panelin how">
  <div class="grab"></div>
  <div class="phead"><button class="iconbtn" data-close data-ic="back" aria-label="Close"></button><h1>How to play</h1><span class="sp" id="howCount"></span></div>
  <h2 id="howTitle"></h2>
  <div class="stage" id="howStage"></div>
  <div class="cap" id="howCap"></div>
  <div class="hownav"><button class="sec" id="howPrev">Back</button><div class="dots" id="howDots"></div><button class="primary" id="howNext">Next</button></div>
</div></div>

<div class="panel" id="calPanel" role="dialog" aria-label="Calendar"><div class="panelin">
  <div class="grab"></div>
  <div class="phead"><button class="iconbtn" data-close data-ic="back" aria-label="Close"></button><h1>Daily words</h1><span class="sp"></span></div>
  <div class="hfilt" id="cLen"></div>
  <div class="cal">
    <div class="calhead"><button class="modearrow l" id="cPrev" aria-label="Previous month"></button><b id="cMonth"></b><button class="modearrow" id="cNext" aria-label="Next month"></button></div>
    <div class="calgrid" id="cGrid"></div>
  </div>
  <p class="cnote" id="cNote"></p>
  <div class="calkey"><span><i class="win"></i>Solved</span><span><i class="lost"></i>Missed the word</span><span><i class="part"></i>Started</span><span><i></i>Not played</span></div>
</div></div>

<div class="panel" id="statsPanel" role="dialog" aria-label="Stats"><div class="panelin">
  <div class="grab"></div>
  <div class="phead"><button class="iconbtn" data-close data-ic="back" aria-label="Close"></button><h1>Stats</h1><span class="sp"></span></div>
  <div class="hfilt" id="sfMode"></div>
  <div class="hfilt" id="sfLen"></div>
  <div class="hsum" id="ssum"></div>
  <div class="dist" id="sdist"></div>
</div></div>

<div class="panel" id="histPanel" role="dialog" aria-label="History"><div class="panelin">
  <div class="grab"></div>
  <div class="phead"><button class="iconbtn" data-close data-ic="back" aria-label="Close"></button><h1>History</h1><span class="sp"></span></div>
  <div class="hfilt" id="hfilt"></div>
  <div class="hlist" id="hlist"></div>
  <button class="danger hidden" id="histClear">Clear history</button>
</div></div>

<div class="panel" id="rpPanel" role="dialog" aria-label="Timelapse"><div class="panelin">
  <div class="grab"></div>
  <div class="phead"><button class="iconbtn" data-close data-ic="back" aria-label="Back"></button><h1 id="rpTitle">Timelapse</h1><span class="sp"></span></div>
  <p class="rpsub" id="rpSub"></p>
  <div class="rpwrap" id="rpWrap"><div class="board" id="rpBoard" aria-label="Timelapse board"></div></div>
  <div class="rpctl"><button class="rpbtn" id="rpAgain" aria-label="Watch again"></button><button class="primary rpplay" id="rpPlay" aria-label="Play"></button><button class="rpbtn" id="rpSpeed" aria-label="Speed">1×</button></div>
  <div class="rpstats"><div><span>Guesses</span><b id="rpGuesses">0</b></div><div><span>Time</span><b id="rpTime">0:00</b></div><div><span>Result</span><b id="rpRes">–</b></div></div>
</div></div>

  const a = [...ANS[n]], r = rng(20261106 + n * 7919);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }

const today = () => { const d = new Date(); return Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - START) / 864e5) + 1; };

const timeNow = () => G ? G.elapsed + (G.startedAt ? Date.now() - G.startedAt : 0) : 0;
function randomWord(n) {

/* ---------- checking a guess ---------- */
const nth = i => (i + 1) + (['st', 'nd', 'rd'][i] || 'th');   // 1st, 2nd, 3rd, 4th ...

  const need = {};
  G.guesses.forEach(g => { const res = score(g, G.word), cnt = {}; g.split('').forEach((ch, i) => { if (res[i] !== 'no') cnt[ch] = (cnt[ch] || 0) + 1; }); for (const ch in cnt) need[ch] = Math.max(need[ch] || 0, cnt[ch]); });

(() => {   // swiping and dragging the mode cards
  const m = $('#modes');
  let t = 0;
  m.addEventListener('scroll', () => {
    clearTimeout(t);

      const mid = m.scrollLeft + m.clientWidth / 2;
      let best = 0, bd = 1e9;
      [...m.children].forEach((c, k) => { const d = Math.abs(c.offsetLeft + c.clientWidth / 2 - mid); if (d < bd) { bd = d; best = k; } });
      setMode(best);
    }, 60);
  });
  let drag = null;
  m.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse' && e.button === 0) drag = {x: e.clientX, s: m.scrollLeft, moved: false}; });
  addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x;
    if (Math.abs(dx) > 5) { drag.moved = true; m.classList.add('dragging'); }
    if (drag.moved) m.scrollLeft = drag.s - dx;

  addEventListener('pointerup', () => {
    if (!drag) return;
    const moved = drag.moved; drag = null; m.classList.remove('dragging');
    if (moved) { m._noClick = true; setTimeout(() => m._noClick = false, 50); requestAnimationFrame(() => m.dispatchEvent(new Event('scroll'))); }
  });

    if (m._noClick) return;

    $('#cMonth').textContent = start.toLocaleDateString(undefined, {month: 'long', year: 'numeric'});
    let html = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(d => `<span class="wd">${d}</span>`).join('') + '<span></span>'.repeat(lead);
    for (let d = 1; d <= days; d++) {
      const day = dayOf(new Date(y, mo, d)), x = done[day], off = day < 1 || day > now;
      const s = !off && !x && load(saveKey('daily', n, day), null), started = s && s.day === day && s.guesses && s.guesses.length;
      const cls = off ? 'off' : x ? (x.w ? 'win' : 'lost') : started ? 'part' : '';

      html += `<button class="cday ${cls}${day === now ? ' today' : ''}"${off ? ' disabled tabindex="-1"' : ` data-day="${day}" aria-label="${label}"`}>${d}</button>`;
    }
    $('#cGrid').innerHTML = html;
    const total = now, solved = Object.entries(done).filter(([d, x]) => +d <= now && x.w).length;
    $('#cNote').textContent = `${solved} of ${total} daily word${total === 1 ? '' : 's'} solved. Catching up on a missed day doesn't change your streak.`;
    $('#cPrev').disabled = y < first.getFullYear() || (y === first.getFullYear() && mo <= first.getMonth());
    const t = new Date(); $('#cNext').disabled = y > t.getFullYear() || (y === t.getFullYear() && mo >= t.getMonth());
  }
  function open(len = prefs.len, day = today()) {

})();

/* ---------- Timelapse: watch a finished game type itself out ---------- */
const RP = (() => {
  let h = null, timers = [], playing = false, speed = 1, el = $('#rpBoard');
  const clear = () => { timers.forEach(clearTimeout); timers = []; };
  const at = (ms, fn) => timers.push(setTimeout(fn, ms / speed));

  function run() {
    clear(); reset(); playing = true; setBtn();
    let t = 350;
    h.g.forEach((g, r) => {
      const res = score(g, h.word);
      for (let i = 0; i < g.length; i++) { const tt = t + i * 85; at(tt, () => { const x = tileAt(el, r, i); x.textContent = g[i]; x.className = 't full pop'; Sound.type(); }); }
      t += g.length * 85 + 160;
      for (let i = 0; i < g.length; i++) { const tt = t + i * 150; at(tt, () => { const x = tileAt(el, r, i); x.className = 't ' + res[i] + ' flip'; x.style.setProperty('--d', '0ms'); Sound.flip(i, res[i]); }); }
      t += g.length * 150 + 420;
    });
    at(t, () => { if (h.w) [...el.children[h.g.length - 1].children].forEach((x, i) => { x.style.setProperty('--d', i * 90 + 'ms'); x.className = 't ok win'; }); playing = false; setBtn(); });
  }
  const setBtn = () => { $('#rpPlay').innerHTML = ic(playing ? 'pause' : 'play'); $('#rpPlay').setAttribute('aria-label', playing ? 'Stop' : 'Play'); };
  function open(entry) {
    h = entry;
    $('#rpTitle').textContent = h.m === 'daily' ? `Daily #${h.day}` : 'Unlimited';
    $('#rpSub').textContent = `${h.n} letters · ${h.w ? `solved in ${h.g.length}` : `the word was ${h.word.toUpperCase()}`}`;
    $('#rpGuesses').textContent = `${h.w ? h.g.length : 'X'}/${ROWS[h.n]}`;
    $('#rpTime').textContent = fmt(h.ms || 0); $('#rpRes').textContent = h.w ? 'Solved' : 'Missed';
    openPanel('rpPanel');
    requestAnimationFrame(() => requestAnimationFrame(run));
  }
  $('#rpPlay').onclick = () => { if (playing) { clear(); playing = false; setBtn(); } else run(); };
  $('#rpAgain').innerHTML = ic('again');
  $('#rpAgain').onclick = run;
  $('#rpSpeed').onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; $('#rpSpeed').textContent = speed + '×'; if (playing) run(); };
  addEventListener('resize', () => { if (h && $('#rpPanel').classList.contains('show')) fitBoard(el, $('#rpWrap'), h.n, ROWS[h.n], 54); });
  return {open, stop() { clear(); playing = false; }};
})();

/* ---------- How to play: little rows that show how the colours work ---------- */
const How = (() => {
  let step = 0, timers = [];
  const clear = () => { timers.forEach(clearTimeout); timers = []; };
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  const rowHTML = (word, res) => `<div class="row">${[...word].map((ch, i) => ch === ' ' ? '<div class="t"></div>' : `<div class="t full" data-r="${res && res[i] || ''}">${ch}</div>`).join('')}</div>`;
  const reveal = (row, delay = 300) => [...row.children].forEach((t, i) => at(delay + i * 260, () => { if (t.dataset.r) { t.className = 't ' + t.dataset.r + ' flip'; Sound.flip(i, t.dataset.r); } }));
  const sw = c => `<span class="sw" style="background:var(--${c})"></span>`;
  const STEPS = [
    {title: 'Guess the word', cap: () => `<span>Type a word and press <b>Enter</b>. Tap any square to put a letter there first. You get ${ROWS[5]} tries for a 5 letter word, more for longer ones.</span>`,
      run(stage) {
        stage.innerHTML = `<div class="board">${rowHTML('     ')}${rowHTML('     ')}</div>`;
        const row = stage.querySelector('.row');
        [...'crane'].forEach((ch, i) => at(400 + i * 260, () => { const t = row.children[i]; t.textContent = ch; t.className = 't full pop'; Sound.type(); }));
        at(400 + 5 * 260 + 300, () => { const res = score('crane', 'stare'); [...row.children].forEach((t, i) => at(i * 260, () => { t.className = 't ' + res[i] + ' flip'; Sound.flip(i, res[i]); })); });
      }},
    {title: 'Green', cap: () => `${sw('ok')} <span><b>Green</b> means the letter is in the word, in that exact spot. Here, <b>S</b> is right.</span>`,
      run(stage) { stage.innerHTML = `<div class="board">${rowHTML('stone', ['ok'])}</div>`; reveal(stage.querySelector('.row')); }},
    {title: 'Yellow', cap: () => `${sw('mid')} <span><b>Yellow</b> means the letter is in the word, but in a different spot. <b>A</b> is in there somewhere.</span>`,
      run(stage) { stage.innerHTML = `<div class="board">${rowHTML('plant', ['', '', 'mid'])}</div>`; reveal(stage.querySelector('.row')); }},
    {title: 'Grey', cap: () => `${sw('no')} <span><b>Grey</b> means the letter isn't in the word at all, so don't use it again.</span>`,
      run(stage) { stage.innerHTML = `<div class="board">${rowHTML('mouse', ['no', 'no', 'no', 'no', 'no'])}</div>`; reveal(stage.querySelector('.row')); }},
    {title: 'Daily and Unlimited', cap: () => `<span>Solve the <b>Daily</b> word every day to build your streak, or play <b>Unlimited</b> words whenever you like.</span>`,
      run(stage) { stage.innerHTML = `<div class="howkeys"><span>${ic('calendar')}Daily: the same word for everyone</span><span>${ic('infinity')}Unlimited: as many as you like</span><span>${ic('grid')}4 to 7 letters</span></div>`; }},
  ];
  function go(k) {
    clear(); step = Math.max(0, Math.min(STEPS.length - 1, k));
    const S = STEPS[step];
    $('#howTitle').innerHTML = `<span class="hn">${step + 1}</span>${S.title}`;
    $('#howCap').innerHTML = S.cap();
    $('#howCount').textContent = `${step + 1}/${STEPS.length}`;
    $('#howDots').innerHTML = STEPS.map((_, j) => `<i class="${j === step ? 'on' : ''}"></i>`).join('');
    $('#howPrev').style.visibility = step ? 'visible' : 'hidden';
    $('#howNext').textContent = step === STEPS.length - 1 ? 'Play' : 'Next';
    S.run($('#howStage'));
  }
  $('#howPrev').onclick = () => go(step - 1);
  $('#howNext').onclick = () => { if (step === STEPS.length - 1) { closePanel($('#howPanel')); if (!$('#home').classList.contains('hidden')) play(false); } else go(step + 1); };
  return {open() { openPanel('howPanel'); requestAnimationFrame(() => go(0)); }, stop: clear};
})();
$('#howBtn').onclick = () => How.open();

/* ---------- start ---------- */
fillIcons();
renderModes(); renderLens(); renderPlay(); renderHistBadge();
if (!load('rizzle-seen-how', 0)) { keep('rizzle-seen-how', 1); setTimeout(() => How.open(), 700); }
// the daily word changes at midnight: refresh the home screen when you come back to it
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); if (!$('#home').classList.contains('hidden')) { renderModes(); renderPlay(); } } }, 60000);

/* ---------- Rizzo Games hooks (menu, updates) ---------- */
window.RizzoHooks = {
  onMenuOpen: () => updatePaused(),
  onMenuClose: () => updatePaused(),
  previewSound: () => Sound.type(),
  beforeReload() { saveGame(); return {inGame: !$('#game').classList.contains('hidden') && G && !G.over ? [G.m, G.n, G.day] : null}; },
  afterReload(info) { const g = info && info.inGame, s = g && load(saveKey(g[0], g[1], g[2]), null); if (s && resumeGame(s, g[2])) showGame(); },
};
</script>
</body>
