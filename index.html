<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rizzo Games</title>
<meta name="theme-color" content="#eef3fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0f1f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<script src="games.js" data-game="hub" data-back="off" data-top="16" data-left="16"></script>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rizzo Games">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Light or dark follows the device setting automatically */
:root{
  --bg:#eef3fc;--panel:#ffffff;--ink:#121a33;--muted:#5f6b88;--line:#dbe3f3;--soft:#e8eefb;
  --accent:#2563eb;--shadow:0 6px 22px rgba(23,48,110,.09);--shadow-hi:0 14px 34px rgba(23,48,110,.16);
  --glow1:rgba(59,130,246,.22);--glow2:rgba(56,189,248,.18);--dots:rgba(37,99,235,.07);
  --logo:linear-gradient(180deg,#8fdcff 0%,#4f9bff 46%,#1d4ed8 54%,#3b7bff 100%);
  --logo-edge:#0f2b7a;--logo-glow:rgba(37,99,235,.35);
  --pill:linear-gradient(90deg,#1d4ed8,#3b8bff);--pill-edge:#0f2b7a;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a0f1f;--panel:#131a2e;--ink:#e8eeff;--muted:#93a0c2;--line:#222c48;--soft:#1b2440;
    --accent:#5b9dff;--shadow:0 6px 22px rgba(0,0,0,.4);--shadow-hi:0 14px 34px rgba(0,0,0,.55);
    --glow1:rgba(59,130,246,.30);--glow2:rgba(34,211,238,.16);--dots:rgba(147,197,253,.06);
    --logo:linear-gradient(180deg,#c6f0ff 0%,#6cb6ff 46%,#2f6bff 54%,#5b9dff 100%);
    --logo-edge:#071643;--logo-glow:rgba(91,157,255,.55);
    --pill:linear-gradient(90deg,#2f6bff,#38bdf8);--pill-edge:#071643;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100dvh;display:flex;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 28px);
}
/* soft blue glows and a faint dot grid behind everything */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60% 38% at 22% 0%,var(--glow1),transparent 70%),
    radial-gradient(50% 32% at 88% 6%,var(--glow2),transparent 70%),
    radial-gradient(circle,var(--dots) 1.2px,transparent 1.6px) 0 0/22px 22px;
}
.app{width:100%;max-width:980px;position:relative;z-index:1}

/* ---------- header ---------- */
header{text-align:center;margin:8px 0 18px}
.logo{margin:0;display:flex;flex-direction:column;align-items:center;font-family:Bungee,Impact,"Arial Black",sans-serif;font-weight:400;line-height:1}
.rz{
  position:relative;display:inline-block;font-size:clamp(2.9rem,15vw,5rem);letter-spacing:.03em;
  background:var(--logo);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  transform:skewX(-7deg);
  filter:drop-shadow(0 5px 0 var(--logo-edge)) drop-shadow(0 12px 22px var(--logo-glow));
}
/* a light sweep that glides across RIZZO every few seconds */
.rz::after{
  content:attr(data-t);position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%) 140% 0/260% 100% no-repeat;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:shine 4.5s ease-in-out 1s infinite;
}
@keyframes shine{0%{background-position:140% 0}45%,100%{background-position:-40% 0}}
.gm{
  margin-top:-.05em;display:inline-block;font-size:clamp(1rem,4.6vw,1.35rem);letter-spacing:.45em;
  padding:.42em .5em .42em .95em;border-radius:999px;color:#fff;background:var(--pill);
  box-shadow:0 4px 0 var(--pill-edge),0 10px 20px var(--logo-glow);
}
/* the badge sits straight; only the letters lean, matching RIZZO */
.gm span{display:inline-block;transform:skewX(-10deg)}
.spark{position:absolute;width:18px;height:18px;color:#7cc8ff;animation:twinkle 2.6s ease-in-out infinite}
.spark.s1{left:8%;top:6%}
.spark.s2{right:6%;top:38%;width:13px;height:13px;animation-delay:.9s;color:#a5b4fc}
.spark.s3{left:20%;bottom:-6%;width:11px;height:11px;animation-delay:1.6s}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.logowrap{position:relative;display:inline-block;padding:4px 30px 10px}
.tag{margin:14px 0 0;color:var(--muted);font-weight:700;font-size:.98rem}

/* ---------- rows of games: each one scrolls sideways, and its heading minimises it ---------- */
.tip{margin:-6px 0 18px;text-align:center;color:var(--muted);font-weight:700;font-size:.82rem}
.sec{margin:0 -16px 18px}
.sech{display:flex;align-items:center;gap:6px;padding:0 16px;margin:0 0 6px}
.sectog{flex:1;display:flex;align-items:center;gap:10px;min-width:0;padding:6px 0;border:0;background:none;color:var(--ink);font:inherit;font-weight:800;font-size:1.08rem;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
.sectog:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.sectog .si{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--accent);flex:none;box-shadow:var(--shadow)}
.sectog .si svg{width:17px;height:17px}
.sec.gold .sectog .si{color:#e0a800}
.sectog small{font-size:.75rem;font-weight:800;color:var(--muted);background:var(--soft);border-radius:99px;padding:1px 8px}
.sectog .chev{width:18px;height:18px;flex:none;color:var(--muted);margin-left:auto;transition:transform .2s}
.sec.min .chev{transform:rotate(-90deg)}
.sec.min .row,.sec.min .arr{display:none}
.sec.min .sectog{color:var(--muted)}
.arr{display:none;flex:none;width:32px;height:32px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;place-items:center}
@media (hover:hover) and (pointer:fine){.arr{display:grid}}
.arr svg{width:16px;height:16px}
.arr.l svg{transform:scaleX(-1)}
.arr:disabled{opacity:.35;cursor:default}
.sec.fits .arr{display:none}
.row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:6px 16px 10px;scroll-padding:0 16px;scrollbar-width:none;overscroll-behavior-x:contain}
.row::-webkit-scrollbar{display:none}
/* a game: its picture as an app icon, with the name underneath */
.tile{--sz:76px;flex:none;width:calc(var(--sz) + 16px);display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:inherit;scroll-snap-align:start;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.ico{position:relative;flex:none;width:var(--sz);height:var(--sz);border-radius:24%;display:grid;place-items:center;overflow:hidden;
  box-shadow:0 6px 16px rgba(23,48,110,.18),inset 0 0 0 1px rgba(255,255,255,.18);transition:transform .15s cubic-bezier(.2,.8,.2,1)}
.ico::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 60%);pointer-events:none}
.ico>svg:first-child{width:80%;height:80%}
.tile:active .ico{transform:scale(.92)}
@media (hover:hover){.tile:hover .ico{transform:translateY(-3px)}}
.tile:focus-visible{outline:0}
.tile:focus-visible .ico{outline:3px solid var(--accent);outline-offset:3px}
.nm{font-weight:800;font-size:.82rem;line-height:1.15;text-align:center;width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{font-weight:700;font-size:.7rem;line-height:1.2;color:var(--muted);text-align:center;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-3px}
.favdot{position:absolute;top:6%;right:6%;z-index:2;width:22%;height:22%;color:#ffd23f;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.45))}
/* small icons (Settings menu → Game icons) */
#games.small .tile{--sz:60px}
#games.small .row{gap:8px}
#games.small .nm{font-size:.74rem}
#games.small .sub{font-size:.66rem}
.nofx .tile{animation:none}

/* ---------- a game's details: press and hold (or right-click) a game ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,12,30,.45);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.sheet.open{opacity:1;visibility:visible;transition:opacity .2s}
.sheetin{position:relative;width:min(480px,100%);background:var(--panel);color:var(--ink);border-radius:24px 24px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 18px);
  box-shadow:var(--shadow-hi);transform:translateY(40px);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.open .sheetin{transform:none}
@media (min-width:600px){.sheet{align-items:center;padding:16px}.sheetin{border-radius:24px;padding-bottom:18px}}
.shead{display:flex;gap:14px;align-items:center;padding-right:36px}
.shead .ico{--sz:76px}
.shead h2{margin:0;font-size:1.3rem;font-weight:800;line-height:1.2}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips span{font-size:.75rem;font-weight:800;color:var(--muted);background:var(--soft);border-radius:99px;padding:2px 9px}
.chips .st{color:var(--ink)}
.sheetin p{color:var(--muted);font-weight:600;line-height:1.45;margin:14px 0 16px}
.sbtns{display:flex;gap:10px}
.sbtns>*{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;font:inherit;font-weight:800;font-size:1rem;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sbtns>*:active{transform:scale(.97)}
.sfav{border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.sfav svg{width:20px;height:20px}
.sfav path{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.sfav[aria-pressed=true] path{fill:#ffd23f;stroke:#e0a800}
.splay{border:0;background:var(--c,var(--accent));color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--c,var(--accent)) 40%,transparent)}
.splay svg{width:18px;height:18px}
.sx{position:absolute;top:14px;right:14px;width:34px;height:34px;padding:0;border:0;border-radius:50%;background:var(--soft);color:var(--muted);cursor:pointer;display:grid;place-items:center}
.sx svg{width:16px;height:16px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* Reduce motion follows the switch in the Settings menu (off unless the player turns it on), not the phone setting */
html.rz-reduce-motion .tile,html.rz-reduce-motion .rz::after,html.rz-reduce-motion .spark{animation:none}
html.rz-reduce-motion .ico,html.rz-reduce-motion .sheet,html.rz-reduce-motion .sheetin{transition:none}
/* coming back from a game, the game shrinks into its icon: skip the slide-in so the two don't fight */
html.rz-vt .tile{animation:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logowrap">
      <svg class="spark s1" viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M10 0l2.2 7.8L20 10l-7.8 2.2L10 20l-2.2-7.8L0 10l7.8-2.2z"/></svg>
      <svg class="spark s2" viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M10 0l2.2 7.8L20 10l-7.8 2.2L10 20l-2.2-7.8L0 10l7.8-2.2z"/></svg>
      <svg class="spark s3" viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M10 0l2.2 7.8L20 10l-7.8 2.2L10 20l-2.2-7.8L0 10l7.8-2.2z"/></svg>
      <h1 class="logo" aria-label="Rizzo Games"><span class="rz" data-t="RIZZO" aria-hidden="true">RIZZO</span><span class="gm" aria-hidden="true"><span>GAMES</span></span></h1>
    </div>
  </header>
  <p class="tip" id="tip"></p>
  <div id="games"></div>
</div>
<div class="sheet" id="sheet" aria-hidden="true"><div class="sheetin" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>

<script>
/* ======================================================================
   THE GAME LIST
   To add a new game:
     1. Put its .html file next to this one (e.g. word-hunt.html)
     2. Add one entry below. Its tags are never shown: they say what kind of game it is, and
        Recommended suggests games whose tags match the ones you spend the most time playing.
        assets lists any other files the game loads (like a word list), so they're saved for offline play too
     3. In the game's file, add the games.js line inside its <head>
        (copy it from the top of games.js). That gives it the Settings menu, shared settings,
        automatic updates and offline play
   That's it. sw.js picks up new games by itself.
   ====================================================================== */
const GAMES = [
  {
    id: 'sudoku',
    name: 'Sudoku',
    file: 'sudoku.html',
    blurb: 'The classic number puzzle! Killer and Paper modes, helpful hints and themes to unlock.',
    colors: ['#3b6fe0', '#7ea6ff'],
    art: 'sudoku',
    cat: 'puzzle',
    tags: ['logic', 'numbers', 'grid', 'calm', 'unlocks'],
    // A little line under the description, read from the game's own saved data
    stat() {
      let recs = {};
      try { recs = JSON.parse(localStorage.getItem('sudoku-records-v1')) || {}; } catch {}
      const wins = Object.values(recs).reduce((n, r) => n + ((r && r.wins) || 0), 0);
      return wins ? `🏆 ${wins.toLocaleString()} win${wins > 1 ? 's' : ''}` : 'No wins yet';
    },
  },
  {
    id: 'ethereal-equus',
    name: 'Ethereal Equus Examination',
    file: 'ethereal-equus.html',
    blurb: 'A racing quiz! Answer fast to stay fuelled, then unlock new cars and planes.',
    colors: ['#7c3aed', '#f472b6'],
    art: 'equus',
    cat: 'quiz',
    tags: ['trivia', 'timed', 'racing', 'unlocks'],
    stat() {
      let g = null;
      try { g = JSON.parse(localStorage.getItem('mr_garage')); } catch {}
      const wins = (g && g.career && g.career.wins) || 0;
      return wins ? `🏆 ${wins.toLocaleString()} win${wins > 1 ? 's' : ''}` : 'No wins yet';
    },
  },
  {
    id: 'minesweeper',
    name: 'Minesweeper',
    file: 'minesweeper.html',
    blurb: 'Classic Minesweeper! Hexagon boards, Time Attack and themes to unlock.',
    colors: ['#16a34a', '#86efac'],
    art: 'mines',
    cat: 'puzzle',
    tags: ['logic', 'grid', 'timed', 'unlocks'],
    stat() {
      let recs = {}, old = {};
      try { recs = JSON.parse(localStorage.getItem('minesweeper-records-v2')) || {}; } catch {}
      try { old = JSON.parse(localStorage.getItem('minesweeper-records-v1')) || {}; } catch {}   // from before the update
      let wins = Object.values(old).reduce((n, r) => n + ((r && r.wins) || 0), 0);
      for (const m of ['classic', 'hex']) for (const r of Object.values(recs[m] || {})) wins += (r && r.wins) || 0;
      return wins ? `🏆 ${wins.toLocaleString()} win${wins > 1 ? 's' : ''}` : 'No wins yet';
    },
  },
  {
    id: 'rizzle',
    name: 'Rizzle',
    file: 'rizzle.html',
    blurb: 'Guess the hidden word! A new Daily word every day, Unlimited play and 4 to 7 letters.',
    colors: ['#3b3f47', '#8b9099'],
    art: 'words',
    cat: ['word', 'puzzle'],
    tags: ['words', 'logic', 'daily'],
    stat() {
      let st = {};
      try { st = JSON.parse(localStorage.getItem('rizzle-stats-v1')) || {}; } catch {}
      const wins = Object.values(st).reduce((n, r) => n + ((r && r.wins) || 0), 0);
      return wins ? `🏆 ${wins.toLocaleString()} win${wins > 1 ? 's' : ''}` : 'No wins yet';
    },
  },
  {
    id: 'wordweave',
    name: 'Word Weave',
    file: 'wordweave.html',
    assets: ['wordweave-words.js'],
    blurb: 'Build crossing words on the board with seven letter tiles. Play the computer on Easy, Medium or Hard, pass and play with friends, or race through Quick fire rounds.',
    colors: ['#d9572c', '#f2b84b'],
    art: 'weave',
    cat: ['word', 'puzzle'],
    tags: ['words', 'strategy', 'vs-computer', 'two-player', 'logic'],
    stat() {
      let st = {};
      try { st = JSON.parse(localStorage.getItem('wordweave-stats-v1')) || {}; } catch {}
      const wins = Object.values(st.cpu || {}).reduce((a, x) => a + (x.wins || 0), 0);
      return wins ? `🏆 ${wins} win${wins > 1 ? 's' : ''} vs the computer` : st.quickBest ? `⚡ Quick fire best ${st.quickBest}` : 'No games yet';
    },
  },
  {
    id: '2048',
    name: '2048',
    file: '2048.html',
    blurb: 'Slide the tiles and join matching numbers to reach 2048! Classic or 3 minute Timed, on boards from 3 × 3 to 6 × 6.',
    colors: ['#4361d8', '#ec4f8a'],
    art: 'twenty48',
    cat: 'number',
    tags: ['numbers', 'grid', 'highscore', 'calm', 'timed'],
    stat() {
      let st = {};
      try { st = JSON.parse(localStorage.getItem('2048-stats-v1')) || {}; } catch {}
      const rows = Object.values(st), wins = rows.reduce((n, r) => n + ((r && r.wins) || 0), 0), best = Math.max(0, ...rows.map(r => (r && r.best) || 0));
      return wins ? `🏆 ${wins.toLocaleString()} win${wins > 1 ? 's' : ''}` : best ? `⭐ Best ${best.toLocaleString()}` : 'No wins yet';
    },
  },
  {
    id: 'solitaire',
    name: 'Solitaire',
    file: 'solitaire.html',
    blurb: 'Classic Klondike patience: build down the columns and get all 52 cards home! Draw 1 or the harder Draw 3, with undo and hints.',
    colors: ['#b91c1c', '#f87171'],
    art: 'solitaire',
    cat: 'cards',
    tags: ['cards', 'calm', 'strategy', 'solo-cards'],
    stat() {
      let st = {};
      try { st = JSON.parse(localStorage.getItem('solitaire-stats-v1')) || {}; } catch {}
      const wins = Object.values(st).reduce((n, r) => n + ((r && r.wins) || 0), 0);
      return wins ? `🏆 ${wins.toLocaleString()} win${wins > 1 ? 's' : ''}` : 'No wins yet';
    },
  },
  {
    id: 'quickmaths',
    name: 'Quick Maths',
    file: 'quickmaths.html',
    blurb: 'Race through 25 quick sums! Add, subtract, multiply, divide or a mix, with or without negative numbers.',
    colors: ['#0d9488', '#2dd4bf'],
    art: 'maths',
    cat: ['number', 'quiz'],
    tags: ['maths', 'numbers', 'timed', 'reflex'],
    stat() {
      let st = {};
      try { st = JSON.parse(localStorage.getItem('quickmaths-stats-v1')) || {}; } catch {}
      const rows = Object.values(st), perfect = rows.reduce((n, r) => n + ((r && r.perfect) || 0), 0), best = Math.max(0, ...rows.map(r => (r && r.bestScore) || 0));
      return perfect ? `🏆 ${perfect.toLocaleString()} perfect` : best ? `⭐ Best ${best}/25` : 'No rounds yet';
    },
  },
  {
    id: 'blockdefence',
    name: 'Block Defence',
    file: 'blockdefence.html',
    blurb: 'Build toy-block towers to protect your Core! Every game has a new random track, with bosses every 10 waves. Played sideways.',
    colors: ['#4f5bd5', '#38bdf8'],
    art: 'defence',
    cat: 'arcade',
    tags: ['strategy', 'building', 'waves', 'action'],
    stat() {
      let st = {};
      try { st = JSON.parse(localStorage.getItem('blockdefence-stats-v1')) || {}; } catch {}
      const rows = Object.values(st), wins = rows.reduce((n, r) => n + ((r && r.wins) || 0), 0), best = Math.max(0, ...rows.map(r => (r && r.best) || 0));
      return wins ? `🏆 ${wins.toLocaleString()} win${wins > 1 ? 's' : ''}` : best ? `⭐ Best ${best} waves` : 'No games yet';
    },
  },
  {
    id: 'blockblast',
    name: 'Block Blast',
    file: 'blockblast.html',
    blurb: 'Fit colourful blocks, clear complete rows and columns, and chase your best score.',
    colors: ['#4f83ed', '#ed6a8b'],
    art: 'blocks',
    cat: ['puzzle', 'arcade'],
    tags: ['grid', 'highscore', 'calm', 'logic', 'blocks'],
    stat() {
      let st = {};
      try { st = JSON.parse(localStorage.getItem('blockblast-stats-v1')) || {}; } catch {}
      return st.games || st.best ? `⭐ Best ${(st.best || 0).toLocaleString()}` : 'No games yet';
    },
  },
  {
    id: 'colourbus',
    name: 'Colour Bus',
    file: 'colourbus.html',
    blurb: 'Send buses round the track to pick up people of their colour and drop off the rest. Only five can be out at once, so plan your order. New places every five levels, and tickets to spend in the shop.',
    colors: ['#2f9e6e', '#facc15'],
    art: 'bus',
    cat: 'puzzle',
    tags: ['logic', 'strategy', 'levels', 'calm', 'sorting'],
    stat() {
      let st = {};
      try { st = JSON.parse(localStorage.getItem('colourbus-progress-v1')) || {}; } catch {}
      return st.wins ? `🚌 Level ${st.level || 1} next · ${st.wins} cleared` : 'No levels yet';

/* ======================================================================
   RECOMMENDED
   Each game's tags (never shown) say what kind of game it is. Your play
   time on each game adds up for its tags, so the tags you spend the most
   time on count the most. Every game is scored by how much of that it
   shares (rare tags count for more than ones most games have), games you
   already play a lot drop down the list, and each pick makes the next
   ones lean away from it, so the row isn't all one kind of game.
   Nothing played yet: one game from each category to start with.
   ====================================================================== */
const tagsOf = g => [...(g.tags || []), ...[].concat(g.cat || []).map(c => 'cat:' + c)];
function recommend(n = 8) {
  const t = {};
  // a game opened before play time was kept counts as a couple of minutes
  GAMES.forEach(g => { t[g.id] = playTime(g.id) || (lastPlayed(g.id) ? 120 : 0); });
  const total = Object.values(t).reduce((a, b) => a + b, 0);
  if (!total) {
    const out = [];
    CATS.forEach(c => { const g = GAMES.find(x => inCat(x, c.id) && !out.includes(x)); if (g) out.push(g); });
    GAMES.forEach(g => { if (out.length < n && !out.includes(g)) out.push(g); });
    return out.slice(0, n).map(g => ({g, why: ''}));
  }
  const like = {}, freq = {};
  GAMES.forEach(g => tagsOf(g).forEach(tag => { freq[tag] = (freq[tag] || 0) + 1; if (t[g.id]) like[tag] = (like[tag] || 0) + t[g.id] * (tag.startsWith('cat:') ? .5 : 1); }));
  const score = g => {
    const ts = tagsOf(g);
    let s = 0; ts.forEach(tag => { s += (like[tag] || 0) / total * Math.log(1 + GAMES.length / freq[tag]); });
    return s / Math.sqrt(ts.length) / (1 + t[g.id] / 900) + 1e-6 * (GAMES.length - GAMES.indexOf(g));   // 15 minutes on a game halves its score
  };
  // games you already play (5 minutes or more) are in Recently played; this row is for finding new ones
  const pool = GAMES.filter(g => t[g.id] < 300).map(g => ({g, s: score(g)})), out = [];
  while (out.length < n && pool.length) {
    pool.sort((a, b) => b.s - a.s);
    const pick = pool.shift(), pt = new Set(tagsOf(pick.g));
    out.push(pick);
    pool.forEach(o => { o.s *= Math.pow(.85, tagsOf(o.g).filter(x => pt.has(x)).length); });
  }
  // the reason shown under it: the game you've played most that has the most in common with it
  return out.map(({g}) => {
    const mine = new Set(g.tags || []);
    let why = null, best = 0;
    GAMES.forEach(h => {
      if (h === g || !t[h.id]) return;
      const shared = (h.tags || []).filter(x => mine.has(x)).length, v = shared * Math.log(1 + t[h.id]);
      if (shared && v > best) { best = v; why = h; }
    });
    return {g, why: why ? 'Like ' + why.name : ''};
  });
}

/* ---------- the category rows, in the order you're most likely to want them ----------
   Each category scores the share of your play time spent on its games, plus how closely its games match
   the tags you play most (the same match as Recommended), averaged over its games so big categories don't
   win just by being big. With no play history they keep their usual order. */
function catOrder() {
  const t = {};
  GAMES.forEach(g => { t[g.id] = playTime(g.id) || (lastPlayed(g.id) ? 120 : 0); });
  const total = Object.values(t).reduce((a, b) => a + b, 0);
  if (!total) return CATS;
  const like = {}, freq = {};
  GAMES.forEach(g => (g.tags || []).forEach(tag => { freq[tag] = (freq[tag] || 0) + 1; if (t[g.id]) like[tag] = (like[tag] || 0) + t[g.id]; }));
  const match = g => { const ts = g.tags || []; let s = 0; ts.forEach(tag => { s += (like[tag] || 0) / total * Math.log(1 + GAMES.length / freq[tag]); }); return ts.length ? s / Math.sqrt(ts.length) : 0; };
  const score = c => { const gs = GAMES.filter(g => inCat(g, c.id)); return gs.length ? gs.reduce((s, g) => s + t[g.id] / total + match(g) * .5, 0) / Math.sqrt(gs.length) : 0; };
  return CATS.map((c, i) => ({c, i, s: score(c)})).sort((a, b) => b.s - a.s || a.i - b.i).map(x => x.c);
}

const gamesEl = document.getElementById('games');
function tile(g, sub, favs, n) {

  return `<a class="tile" href="${esc(g.file)}" data-id="${esc(g.id)}" style="animation-delay:${Math.min(n, 9) * 35}ms" aria-label="${esc(g.name)}${sub ? ', ' + esc(sub) : ''}">
    <span class="ico" style="background:linear-gradient(135deg,${g.colors[0]},${g.colors[1]})">${ART[g.art] || ''}${fav}</span>
    <span class="nm">${esc(g.name)}</span>${sub != null ? `<span class="sub">${esc(sub)}</span>` : ''}</a>`;
}
function sections() {
  const favs = loadFavs(), out = [];
  const recent = GAMES.filter(g => lastPlayed(g.id)).sort((a, b) => lastPlayed(b.id) - lastPlayed(a.id)).slice(0, 12);
  if (recent.length) out.push({id: 'recent', name: 'Recently played', icon: clockIc, items: recent.map(g => [g, null])});
  const rec = recommend(8), anyWhy = rec.some(r => r.why);
  out.push({id: 'for-you', name: recent.length ? 'Recommended for you' : 'Start here', icon: sparkIc, items: rec.map(r => [r.g, anyWhy ? r.why : null])});
  if (favs.length) out.push({id: 'favs', name: 'Favourites', icon: starIc, cls: 'gold', items: favs.map(id => [byId(id), null])});
  catOrder().forEach(c => {
    const gs = GAMES.filter(g => inCat(g, c.id));
    if (gs.length) out.push({id: 'cat-' + c.id, name: c.name, icon: c.icon, count: gs.length, items: gs.sort((a, b) => favs.includes(b.id) - favs.includes(a.id)).map(g => [g, null])});
  });

}
function render(still) {

  const {list, favs} = sections(), min = loadMin();

// The page transition: the icon you tap grows into the game, and the game shrinks back into it.
// A game can be in several rows, so only one of its icons has the name: the first one, or the one you tapped.
const cardName = id => 'rz-card-' + String(id).replace(/[^\w-]/g, '');

/* ---------- press and hold a game (or right-click it) for its details ---------- */

    return;
  }
  if (e.target.closest('.splay')) nameCards(sheet.querySelector('.ico'));   // the icon in here grows into the game
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet.classList.contains('open')) { e.stopImmediatePropagation(); closeSheet(); } }, true);

const touch = !!(window.RizzoGames && RizzoGames.device && RizzoGames.device.touch);
document.getElementById('tip').textContent = touch ? 'Press and hold a game for more about it' : 'Right-click a game for more about it';
render();
// Changing the icon size in the Settings menu: redraw straight away, behind the menu
window.RizzoHooks = Object.assign(window.RizzoHooks || {}, {hubSize: () => render(true)});
// Coming back from a game (or the app waking up) refreshes the rows, the stats and the suggestions
addEventListener('pageshow', e => { if (e.persisted) { closeSheet(); render(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(true); });
addEventListener('resize', () => gamesEl.querySelectorAll('.sec').forEach(arrows));

/* ---------- offline ---------- */
// Updates and settings are handled by games.js (in the <head>), the same as in every game
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  // Ask sw.js to save every game now, so they all work offline even before you've opened them
  navigator.serviceWorker.ready.then(reg => {
    if (reg.active) reg.active.postMessage({type: 'warm', urls: GAMES.flatMap(g => [g.file, ...(g.assets || [])])});
  }).catch(() => {});
}
</script>
</body>
</html>
