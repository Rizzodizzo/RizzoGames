<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rizzo Games</title>
<meta name="theme-color" content="#eef3fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0f1f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<script src="games.js" data-game="hub" data-back="off" data-top="16" data-left="16"></script>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rizzo Games">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Light or dark follows the device setting automatically */
:root{
  --bg:#eef3fc;--panel:#ffffff;--ink:#121a33;--muted:#5f6b88;--line:#dbe3f3;--soft:#e8eefb;
  --accent:#2563eb;--shadow:0 6px 22px rgba(23,48,110,.09);--shadow-hi:0 14px 34px rgba(23,48,110,.16);
  --glow1:rgba(59,130,246,.22);--glow2:rgba(56,189,248,.18);--dots:rgba(37,99,235,.07);
  --logo:linear-gradient(180deg,#8fdcff 0%,#4f9bff 46%,#1d4ed8 54%,#3b7bff 100%);
  --logo-edge:#0f2b7a;--logo-glow:rgba(37,99,235,.35);
  --pill:linear-gradient(90deg,#1d4ed8,#3b8bff);--pill-edge:#0f2b7a;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a0f1f;--panel:#131a2e;--ink:#e8eeff;--muted:#93a0c2;--line:#222c48;--soft:#1b2440;
    --accent:#5b9dff;--shadow:0 6px 22px rgba(0,0,0,.4);--shadow-hi:0 14px 34px rgba(0,0,0,.55);
    --glow1:rgba(59,130,246,.30);--glow2:rgba(34,211,238,.16);--dots:rgba(147,197,253,.06);
    --logo:linear-gradient(180deg,#c6f0ff 0%,#6cb6ff 46%,#2f6bff 54%,#5b9dff 100%);
    --logo-edge:#071643;--logo-glow:rgba(91,157,255,.55);
    --pill:linear-gradient(90deg,#2f6bff,#38bdf8);--pill-edge:#071643;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100dvh;display:flex;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 28px);
}
/* soft blue glows and a faint dot grid behind everything */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60% 38% at 22% 0%,var(--glow1),transparent 70%),
    radial-gradient(50% 32% at 88% 6%,var(--glow2),transparent 70%),
    radial-gradient(circle,var(--dots) 1.2px,transparent 1.6px) 0 0/22px 22px;
}
.app{width:100%;max-width:720px;position:relative;z-index:1}

/* ---------- header ---------- */
header{text-align:center;margin:18px 0 26px}
.logo{margin:0;display:flex;flex-direction:column;align-items:center;font-family:Bungee,Impact,"Arial Black",sans-serif;font-weight:400;line-height:1}
.rz{
  position:relative;display:inline-block;font-size:clamp(3.4rem,18vw,5.6rem);letter-spacing:.03em;
  background:var(--logo);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  transform:skewX(-7deg);
  filter:drop-shadow(0 5px 0 var(--logo-edge)) drop-shadow(0 12px 22px var(--logo-glow));
}
/* a light sweep that glides across RIZZO every few seconds */
.rz::after{
  content:attr(data-t);position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%) 140% 0/260% 100% no-repeat;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:shine 4.5s ease-in-out 1s infinite;
}
@keyframes shine{0%{background-position:140% 0}45%,100%{background-position:-40% 0}}
.gm{
  margin-top:-.05em;display:inline-block;font-size:clamp(1rem,4.6vw,1.35rem);letter-spacing:.45em;
  padding:.42em .5em .42em .95em;border-radius:999px;color:#fff;background:var(--pill);
  box-shadow:0 4px 0 var(--pill-edge),0 10px 20px var(--logo-glow);
}
/* the badge sits straight; only the letters lean, matching RIZZO */
.gm span{display:inline-block;transform:skewX(-10deg)}
.spark{position:absolute;width:18px;height:18px;color:#7cc8ff;animation:twinkle 2.6s ease-in-out infinite}
.spark.s1{left:8%;top:6%}
.spark.s2{right:6%;top:38%;width:13px;height:13px;animation-delay:.9s;color:#a5b4fc}
.spark.s3{left:20%;bottom:-6%;width:11px;height:11px;animation-delay:1.6s}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.logowrap{position:relative;display:inline-block;padding:4px 30px 10px}
.tag{margin:14px 0 0;color:var(--muted);font-weight:700;font-size:.98rem}

/* ---------- categories ---------- */
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 16px;padding:2px 16px 4px;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
@media (min-width:600px){.cats{justify-content:center;flex-wrap:wrap}}
.cat{flex:none;display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);
  font:inherit;font-weight:800;font-size:.9rem;cursor:pointer;box-shadow:var(--shadow);-webkit-tap-highlight-color:transparent;transition:background .2s,color .2s,transform .15s}
.cat svg{width:17px;height:17px;flex:none}
.cat small{font-size:.75rem;font-weight:800;color:var(--muted);background:var(--soft);border-radius:99px;padding:1px 7px}
.cat[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.cat[aria-pressed=true] small{background:rgba(255,255,255,.22);color:#fff}
.cat:active{transform:scale(.94)}
.cat:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sec+.sec{margin-top:24px}
.sech{display:flex;align-items:center;gap:8px;margin:0 2px 10px;font-size:.82rem;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sech svg{width:17px;height:17px}
.sech.favh svg{color:#e0a800}

/* ---------- game cards ---------- */
.games{display:grid;grid-template-columns:1fr;gap:14px;list-style:none;margin:0;padding:0}
@media (min-width:600px){.games{grid-template-columns:1fr 1fr}}
.game{
  display:flex;flex-direction:column;text-decoration:none;color:inherit;
  background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;
  box-shadow:var(--shadow);transition:transform .15s cubic-bezier(.2,.8,.2,1),box-shadow .2s;
  -webkit-tap-highlight-color:transparent;animation:rise .45s cubic-bezier(.2,.8,.2,1) both;
}
.game:active{transform:scale(.97)}
@media (hover:hover){.game:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi)}}
.game:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.art{position:relative;height:128px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.art svg{width:96px;height:96px;position:relative;z-index:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.art::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 60%)}
.body{padding:14px 16px 16px;display:flex;align-items:center;gap:12px}
.txt{flex:1;min-width:0}
.txt h2{margin:0;font-size:1.25rem;font-weight:800}
.txt p{margin:3px 0 0;color:var(--muted);font-size:.92rem;line-height:1.35}
.stat{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:.8rem;font-weight:800;color:var(--ink);background:var(--soft);padding:4px 10px;border-radius:999px}
.stat:empty{display:none}
.go{flex-shrink:0;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--c,var(--accent));color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--c,var(--accent)) 40%,transparent)}
.go svg{width:20px;height:20px}

.soon{
  border:2px dashed var(--line);border-radius:20px;padding:22px 16px;text-align:center;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:120px;
  animation:rise .45s cubic-bezier(.2,.8,.2,1) both;
}
.soon b{color:var(--ink);font-size:1rem}
.soon svg{width:28px;height:28px;opacity:.7}

.games>li{position:relative;display:flex}
.games>li>.game{flex:1}
/* every card the same height: one row per pair, the title has room for two lines */
.games{grid-auto-rows:1fr}
.body{padding:10px 12px 12px 16px;align-items:center}
.txt h2{font-size:1.15rem;line-height:1.2;min-height:2.4em;display:flex;align-items:center}
.stat{margin-top:4px}
@media (max-width:599px){.txt h2{min-height:0}}
/* the description: tap (i) and it covers the picture; tap again, or anywhere else, to close */
.info{position:absolute;top:10px;left:10px;z-index:3;width:36px;height:36px;padding:0;border:0;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:rgba(10,16,40,.28);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);-webkit-tap-highlight-color:transparent;transition:background .2s,transform .15s}
.info svg{width:20px;height:20px}
.info:active{transform:scale(.88)}
.info:focus-visible{outline:3px solid #fff;outline-offset:2px}
li.open .info{background:#fff;color:var(--ink)}
.desc{position:absolute;left:0;right:0;top:0;height:128px;z-index:2;box-sizing:border-box;padding:52px 14px 10px;border-radius:20px 20px 0 0;display:flex;flex-direction:column;justify-content:center;
  background:rgba(8,12,30,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .2s,transform .2s,visibility 0s .2s;cursor:pointer}
.desc p{margin:0;font-size:.84rem;font-weight:600;line-height:1.3;color:rgba(255,255,255,.94)}
li.open .desc{opacity:1;visibility:visible;transform:none;transition:opacity .2s,transform .2s}
html.rz-reduce-motion .desc{transition:none}
/* favourite star: sits on the card's picture, fills in gold when the game is a favourite */
.fav{position:absolute;top:10px;right:10px;z-index:2;width:40px;height:40px;padding:0;border:0;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;background:rgba(10,16,40,.28);color:#fff;-webkit-tap-highlight-color:transparent;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .2s,transform .15s}
.fav svg{width:22px;height:22px;overflow:visible}
.fav path{fill:transparent;stroke:currentColor;stroke-width:2;stroke-linejoin:round;transition:fill .2s,stroke .2s}
.fav[aria-pressed=true]{background:rgba(10,16,40,.38)}
.fav[aria-pressed=true] path{fill:#ffd23f;stroke:#ffd23f}
.fav:active{transform:scale(.88)}
.fav:focus-visible{outline:3px solid #fff;outline-offset:2px}
.fav.pop svg{animation:favpop .45s cubic-bezier(.2,.8,.2,1.4)}
@keyframes favpop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
html.rz-reduce-motion .fav.pop svg{animation:none}
.nofx .game,.nofx .soon{animation:none}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* Reduce motion follows the switch in the Settings menu (off unless the player turns it on), not the phone setting */
html.rz-reduce-motion .game,html.rz-reduce-motion .soon,html.rz-reduce-motion .rz::after,html.rz-reduce-motion .spark{animation:none}
html.rz-reduce-motion .game{transition:none}
/* coming back from a game, the game shrinks into its card: skip the slide-in so the two don't fight */
html.rz-vt .game,html.rz-vt .soon{animation:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logowrap">
      <svg class="spark s1" viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M10 0l2.2 7.8L20 10l-7.8 2.2L10 20l-2.2-7.8L0 10l7.8-2.2z"/></svg>
      <svg class="spark s2" viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M10 0l2.2 7.8L20 10l-7.8 2.2L10 20l-2.2-7.8L0 10l7.8-2.2z"/></svg>
      <svg class="spark s3" viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M10 0l2.2 7.8L20 10l-7.8 2.2L10 20l-2.2-7.8L0 10l7.8-2.2z"/></svg>
      <h1 class="logo" aria-label="Rizzo Games"><span class="rz" data-t="RIZZO" aria-hidden="true">RIZZO</span><span class="gm" aria-hidden="true"><span>GAMES</span></span></h1>
    </div>
    <p class="tag">Pick a game to play</p>
  </header>
  <nav class="cats" id="cats" aria-label="Categories"></nav>
  <div id="games"></div>
</div>

<script>
/* ======================================================================
   THE GAME LIST
   To add a new game:
     1. Put its .html file next to this one (e.g. word-hunt.html)
     2. Add one entry below
     3. In the game's file, add the games.js line inside its <head>
        (copy it from the top of games.js). That gives it the Settings menu, shared settings,
        automatic updates and offline play
   That's it. sw.js picks up new games by itself.
   ====================================================================== */
const GAMES = [
  {
    id: 'sudoku',
    name: 'Sudoku',
    file: 'sudoku.html',
    blurb: 'The classic number puzzle! Killer and Paper modes, helpful hints and themes to unlock.',
    colors: ['#3b6fe0', '#7ea6ff'],
    art: 'sudoku',
    cat: 'puzzle',
    // A little line under the description, read from the game's own saved data
    stat() {
      let recs = {};
      try { recs = JSON.parse(localStorage.getItem('sudoku-records-v1')) || {}; } catch {}
      const wins = Object.values(recs).reduce((n, r) => n + ((r && r.wins) || 0), 0);
      return wins ? `🏆 ${wins.toLocaleString()} win${wins > 1 ? 's' : ''}` : 'No wins yet';
    },
  },
  {
    id: 'ethereal-equus',
    name: 'Ethereal Equus Examination',
    file: 'ethereal-equus.html',
    blurb: 'A racing quiz! Answer fast to stay fuelled, then unlock new cars and planes.',
    colors: ['#7c3aed', '#f472b6'],
    art: 'equus',
    cat: 'quiz',
    stat() {
      let g = null;
      try { g = JSON.parse(localStorage.getItem('mr_garage')); } catch {}
      const wins = (g && g.career && g.career.wins) || 0;
      return wins ? `🏆 ${wins.toLocaleString()} win${wins > 1 ? 's' : ''}` : 'No wins yet';
    },
  },
  {
    id: 'minesweeper',
    name: 'Minesweeper',
    file: 'minesweeper.html',
    blurb: 'Classic Minesweeper! Hexagon boards, Time Attack and themes to unlock.',
    colors: ['#16a34a', '#86efac'],
    art: 'mines',
    cat: 'puzzle',
    stat() {
      let recs = {}, old = {};
      try { recs = JSON.parse(localStorage.getItem('minesweeper-records-v2')) || {}; } catch {}
      try { old = JSON.parse(localStorage.getItem('minesweeper-records-v1')) || {}; } catch {}   // from before the update
      let wins = Object.values(old).reduce((n, r) => n + ((r && r.wins) || 0), 0);
      for (const m of ['classic', 'hex']) for (const r of Object.values(recs[m] || {})) wins += (r && r.wins) || 0;
      return wins ? `🏆 ${wins.toLocaleString()} win${wins > 1 ? 's' : ''}` : 'No wins yet';
    },
  },
  {
    id: 'rizzle',
    name: 'Rizzle',
    file: 'rizzle.html',
    blurb: 'Guess the hidden word! A new Daily word every day, Unlimited play and 4 to 7 letters.',
    colors: ['#3b3f47', '#8b9099'],
    art: 'words',
    cat: 'word',
    stat() {
      let st = {};
      try { st = JSON.parse(localStorage.getItem('rizzle-stats-v1')) || {}; } catch {}
      const wins = Object.values(st).reduce((n, r) => n + ((r && r.wins) || 0), 0);
      return wins ? `🏆 ${wins.toLocaleString()} win${wins > 1 ? 's' : ''}` : 'No wins yet';
    },
  },
  {
    id: '2048',
    name: '2048',
    file: '2048.html',
    blurb: 'Slide the tiles and join matching numbers to reach 2048! Classic or 3 minute Timed, on boards from 3 × 3 to 6 × 6.',
    colors: ['#f59563', '#edc22e'],
    art: 'twenty48',
    cat: 'number',
    stat() {
      let st = {};
      try { st = JSON.parse(localStorage.getItem('2048-stats-v1')) || {}; } catch {}
      const rows = Object.values(st), wins = rows.reduce((n, r) => n + ((r && r.wins) || 0), 0), best = Math.max(0, ...rows.map(r => (r && r.best) || 0));
      return wins ? `🏆 ${wins.toLocaleString()} win${wins > 1 ? 's' : ''}` : best ? `⭐ Best ${best.toLocaleString()}` : 'No wins yet';
    },
  },
];

/* ---------- card art (simple inline drawings, no image files needed) ---------- */
const ART = {
  sudoku: `<svg viewBox="0 0 96 96" aria-hidden="true">
    <rect x="6" y="6" width="84" height="84" rx="14" fill="#fff"/>
    <rect x="35.5" y="35.5" width="25" height="25" fill="#c7d6fb"/>
    <path d="M34 8v80M62 8v80M8 34h80M8 62h80" stroke="#1c2130" stroke-width="3"/>
    <rect x="6" y="6" width="84" height="84" rx="14" fill="none" stroke="#1c2130" stroke-width="4"/>
    <g font-family="Nunito,system-ui,sans-serif" font-weight="800" font-size="19" text-anchor="middle" fill="#1c2130">
      <text x="20" y="27">5</text><text x="76" y="27">3</text><text x="48" y="55" fill="#2f5bd3">7</text>
      <text x="20" y="83">9</text><text x="76" y="55">1</text><text x="48" y="83">4</text>
    </g></svg>`,
  // the race seen from above: grass, the road with its lane lines, your red car ahead of a blue rival (the game's colours)
  equus: `<svg viewBox="0 0 96 96" aria-hidden="true">
    <defs><clipPath id="eqbox"><rect x="6" y="6" width="84" height="84" rx="14"/></clipPath></defs>
    <g clip-path="url(#eqbox)">
      <rect x="6" y="6" width="84" height="84" fill="#6fa35b"/>
      <rect x="22" y="6" width="52" height="84" fill="#3a4347"/>
      <path d="M22 6v84M74 6v84" stroke="#f3efe6" stroke-width="2"/>
      <path d="M48 4v92" stroke="#f3efe6" stroke-width="2.4" stroke-dasharray="8 7"/>
      <circle cx="13" cy="22" r="4" fill="#5b9049"/><circle cx="83" cy="58" r="4.5" fill="#5b9049"/><circle cx="12" cy="76" r="3.5" fill="#5b9049"/>
    </g>
    <g transform="translate(61 62)">
      <rect x="-8" y="-13" width="16" height="26" rx="5" fill="#2a6f97"/>
      <rect x="-5.5" y="-7" width="11" height="6" rx="1.5" fill="#bfe3f5"/><rect x="-5.5" y="5" width="11" height="4" rx="1.5" fill="#bfe3f5" opacity=".8"/>
      <rect x="-10" y="-9" width="2.5" height="6" rx="1" fill="#1c2226"/><rect x="7.5" y="-9" width="2.5" height="6" rx="1" fill="#1c2226"/>
      <rect x="-10" y="4" width="2.5" height="6" rx="1" fill="#1c2226"/><rect x="7.5" y="4" width="2.5" height="6" rx="1" fill="#1c2226"/></g>
    <g transform="translate(35 36)">
      <rect x="-9" y="-15" width="18" height="30" rx="6" fill="#e4572e"/>
      <rect x="-3" y="-15" width="6" height="30" fill="#fff" opacity=".85"/>
      <rect x="-6.5" y="-8" width="13" height="7" rx="1.8" fill="#ffe2d6"/><rect x="-6.5" y="6" width="13" height="4.5" rx="1.8" fill="#ffe2d6" opacity=".8"/>
      <rect x="-11.5" y="-11" width="3" height="7" rx="1" fill="#1c2226"/><rect x="8.5" y="-11" width="3" height="7" rx="1" fill="#1c2226"/>
      <rect x="-11.5" y="5" width="3" height="7" rx="1" fill="#1c2226"/><rect x="8.5" y="5" width="3" height="7" rx="1" fill="#1c2226"/></g>
    <rect x="6" y="6" width="84" height="84" rx="14" fill="none" stroke="#2f5a2c" stroke-width="4"/></svg>`,
  // a patch of grass tiles with a dug-up corner, a number, a flag and a mine
  mines: `<svg viewBox="0 0 96 96" aria-hidden="true">
    <rect x="6" y="6" width="84" height="84" rx="14" fill="#aad751"/>
    <path d="M34 6h28v28H34zM6 34h28v28H6zM62 34h28v28H62zM34 62h28v28H34z" fill="#a2d149"/>
    <path d="M20 6h14v28H6V20A14 14 0 0 1 20 6z" fill="#e5c29f"/><path d="M34 6h28v28H34z" fill="#d7b899"/><path d="M6 34h28v28H6z" fill="#d7b899"/>
    <g font-family="Nunito,system-ui,sans-serif" font-weight="900" font-size="20" text-anchor="middle">
      <text x="20" y="27" fill="#1976d2">1</text><text x="48" y="27" fill="#388e3c">2</text><text x="20" y="55" fill="#1976d2">1</text></g>
    <path d="M44 86V66" stroke="#3b2a1a" stroke-width="3" stroke-linecap="round"/><path d="M45 66l12 5-12 5z" fill="#ef3b2d"/>
    <g transform="translate(76 48)"><g stroke="#1b1b1b" stroke-width="2.6" stroke-linecap="round"><path d="M0-11v22M-11 0h22M-8-8l16 16M8-8L-8 8"/></g>
      <circle r="7.5" fill="#1b1b1b"/><circle cx="-2.6" cy="-2.6" r="2" fill="#fff" opacity=".85"/></g>
    <rect x="6" y="6" width="84" height="84" rx="14" fill="none" stroke="#2f5a1a" stroke-width="3" opacity=".5"/></svg>`,
  // a 2048 board in a box: four tiles growing up to the gold 2048
  twenty48: `<svg viewBox="0 0 96 96" aria-hidden="true">
    <rect x="6" y="6" width="84" height="84" rx="14" fill="#bbada0"/>
    <g font-family="Nunito,system-ui,sans-serif" font-weight="900" text-anchor="middle">
      <rect x="13" y="13" width="33" height="33" rx="6" fill="#eee4da"/><text x="29.5" y="37" font-size="21" fill="#776e65">2</text>
      <rect x="50" y="13" width="33" height="33" rx="6" fill="#f2b179"/><text x="66.5" y="37" font-size="21" fill="#fff">8</text>
      <rect x="13" y="50" width="33" height="33" rx="6" fill="#edcf72"/><text x="29.5" y="72" font-size="15" fill="#fff">128</text>
      <rect x="50" y="50" width="33" height="33" rx="6" fill="#edc22e"/><text x="66.5" y="71.5" font-size="12" fill="#fff">2048</text></g>
    <rect x="6" y="6" width="84" height="84" rx="14" fill="none" stroke="#776e65" stroke-width="4"/></svg>`,
  // three rows of letter tiles, the last one solved
  words: `<svg viewBox="0 0 96 96" aria-hidden="true"><g font-family="Nunito,system-ui,sans-serif" font-weight="900" font-size="15" text-anchor="middle" fill="#fff">
    <rect x="8" y="10" width="24" height="24" rx="5" fill="#878c95"/><rect x="36" y="10" width="24" height="24" rx="5" fill="#d9a92c"/><rect x="64" y="10" width="24" height="24" rx="5" fill="#878c95"/>
    <text x="20" y="27.5">T</text><text x="48" y="27.5">W</text><text x="76" y="27.5">O</text>
    <rect x="8" y="38" width="24" height="24" rx="5" fill="#878c95"/><rect x="36" y="38" width="24" height="24" rx="5" fill="#4aa564"/><rect x="64" y="38" width="24" height="24" rx="5" fill="#4aa564"/>
    <text x="20" y="55.5">S</text><text x="48" y="55.5">A</text><text x="76" y="55.5">X</text>
    <rect x="8" y="66" width="24" height="24" rx="5" fill="#4aa564"/><rect x="36" y="66" width="24" height="24" rx="5" fill="#4aa564"/><rect x="64" y="66" width="24" height="24" rx="5" fill="#4aa564"/>
    <text x="20" y="83.5">W</text><text x="48" y="83.5">A</text><text x="76" y="83.5">X</text></g></svg>`,
};
const arrow = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>`;
const plus = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]);
const lastPlayed = id => +(localStorage.getItem('hub-last-' + id) || 0);
// Favourites: starred games always stay at the top
const FAV_KEY = 'hub-favs';
const loadFavs = () => { try { const f = JSON.parse(localStorage.getItem(FAV_KEY)); return Array.isArray(f) ? f : []; } catch { return []; } };
const infoIc = `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 10.8v6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="7.3" r="1.5" fill="currentColor"/></svg>`;
const star = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.7 6.3.9-4.55 4.45 1.07 6.25L12 17.15 6.38 20.1l1.07-6.25L2.9 9.4l6.3-.9z"/></svg>`;

// Categories: each game has one; the chips at the top show them all, or just one
const CATS = [
  {id: 'puzzle', name: 'Puzzles', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M9.2 3.5v17M14.8 3.5v17M3.5 9.2h17M3.5 14.8h17"/></svg>'},
  {id: 'word', name: 'Words', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18L7.5 6 12 18M4.6 14h5.8"/><path d="M15 10.5c.8-.7 1.7-1 2.8-1 1.9 0 3.2 1.1 3.2 3V18m0-4.2c-.9-.5-1.9-.8-3-.8-1.9 0-3.3.9-3.3 2.6 0 1.5 1.1 2.4 2.7 2.4 1.5 0 2.7-.7 3.6-2"/></svg>'},
  {id: 'quiz', name: 'Quiz', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2.5L5 13.5h6l-1 8 8-11h-6z"/></svg>'},
  {id: 'number', name: 'Numbers', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5l2-1.5v10M10 9.5a2 2 0 0 1 4 0c0 2-4 3.5-4 7.5h4.2M17 7.5h3.5l-2 3a2.6 2.6 0 1 1-2.2 4.4"/></svg>'},
  {id: 'arcade', name: 'Arcade', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M7.5 10.5v4M5.5 12.5h4"/><circle cx="15.5" cy="11.5" r="1" fill="currentColor"/><circle cx="18" cy="13.5" r="1" fill="currentColor"/></svg>'},
  {id: 'cards', name: 'Cards', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3.5" width="12" height="17" rx="2.5"/><path d="M4.5 6.5v11.5a2.5 2.5 0 0 0 2 2.4"/></svg>'},
];
const CAT_KEY = 'hub-cat';
const allIc = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>';
const starIc = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.8l2.8 5.7 6.3.9-4.55 4.45 1.07 6.25L12 17.15 6.38 20.1l1.07-6.25L2.9 9.4l6.3-.9z"/></svg>';
let cat = (() => { try { return localStorage.getItem(CAT_KEY) || 'all'; } catch { return 'all'; } })();

function card(g, n, isFav) {
  let stat = '';
  try { stat = g.stat ? g.stat() : ''; } catch {}
  const f = isFav(g.id);
  return `<li><a class="game" href="${esc(g.file)}" style="animation-delay:${n * 60}ms;--c:${g.colors[0]};view-transition-name:rz-card-${g.id}" aria-label="Play ${esc(g.name)}">
      <div class="art" style="background:linear-gradient(135deg,${g.colors[0]},${g.colors[1]})">${ART[g.art] || ''}</div>
      <div class="body">
        <div class="txt"><h2>${esc(g.name)}</h2><span class="stat">${esc(stat)}</span></div>
        <span class="go">${arrow}</span>
      </div></a>
      <button class="info" data-id="${esc(g.id)}" aria-expanded="false" aria-label="About ${esc(g.name)}">${infoIc}</button>
      <div class="desc" role="note"><p>${esc(g.blurb)}</p></div>
      <button class="fav" data-id="${esc(g.id)}" aria-pressed="${f}" aria-label="${f ? 'Remove ' + esc(g.name) + ' from favourites' : 'Add ' + esc(g.name) + ' to favourites'}" style="view-transition-name:rz-fav-${g.id}">${star}</button></li>`;
}
function render(still) {
  const favs = loadFavs(), isFav = id => favs.includes(id);
  // the chips: All, then each category that has games in it
  const used = CATS.filter(c => GAMES.some(g => g.cat === c.id));
  if (cat !== 'all' && !used.some(c => c.id === cat)) cat = 'all';
  document.getElementById('cats').innerHTML = [{id: 'all', name: 'All', icon: allIc}, ...used].map(c =>
    `<button class="cat" data-cat="${c.id}" aria-pressed="${cat === c.id}">${c.icon}${c.name}${c.id === 'all' ? '' : `<small>${GAMES.filter(g => g.cat === c.id).length}</small>`}</button>`).join('');
  // most recently played first, favourites before the rest
  const order = list => list.map(g => ({...g, k: GAMES.indexOf(g)})).sort((a, b) => (isFav(b.id) - isFav(a.id)) || lastPlayed(b.id) - lastPlayed(a.id) || a.k - b.k);
  const sections = [];
  if (cat === 'all') {
    const fav = order(GAMES.filter(g => isFav(g.id)));
    if (fav.length) sections.push({head: `<h3 class="sech favh">${starIc}Favourites</h3>`, games: fav});
    used.forEach(c => { const gs = order(GAMES.filter(g => g.cat === c.id && !isFav(g.id))); if (gs.length) sections.push({head: `<h3 class="sech">${c.icon}${c.name}</h3>`, games: gs}); });
  } else sections.push({head: '', games: order(GAMES.filter(g => g.cat === cat))});
  const el = document.getElementById('games');
  el.classList.toggle('nofx', !!still);           // re-sorting after a tap shouldn't replay the slide-in
  let n = 0;
  el.innerHTML = sections.map((s, k) => `<section class="sec">${s.head}<ul class="games">${s.games.map(g => card(g, n++, isFav)).join('')}${
    k === sections.length - 1 && cat === 'all' ? `<li class="soon" style="animation-delay:${n * 60}ms;view-transition-name:rz-soon">${plus}<b>More games on the way</b><span>New ones will show up here</span></li>` : ''}</ul></section>`).join('');
}
document.getElementById('cats').addEventListener('click', e => {
  const b = e.target.closest('.cat'); if (!b || b.dataset.cat === cat) return;
  cat = b.dataset.cat;
  try { localStorage.setItem(CAT_KEY, cat); } catch {}
  const redo = () => render(true);
  if (document.startViewTransition && !document.documentElement.classList.contains('rz-reduce-motion')) document.startViewTransition(redo);
  else redo();
});
const closeDesc = except => document.querySelectorAll('.games>li.open').forEach(li => { if (li !== except) { li.classList.remove('open'); li.querySelector('.info').setAttribute('aria-expanded', 'false'); } });
document.getElementById('games').addEventListener('click', e => {
  const inf = e.target.closest('.info');
  if (inf) {
    e.preventDefault(); e.stopPropagation();
    const li = inf.closest('li'), on = !li.classList.contains('open');
    closeDesc(li); li.classList.toggle('open', on); inf.setAttribute('aria-expanded', on);
    return;
  }
  if (e.target.closest('.desc')) { e.preventDefault(); closeDesc(); return; }
  const b = e.target.closest('.fav'); if (!b) return;
  e.preventDefault(); e.stopPropagation();
  const id = b.dataset.id, favs = loadFavs(), on = !favs.includes(id);
  const next = on ? [...favs, id] : favs.filter(x => x !== id);
  try { localStorage.setItem(FAV_KEY, JSON.stringify(next)); } catch {}
  const redo = () => {
    render(true);
    const nb = document.querySelector(`.fav[data-id="${CSS.escape(id)}"]`);
    if (nb && on) nb.classList.add('pop');
  };
  // the cards glide into their new places
  if (document.startViewTransition && !document.documentElement.classList.contains('rz-reduce-motion')) document.startViewTransition(redo);
  else redo();
});
document.addEventListener('click', e => { if (!e.target.closest('.info, .desc')) closeDesc(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDesc(); });
render();
// Coming back from a game (or the app waking up) refreshes the stats and the order
addEventListener('pageshow', () => render());
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(true); });

/* ---------- offline ---------- */
// Updates and settings are handled by games.js (in the <head>), the same as in every game
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  // Ask sw.js to save every game now, so they all work offline even before you've opened them
  navigator.serviceWorker.ready.then(reg => {
    if (reg.active) reg.active.postMessage({type: 'warm', urls: GAMES.map(g => g.file)});
  }).catch(() => {});
}
</script>
</body>
</html>
