<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colour Bus</title>
<meta name="theme-color" content="#f3f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10131b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<script src="games.js" data-game="colourbus" data-show-when="#home:not(.hidden)" data-hide-when=".cover:not(.hidden), #game:not(.hidden), #shop:not(.hidden)" data-sounds="sfx" data-top="16" data-left="16" data-pill-top="64"></script>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Colour Bus">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ======================================================================
   COLOUR BUS. The menus follow the device's light or dark setting; the
   game screen takes the colours of the level's place. Upright only.
   ====================================================================== */
:root{--ease:cubic-bezier(.2,.8,.2,1);--pop:cubic-bezier(.34,1.56,.64,1);
  --bg:#f3f6fb;--panel:#ffffff;--ink:#1f2a44;--muted:#6b7894;--line:#dde3ee;--soft:#e8edf6;
  --accent:#2f9e6e;--hi:#43b985;--edge:#1f7a52;--onaccent:#ffffff;--shade:rgba(30,45,90,.10);--bad:#e5484d;
  --road:#d5dbe8;--roadEdge:#bcc5d6;--lane:#ffffff;--cell:#e9eef6;--bay:#c9d1e0;
  --glass:rgba(255,255,255,.9);--rz-btn-bg:var(--panel);--rz-btn-fg:var(--accent);--rz-btn-border:1px solid var(--line);--rz-btn-radius:12px;--rz-btn-shadow:0 2px 8px var(--shade);--rz-btn-size:42px}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --bg:#10131b;--panel:#1a1f2b;--ink:#e8eefc;--muted:#97a3bd;--line:#2a3244;--soft:#232a39;
  --accent:#4fd18f;--hi:#7be0ac;--edge:#2a8a5a;--onaccent:#06210f;--shade:rgba(0,0,0,.45);--bad:#ef5a52;
  --glass:rgba(26,31,43,.9);--road:#2e3649;--roadEdge:#3d4762;--lane:#5a6680;--cell:#161b26;--bay:#262d3d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 8px) calc(env(safe-area-inset-left,0px) + 12px)}
.primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 26px;border-radius:16px;background:var(--accent);color:var(--onaccent);
  font-weight:900;font-size:1.1rem;box-shadow:0 4px 0 var(--edge);transition:transform .1s}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.ghost{min-height:46px;padding:0 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:800;box-shadow:0 2px 6px var(--shade)}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:0 2px 8px var(--shade);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* tickets */
.tk{width:26px;height:18px;flex:none;display:inline-block;vertical-align:-3px}
.wallet{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 15px 0 11px;border-radius:99px;background:#ffffff;color:#1f2a44;font-weight:900;font-size:1.08rem;
  box-shadow:0 3px 0 rgba(0,0,0,.14),0 8px 18px rgba(0,0,0,.12);font-variant-numeric:tabular-nums}
.wallet.bump{animation:bump .45s var(--pop)}
@keyframes bump{40%{transform:scale(1.2)}}

/* home: the next level's track with buses going round, the title over it, and a panel at the bottom */
#home{padding:0;overflow:hidden;background:#8fd16a}
#hcv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hshade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 24%,rgba(0,0,0,0) 52%,rgba(8,14,28,.42) 100%)}
.hbar{position:absolute;z-index:2;top:calc(env(safe-area-inset-top,0px) + 16px);right:calc(env(safe-area-inset-right,0px) + 16px)}
.logo{position:absolute;z-index:1;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 66px);text-align:center;pointer-events:none}
.logo h1{margin:0;font-size:clamp(3.1rem,16vw,4.8rem);font-weight:900;line-height:.86;letter-spacing:-.02em;color:#ffffff;
  text-shadow:0 3px 0 #1f2a44,0 -2px 0 #1f2a44,2px 0 0 #1f2a44,-2px 0 0 #1f2a44,0 7px 0 #1f2a44,0 12px 20px rgba(0,0,0,.3)}
.logo h1 i{font-style:normal;display:inline-block;animation:hop 2.4s var(--ease) infinite}
.logo h1 .w2{color:#facc15;font-size:1.12em;letter-spacing:.02em}
@keyframes hop{0%,70%,100%{transform:none}80%{transform:translateY(-8px) rotate(-4deg)}90%{transform:translateY(0) rotate(2deg)}}
.hpanel{position:absolute;z-index:2;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:calc(100% - 24px);max-width:440px;margin:0 auto;padding:16px 16px 12px;
  border-radius:28px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.28);animation:rise .5s var(--pop)}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
.hhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hk{font-size:.72rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hlv{font-size:2rem;font-weight:900;line-height:1.05}
.theme{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--soft);font-weight:900;font-size:.9rem}
.theme span{font-size:1.15rem}
.hpanel .chips{justify-content:flex-start;margin-top:6px}
.trip{display:flex;align-items:center;gap:0;margin:14px 2px 2px}
.trip .st{position:relative;width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--soft);border:3px solid var(--line);font-size:.7rem;font-weight:900;color:var(--muted)}
.trip .st.done{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.trip .st.now{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 4px rgba(47,158,110,.2);animation:pulse 1.4s ease-in-out infinite}
.trip .st.hot::after{content:'🔥';position:absolute;top:-13px;right:-8px;font-size:.8rem}
.trip .rd{flex:1;height:5px;background:var(--line);margin:0 -1px}
.trip .rd.done{background:var(--accent)}
.trip .nx{margin-left:10px;font-size:.78rem;font-weight:900;color:var(--muted);white-space:nowrap}
.primary.big{width:100%;min-height:62px;margin-top:14px;font-size:1.4rem;border-radius:20px}
.primary.big svg{width:22px;height:22px;fill:currentColor}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 9px;border-radius:16px;background:var(--panel);border:1px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:900;font-size:.82rem;transition:transform .1s}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tile svg{width:28px;height:28px}
.tile .ping{display:none;position:absolute;top:7px;right:12px;width:11px;height:11px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 3px var(--panel);animation:pulse 1s ease-in-out infinite}
.tile.ready .ping{display:block}
.hstats{margin-top:10px;text-align:center;font-size:.8rem;font-weight:800;color:var(--muted)}
.hrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* shop */
#shop{gap:10px}
#shop .top h2{text-align:left;padding-left:4px}
.hero{position:relative;flex:none;height:min(30vh,230px);border-radius:24px;overflow:hidden;background:radial-gradient(120% 90% at 50% 20%,#d5f0ff,#86c9f0);box-shadow:inset 0 -10px 30px rgba(0,0,0,.08)}
#scv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero .tag{position:absolute;left:12px;top:10px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.85);color:#1f2a44;font-weight:900;font-size:.8rem}
.tabs{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--soft);flex:none}
.tabs button{flex:1;height:38px;border-radius:12px;font-weight:900;font-size:.88rem;color:var(--muted)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 2px 6px var(--shade)}
.items{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;padding:2px 2px 90px;-webkit-overflow-scrolling:touch}
.item{display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:7px 7px 9px;border-radius:18px;background:var(--panel);border:2px solid var(--line);box-shadow:0 2px 8px var(--shade);text-align:center;transition:transform .12s}
.item:active{transform:scale(.97)}
.item canvas{width:100%;height:92px;display:block;border-radius:12px;background:linear-gradient(#e7f5ff,#cfe9fa)}
.item b{font-weight:900;font-size:.95rem;margin-top:3px}
.item .st{font-size:.82rem;font-weight:900;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:4px;min-height:20px}
.item .st .tk{width:20px;height:14px}
.item .st.no{color:var(--bad)}
.item.eq .st{color:var(--accent)}
.item.sel{border-color:var(--accent);box-shadow:0 0 0 4px rgba(47,158,110,.22)}
.shopbar{position:fixed;z-index:5;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:calc(100% - 24px);max-width:440px;margin:0 auto}
.shopbar .primary{width:100%;min-height:56px}
.primary[disabled]{opacity:.55;box-shadow:none;transform:none}
.shopbar .primary[disabled]{opacity:1;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.primary .tk{width:28px;height:19px}

/* game */
#game{padding:calc(env(safe-area-inset-top,0px) + 10px) 0 0;gap:6px}
#game .top,#game .slots{padding:0 calc(env(safe-area-inset-right,0px) + 12px) 0 calc(env(safe-area-inset-left,0px) + 12px)}
.top{display:flex;align-items:center;gap:10px;flex:none}
.top h2{margin:0;font-size:1.15rem;font-weight:900;flex:1;text-align:center}
#game{background:var(--gbg,var(--bg));color:var(--gink,var(--ink))}
#game .iconbtn{background:#ffffff;color:#1f2a44;border:0;box-shadow:0 3px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.12)}
.ttl{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.top h2{font-size:1.35rem;letter-spacing:-.01em}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;background:var(--c,#1f2a44);color:#fff;font-size:.74rem;font-weight:900;letter-spacing:.02em;box-shadow:0 2px 0 rgba(0,0,0,.18);white-space:nowrap}
.chip.hard{background:linear-gradient(90deg,#ff5a3c,#ff2d6f);animation:pulse 1.6s ease-in-out infinite}
.card .chips{margin-bottom:10px}
.slots{display:flex;align-items:center;gap:6px;justify-content:center;flex:none;font-weight:900;font-size:.85rem;height:26px;color:var(--gink,var(--ink))}
.slots i{position:relative;display:inline-block;width:28px;height:15px;border-radius:5px;background:rgba(255,255,255,.55);border:2px solid rgba(0,0,0,.18);transition:background .2s,transform .2s}
.slots i b{position:absolute;right:3px;top:2px;width:4px;height:7px;border-radius:2px;background:rgba(0,0,0,.15)}
.slots i.on{background:#1f2a44;border-color:#1f2a44;transform:translateY(-1px)}
.slots i.on b{background:#9fd3ff}
.slots.full i.on{background:var(--bad);border-color:var(--bad)}
#game.night .slots i{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
#game.night .slots i.on{background:#ffe27a;border-color:#ffe27a}
.slots.shake{animation:shake .35s}
.slots .ff{margin-left:4px;padding:2px 9px;border-radius:99px;background:var(--accent);color:var(--onaccent);font-size:.8rem;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.field{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* end of level */
.cover{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(10,14,24,.5);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.card{width:min(360px,100%);padding:24px 22px 22px;border-radius:24px;background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.25);text-align:center;animation:pop .35s var(--pop)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card h3{margin:0 0 6px;font-size:1.7rem;font-weight:900}
.card p{margin:0 0 18px;color:var(--muted);font-weight:700;line-height:1.45}
.card .hrow .primary{flex:1}
.card.win h3{font-size:1.9rem}
.reward{display:flex;align-items:center;justify-content:center;gap:10px;margin:-4px 0 10px;font-size:2.4rem;font-weight:900;color:#e09a00;font-variant-numeric:tabular-nums}
.reward .tk{width:48px;height:33px;animation:spin 1s var(--pop)}
@keyframes spin{from{transform:rotate(-30deg) scale(.4)}}
.rlines{list-style:none;margin:0 0 14px;padding:8px 14px;border-radius:14px;background:var(--soft);text-align:left;font-weight:800;font-size:.92rem}
.rlines li{display:flex;justify-content:space-between;padding:3px 0;opacity:0;animation:fadein .3s forwards}
.rlines li b{color:#c98a00}
@keyframes fadein{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.nudge{margin:-4px 0 14px;font-weight:800;color:var(--accent);font-size:.92rem}
.confetti{position:fixed;inset:0;z-index:25;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-24px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg)}}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:2px 0 16px}
.days div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:12px;background:var(--soft);font-size:.68rem;font-weight:900;color:var(--muted)}
.days div .tk{width:20px;height:14px}
.days div b{font-size:.85rem;color:var(--ink)}
.days div.now b{color:#5a3d00}
.days div.got{background:rgba(47,158,110,.16);color:var(--accent)}
.days div.now{background:#ffc62e;color:#5a3d00;box-shadow:0 3px 0 #c98a00}
.bigtk{display:block;width:90px;height:62px;margin:0 auto 10px;animation:spin .8s var(--pop)}
.how ul{margin:0 0 18px;padding-left:20px;text-align:left;font-weight:700;line-height:1.5;color:var(--ink)}
.how li{margin-bottom:6px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translate(-50%,-20px);opacity:0;padding:10px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:800;pointer-events:none;transition:.25s;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* upright only: on a phone held sideways, ask to turn it */
#rotate{display:none;position:fixed;inset:0;z-index:40;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:900;font-size:1.2rem;text-align:center;padding:20px}
#rotate svg{width:64px;height:64px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;animation:turn 2.4s var(--ease) infinite}
@keyframes turn{0%,30%{transform:rotate(90deg)}60%,100%{transform:rotate(0)}}
@media (orientation:landscape) and (max-height:600px){#rotate{display:flex}}
html.rz-reduce-motion *{animation-duration:.01ms!important;transition-duration:.01ms!important}
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<section class="screen" id="home">
  <canvas id="hcv" aria-hidden="true"></canvas>
  <div class="hshade"></div>
  <div class="hbar"><div class="wallet" aria-label="Tickets"><span class="tkc"></span><b class="tkn">0</b></div></div>
  <div class="logo"><h1><i>Colour</i><br><i class="w2" style="animation-delay:.25s">Bus</i></h1></div>
  <div class="hpanel">
    <div class="hhead"><div><div class="hk">Next up</div><div class="hlv">Level <span id="hLevel">1</span></div></div><div class="theme" id="hTheme"></div></div>
    <div class="chips" id="hChips"></div>
    <div class="trip" id="hTrip"></div>
    <button class="primary big" id="playBtn"><svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>Play</button>
    <div class="hgrid">
      <button class="tile" id="shopBtn"><svg viewBox="0 0 32 32"><path d="M6 11h20l-1.6 15.2a2 2 0 0 1-2 1.8H9.6a2 2 0 0 1-2-1.8z" fill="#ff7ab8" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><path d="M11 13V9a5 5 0 0 1 10 0v4" fill="none" stroke="#1f2a44" stroke-width="2.4" stroke-linecap="round"/><circle cx="16" cy="19.5" r="2.6" fill="#ffd24a" stroke="#1f2a44" stroke-width="1.6"/></svg>Shop</button>
      <button class="tile" id="giftBtn"><svg viewBox="0 0 32 32"><rect x="5" y="13" width="22" height="15" rx="2.5" fill="#4fb3ff" stroke="#1f2a44" stroke-width="2"/><rect x="3.5" y="9" width="25" height="6" rx="2" fill="#7cc8ff" stroke="#1f2a44" stroke-width="2"/><path d="M16 9v19" stroke="#ff5a5f" stroke-width="3.4"/><path d="M16 9c-2-5-8-5-7-1.5S14 9 16 9zm0 0c2-5 8-5 7-1.5S18 9 16 9z" fill="#ff5a5f" stroke="#1f2a44" stroke-width="1.6" stroke-linejoin="round"/></svg>Daily gift<i class="ping"></i></button>
      <button class="tile" id="howBtn"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#ffd24a" stroke="#1f2a44" stroke-width="2"/><path d="M12.5 12.5a3.6 3.6 0 1 1 5 3.3c-1 .5-1.5 1.2-1.5 2.3v.6" fill="none" stroke="#1f2a44" stroke-width="2.6" stroke-linecap="round"/><circle cx="16" cy="22.6" r="1.6" fill="#1f2a44"/></svg>How to play</button>
    </div>
    <div class="hstats" id="hStats"></div>
  </div>
</section>

<!-- ================= SHOP ================= -->
<section class="screen hidden" id="shop">
  <div class="top">
    <button class="iconbtn" id="shopBack" aria-label="Back to the menu"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2>Shop</h2>
    <div class="wallet" aria-label="Tickets"><span class="tkc"></span><b class="tkn">0</b></div>
  </div>
  <div class="hero"><canvas id="scv" aria-hidden="true"></canvas><span class="tag" id="heroTag"></span></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="items" id="items"></div>
  <div class="shopbar"><button class="primary" id="shopAct"></button></div>
</section>

<!-- ================= GAME ================= -->
<section class="screen hidden" id="game">
  <div class="top">
    <button class="iconbtn" id="backBtn" aria-label="Back to the menu"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ttl"><h2 id="lvTitle">Level 1</h2><div class="chips" id="chips"></div></div>
    <button class="iconbtn" id="againBtn" aria-label="Restart the level"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg></button>
  </div>
  <div class="slots" id="slots" aria-live="polite"></div>
  <div class="field"><canvas id="cv" aria-label="The track and the bus bay. Tap a bus in the bay to send it out."></canvas></div>
</section>

<div class="cover hidden" id="cover"></div>
<div class="toast" id="toast" role="status"></div>

    drop() { const t = performance.now(); if (t - lastBlip < 45) return; lastBlip = t; tone(420, .05, 'triangle', .06, 0, .8); },

    fast() { tone(700, .1, 'triangle', .07, 0, 1.5); },
    win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .2, 'triangle', .1, i * .1)); },
    lose() { [392, 330, 262].forEach((f, i) => tone(f, .22, 'triangle', .1, i * .13)); },
    coin() { const t = performance.now(); if (t - lastBlip < 60) return; lastBlip = t; tone(1320, .06, 'square', .035); tone(1760, .09, 'square', .03, .05); },
    buy() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, .14, 'triangle', .09, i * .07)); },

/* ======================================================================

   Each level has its own track: the outline of a random blob of squares

   makes it wind), with wide, sweeping curves at the corners. Tracks that
   come out too long are thrown away.

}
// the outline as a list of corners, clockwise, starting at the bottom-left corner

    if (!has(x, y + 1)) next.set((x + 1) + ',' + (y + 1), [x, y + 1]);  // bottom, right to left

}

}
// where a distance along a path is: position and direction
function along(path, s, loop) {

const ahead = (from, to, L) => ((to - from) % L + L) % L;

/* ======================================================================
   LEVELS
   Every level is made from its number, so it's always the same level.
   1. A track, and stops along it. Each stop holds a clump of one colour
      (shown by its flag) or is free (a white flag).
   2. The buses: each has a colour and 16 seats, and most already carry
      people, of their own colour or others, who need dropping off. In
      later levels the buses start much fuller.
   3. A check: a computer player plays the real game on it, with only 4
      buses out (one fewer than you get). If it can't win, the level is
      thrown away and the next attempt is tried.
   ====================================================================== */
const COLOURS = ['#ef4444', '#2563eb', '#facc15', '#22c55e', '#a855f7', '#f97316', '#22d3ee'];

const MAX_OUT = 5, CAP = 16;
function baseShape(n) {
  const nc = Math.min(6, 2 + Math.ceil(n / 3));
  return {
    nc,                                                        // colours
    per: n < 6 ? 2 : 3,                                        // buses of each colour
    free: 2,                                                   // stops that start empty
    stops: Math.min(8, nc + 2),
    load: n < 3 ? .25 : n < 6 ? .4 : n < 10 ? .5 : .6,        // how much of each colour starts on buses rather than at stops
    cols: n < 3 ? 3 : 4,                                       // bay lanes
  };
}
// every fifth level is a hard one: it has the settings of a level three further on, more people riding, and
// (when it's worked out ahead of time) the hardest of a few winnable versions
const isHard = n => n % 5 === 0;
function levelShape(n) {
  if (!isHard(n)) return baseShape(n);
  const s = baseShape(n + 3);
  return {...s, load: Math.min(.65, s.load + .05)};
}
// how far a point is from the nearest road (roads are put in buckets so this is quick)
function roadDistance(track) {
  const B = .25, buckets = new Map();
  const all = [...track.pts, ...track.exit.pts, ...track.lanes.flatMap(l => [...l.pts, ...Array.from({length: 40}, (_, i) => [l.x, BAY_Y + i * .1])])];
  all.forEach(p => { const k = Math.floor(p[0] / B) + ',' + Math.floor(p[1] / B); if (!buckets.has(k)) buckets.set(k, []); buckets.get(k).push(p); });

    let d = 9; const bx = Math.floor(x / B), by = Math.floor(y / B);
    for (let i = -3; i <= 3; i++) for (let j = -3; j <= 3; j++) { const q = buckets.get((bx + i) + ',' + (by + j)); if (q) for (const p of q) { const e = (p[0] - x) ** 2 + (p[1] - y) ** 2; if (e < d * d) d = Math.sqrt(e); } }
    return d;

// each stop's flag (the clear spot in its square nearest the road) and the places its crowd stands, nearest the

function placeStops(track, stopPos) {

  if (G && !G.over && !G.predicted && G.depot.every(d => !d.length) && G.buses.every(b => b.state !== 'enter' && b.state !== 'merge')) {
    G.predicted = true; G.fast = sureWin();
    if (G.fast) { Sound.fast(); renderSlots(); }
  }
  for (let i = 0; i < (G && G.fast ? FAST : 1); i++) step(dt);
  if (G && !G.over) { const n = outCount(); if (n !== G.shown) { G.shown = n; renderSlots(); } }
  draw(now);
}
requestAnimationFrame(frame);

/* ---------- tapping a bus in the bay sends it ---------- */
cv.addEventListener('pointerdown', e => {
  if (!G || G.over) return;
  const r = cv.getBoundingClientRect(), ux = (e.clientX - r.left - V.ox) / V.k, uy = (e.clientY - r.top - V.oy) / V.k;
  if (uy < BAY_Y - .7) return;
  let best = -1, bd = .55;
  T.lanes.forEach((l, i) => { const d = Math.abs(ux - l.x); if (d < bd && G.depot[i].length) { bd = d; best = i; } });
  if (best >= 0) send(best);
});
function renderSlots() {
  const n = outCount(), s = $('#slots');
  s.innerHTML = `${Array.from({length: MAX_OUT}, (_, i) => `<i class="${i < n ? 'on' : ''}"><b></b></i>`).join('')}<span>${n}/${MAX_OUT} out</span>${G.fast ? '<span class="ff">▶▶ ×4</span>' : ''}`;
  s.classList.toggle('full', n >= MAX_OUT);
}
const rating = n => n <= RATINGS.length ? RATINGS[n - 1] : isHard(n) ? 4 : 3;
const chipsFor = n => (isHard(n) ? '<span class="chip hard">🔥 Hard level</span>' : '') + `<span class="chip" style="--c:${DIFF[rating(n)].col}">${'●'.repeat(rating(n))}${'○'.repeat(4 - rating(n))} ${DIFF[rating(n)].name}</span>`;

/* ======================================================================
   SCREENS
   ====================================================================== */
function show(id) { ['home', 'game', 'shop'].forEach(k => $('#' + k).classList.toggle('hidden', k !== id)); }
function cover(html) { const c = $('#cover'); c.innerHTML = html; c.classList.remove('hidden'); }
function closeCover() { $('#cover').classList.add('hidden'); $('#cover').innerHTML = ''; }
function goHome() { G = null; T = null; show('home'); renderHome(); }
function renderWallet(bump) {
  document.querySelectorAll('.wallet').forEach(w => {
    w.querySelector('.tkc').innerHTML = TK; w.querySelector('.tkn').textContent = W.tickets;
    if (bump) { w.classList.remove('bump'); void w.offsetWidth; w.classList.add('bump'); }
  });
}
// a number that counts up, with a tick as it goes
function countUp(el, n, from = 0) {
  const t0 = performance.now(), dur = 500 + Math.min(900, n * 18);
  const tick = now => { const u = Math.min(1, (now - t0) / dur), v = Math.round(from + (n - from) * (1 - (1 - u) ** 3)); el.textContent = '+' + v; if (u < 1) { Sound.coin(); requestAnimationFrame(tick); } };
  requestAnimationFrame(tick);
}
function confetti() {
  if (document.documentElement.classList.contains('rz-reduce-motion')) return;
  const c = document.createElement('div'); c.className = 'confetti';
  for (let i = 0; i < 46; i++) {
    const e = document.createElement('i');
    e.style.cssText = `left:${Math.random() * 100}%;background:${[...COLOURS, '#ffffff'][i % 8]};animation-duration:${1.6 + Math.random() * 1.6}s;animation-delay:${Math.random() * .4}s;transform:rotate(${Math.random() * 360}deg)`;
    c.appendChild(e);
  }
  document.body.appendChild(c); setTimeout(() => c.remove(), 3800);
}

/* ---------- home: the next level's track, with a few buses going round ---------- */
const THEME_ICON = {Meadow: '🌳', Beach: '🏖️', Snow: '❄️', Desert: '🌵', City: '🏙️', Autumn: '🍂', Volcano: '🌋', Night: '🌙', Candy: '🍭'};
const HS = {cv: $('#hcv'), V: {w: 0, h: 0, dpr: 1, k: 40, ox: 0, oy: 0}, G: null, T: null, SCN: null, BG: null, n: 0, last: 0};
function homeSetup() {
  if (HS.G && HS.n === prog.level) return true;
  const n = prog.level, lv = makeLevel(n) || makeLevel(((n - 1) % 100) + 1); if (!lv) return false;
  HS.n = n; HS.T = lv.track; HS.G = newGame(lv, false); HS.SCN = HS.BG = null; HS.V.w = 0;
  const L = HS.T.L, m = Math.min(4, HS.G.depot.length);
  for (let i = 0; i < m; i++) { const b = HS.G.depot[i].shift(); if (b) HS.G.buses.push(Object.assign(b, {state: 'run', lane: i, s: L * i / m, e: 0, x: 0, v: 0, at: -1, bump: 0})); }
  return true;
}
function homeFit() {
  const r = HS.cv.getBoundingClientRect(); if (!r.width) return false;
  const Vh = HS.V, dpr = Math.min(3, devicePixelRatio || 1);
  if (Vh.w !== r.width || Vh.h !== r.height || Vh.dpr !== dpr) {
    Vh.w = r.width; Vh.h = r.height; Vh.dpr = dpr;
    HS.cv.width = Math.round(r.width * dpr); HS.cv.height = Math.round(r.height * dpr);
    // the track fills the width, centred between the title and the panel
    const C = HS.T.corners, x0 = Math.min(...C.map(c => c[0])) - .45, x1 = GWU + .9, y0 = Math.min(...C.map(c => c[1])), y1 = GHU + .5;
    const top = $('.logo').getBoundingClientRect().bottom, bot = $('.hpanel').getBoundingClientRect().top;
    Vh.k = Math.min(r.width / (x1 - x0), 110);
    Vh.ox = (r.width - (x1 - x0) * Vh.k) / 2 - x0 * Vh.k;
    Vh.oy = (top + bot) / 2 - (y0 + y1) / 2 * Vh.k;
    HS.SCN = HS.BG = null;
  }
  return true;
}
function homeDraw(now) {
  if (!homeSetup() || !homeFit()) return;
  const dt = HS.last ? Math.min(.05, (now - HS.last) / 1000) : 0; HS.last = now;
  HS.G.buses.forEach(b => { b.s = (b.s + 2.2 * dt) % HS.T.L; });
  const kept = [G, T, SCN, BG];
  G = HS.G; T = HS.T; SCN = HS.SCN; BG = HS.BG;
  try { withView(HS.cv.getContext('2d'), HS.V, () => draw(now)); HS.SCN = SCN; HS.BG = BG; }
  finally { [G, T, SCN, BG] = kept; }
}
function renderHome() {
  const n = prog.level, th = themeOf(n), g0 = Math.floor((n - 1) / 5) * 5 + 1;
  $('#home').style.background = th.ground;
  $('#hLevel').textContent = n;
  $('#hTheme').innerHTML = `<span>${THEME_ICON[th.name] || '🚌'}</span>${th.name}`;
  $('#hChips').innerHTML = chipsFor(n);
  let trip = '';
  for (let i = 0; i < 5; i++) {
    const m = g0 + i, cls = m < n ? 'done' : m === n ? 'now' : '';
    if (i) trip += `<span class="rd ${m <= n ? 'done' : ''}"></span>`;
    trip += `<span class="st ${cls} ${isHard(m) ? 'hot' : ''}">${m < n ? '✓' : m}</span>`;
  }
  const nt = themeOf(g0 + 5);
  $('#hTrip').innerHTML = trip + `<span class="nx">then ${THEME_ICON[nt.name] || ''} ${nt.name}</span>`;
  $('#hStats').textContent = prog.wins ? `${prog.wins} level${prog.wins > 1 ? 's' : ''} cleared · ${W.earned} tickets earned` : 'Clear levels to earn tickets for the shop';
  $('#giftBtn').classList.toggle('ready', giftReady());
  renderWallet();
}

/* ---------- daily gift: once a day, more for days in a row ---------- */
const dayKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const giftReady = () => W.daily.last !== dayKey(new Date());
const giftFor = streak => 20 + 5 * Math.min(6, streak - 1);
function gift() {
  const y = new Date(); y.setDate(y.getDate() - 1);
  const ready = giftReady(), next = ready ? (W.daily.last === dayKey(y) ? W.daily.streak + 1 : 1) : W.daily.streak;
  const days = Array.from({length: 7}, (_, i) => {
    const d = i + 1, here = ((next - 1) % 7) + 1, cls = d < here || (!ready && d === here) ? 'got' : d === here ? 'now' : '';
    return `<div class="${cls}">${cls === 'got' ? '✓' : TK}<b>${giftFor(d)}</b><span>Day ${d}</span></div>`;
  }).join('');
  cover(`<div class="card"><h3>Daily gift</h3><p>${ready ? `Come back every day for a bigger gift. ${next > 1 ? `You're on a <b>${next}-day</b> streak!` : ''}` : `You've had today's gift. Come back tomorrow for <b>${giftFor(next + 1)}</b> tickets.`}</p>
    <div class="days">${days}</div>
    ${ready ? `<button class="primary" id="cGift" style="width:100%">Collect ${TK} ${giftFor(next)}</button>` : `<button class="primary" id="cOk" style="width:100%">OK</button>`}</div>`);
  if (ready) $('#cGift').onclick = () => {
    const amt = giftFor(next); W.daily = {last: dayKey(new Date()), streak: next}; addTickets(amt);
    Sound.gift(); confetti();
    cover(`<div class="card"><span class="bigtk">${TK}</span><h3 class="reward" style="margin:0 0 6px"><span id="rwN">+0</span></h3><p>Day ${next} gift collected. See you tomorrow!</p><button class="primary" id="cOk" style="width:100%">Nice!</button></div>`);
    $('.bigtk svg').style.cssText = 'width:100%;height:100%'; countUp($('#rwN'), amt);
    $('#cOk').onclick = () => { closeCover(); renderHome(); renderWallet(true); };
  };
  else $('#cOk').onclick = closeCover;
}

/* ---------- the shop ---------- */
let shopCat = 'bus', shopSel = null;
const HERO = {fx: [], next: 0, last: 0, bus: {c: 3, load: Array(16).fill(3)}};
const itemOf = (cat, id) => SHOP.find(s => s.cat === cat).items.find(it => it.id === id);
function openShop(cat) { if (cat) shopCat = cat; shopSel = W.eq[shopCat]; show('shop'); renderShop(); }
function renderShop() {
  $('#tabs').innerHTML = SHOP.map(s => `<button class="${s.cat === shopCat ? 'on' : ''}" data-cat="${s.cat}" role="tab" aria-selected="${s.cat === shopCat}">${s.name}</button>`).join('');
  const sec = SHOP.find(s => s.cat === shopCat);
  $('#items').innerHTML = sec.items.map(it => {
    const own = W.owned[shopCat].includes(it.id), eq = W.eq[shopCat] === it.id;
    const st = eq ? '✓ Wearing' : own ? 'Owned' : TK + it.price, no = !own && it.price > W.tickets ? 'no' : '';
    return `<button class="item ${eq ? 'eq' : ''} ${shopSel === it.id ? 'sel' : ''}" data-id="${it.id}"><canvas></canvas><b>${it.name}</b><span class="st ${no}">${st}</span></button>`;
  }).join('');
  document.querySelectorAll('#items .item').forEach((el, i) => drawItem(el.querySelector('canvas'), shopCat, sec.items[i].id, i));
  renderShopBar(); renderWallet();
}
function renderShopBar() {
  const it = itemOf(shopCat, shopSel), b = $('#shopAct'), own = W.owned[shopCat].includes(it.id), eq = W.eq[shopCat] === it.id;
  $('#heroTag').textContent = it.name;
  b.disabled = eq || (!own && it.price > W.tickets);
  b.innerHTML = eq ? '✓ Wearing' : own ? 'Use this' : it.price > W.tickets ? `Need ${TK} ${it.price - W.tickets} more` : `Buy for ${TK} ${it.price}`;
}
$('#tabs').onclick = e => { const c = e.target.closest('button'); if (!c) return; Sound.tap(); shopCat = c.dataset.cat; shopSel = W.eq[shopCat]; renderShop(); };
$('#items').onclick = e => {
  const c = e.target.closest('.item'); if (!c) return; Sound.tap();
  shopSel = c.dataset.id; HERO.next = 0;
  document.querySelectorAll('#items .item').forEach(el => el.classList.toggle('sel', el === c)); renderShopBar();
};
$('#shopAct').onclick = () => {
  const it = itemOf(shopCat, shopSel), own = W.owned[shopCat].includes(it.id);
  if (!own) { if (it.price > W.tickets) return; W.tickets -= it.price; W.owned[shopCat].push(it.id); Sound.buy(); toast(`${it.name}: yours!`); }
  else Sound.tap();
  W.eq[shopCat] = it.id; saveW(); HERO.next = 0; renderShop(); renderWallet(!own);
};
$('#shopBack').onclick = () => { Sound.tap(); goHome(); };
// the little picture on each item
function drawItem(cvs, cat, id, i) {
  const r = cvs.getBoundingClientRect(), dpr = Math.min(3, devicePixelRatio || 1); if (!r.width) return;
  cvs.width = Math.round(r.width * dpr); cvs.height = Math.round(r.height * dpr);
  const ctx = cvs.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const k = Math.min(r.width / 1.25, r.height / .85);
  LOOK = {[cat]: id};
  try {
    withView(ctx, {w: r.width, h: r.height, dpr, k, ox: r.width / 2, oy: r.height * .62}, () => {
      if (cat === 'bus') drawBus({c: [3, 0, 1, 4, 5, 6, 2][i % 7], load: [3, 3, 0, 1, 3, 2, 3, 3, 4, 3, 3, 5, 3]}, 0, .05, -.42, 1, false, 1.3);
      else if (cat === 'hat') [[-.24, .08, 0], [0, .02, 3], [.24, .1, 1]].sort((a, b) => a[1] - b[1]).forEach(([x, y, c]) => { const s = S(x, y); pawn(s[0], s[1], c, k * .14); });
      else if (cat === 'flag') { drawFlag({x: -.15, y: .2, dir: 1}, {n: 1, c: [0, 1, 4, 3, 5][i % 5]}, .8, 0); [[.18, .26, 1], [.3, .22, 1], [.26, .32, 1]].forEach(([x, y, c]) => { const s = S(x, y); pawn(s[0], s[1], [0, 1, 4, 3, 5][i % 5], k * .07); }); }
      else { Object.assign(V, {k: k * .7, oy: r.height * .82}); drawBus({c: 4, load: Array(16).fill(4)}, 0, 0, -.2, 1, false, 0); let fx = spawnFx(id, 0, 0, COLOURS[4]); for (let s = 0; s < 12; s++) fx = updateFx(fx, .02); drawFx(fx); }
    });
  } finally { LOOK = null; }
}
// the show bus at the top of the shop: wearing whatever you've picked
function heroDraw(now) {
  const c = $('#scv'), r = c.getBoundingClientRect(); if (!r.width) return;
  const dpr = Math.min(3, devicePixelRatio || 1), t = now / 1000, dt = HERO.last ? Math.min(.05, (now - HERO.last) / 1000) : 0; HERO.last = now;
  if (c.width !== Math.round(r.width * dpr) || c.height !== Math.round(r.height * dpr)) { c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr); }
  const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, r.width, r.height);
  const k = Math.min(r.width / 2.8, r.height / 1.3);
  LOOK = shopSel ? {[shopCat]: shopSel} : null;
  try {
    withView(ctx, {w: r.width, h: r.height, dpr, k, ox: r.width / 2, oy: r.height * .6}, () => {
      // a round grassy stand with a bit of road
      const p = S(0, 0);
      ell(p[0], p[1] + k * .1, k * 1.3, k * .56, '#5c9e46'); ell(p[0], p[1], k * 1.3, k * .54, '#8fd16a');
      const rx = .55, ry = .22, cx = .32, q = S(cx, 0);
      g.strokeStyle = '#5d6577'; g.lineWidth = k * .48; g.beginPath(); g.ellipse(q[0], q[1], k * rx, k * ry, 0, 0, Math.PI * 2); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = Math.max(1, k * .03); g.setLineDash([k * .1, k * .1]); g.beginPath(); g.ellipse(q[0], q[1], k * rx, k * ry, 0, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
      // a bus driving round, a stop with its crowd
      const a = t * .9, bx = cx + Math.cos(a) * rx, by = Math.sin(a) * ry, ang = Math.atan2(Math.cos(a) * ry, -Math.sin(a) * rx);
      const crowd = [[-1.08, .02], [-.96, .1], [-1.1, .14], [-.98, -.02], [-.86, .06]].map(([x, y], i) => ({y, f: () => { const s = S(x, y); pawn(s[0], s[1] - Math.abs(Math.sin(t * 2.2 + i)) * k * .02, 3, PR * k * 1.15); }}));
      [...crowd, {y: -.08, f: () => drawFlag({x: -1.0, y: -.08, dir: 1}, {n: 1, c: 3}, t, 0)}, {y: by, f: () => drawBus(HERO.bus, bx, by, ang, 1, false, t)}].sort((u, v) => u.y - v.y).forEach(o => o.f());
      // the celebration, every couple of seconds
      if (now > HERO.next) { HERO.fx.push(...spawnFx(look('fx'), bx, by, COLOURS[3])); HERO.next = now + 2400; }
      HERO.fx = updateFx(HERO.fx, dt); drawFx(HERO.fx);
    });
  } finally { LOOK = null; }
}

function how() {
  cover(`<div class="card how"><h3>How to play</h3><ul>
    <li>Tap a bus in the bay to send it out onto the track. It goes round and round.</li>
    <li>At a stop whose flag is its colour, it picks people up.</li>
    <li>Passengers of other colours get off at a stop of their colour, or at a stop with a <b>white flag</b> (free), which then becomes theirs.</li>
    <li>When all ${CAP} seats hold its own colour, the bus leaves by the exit.</li>
    <li>Only <b>${MAX_OUT}</b> buses can be out at once. If none of them can do anything, you're stuck.</li>
    <li>Clear levels to earn ${TK} tickets, and spend them in the shop.</li>
  </ul><button class="primary" id="cOk">Got it</button></div>`);
  $('#cOk').onclick = closeCover;
}
$('#playBtn').onclick = () => { Sound.tap(); start(prog.level); };
$('#howBtn').onclick = () => { Sound.tap(); how(); };
$('#shopBtn').onclick = () => { Sound.tap(); openShop(); };
$('#giftBtn').onclick = () => { Sound.tap(); gift(); };
$('#backBtn').onclick = () => { Sound.tap(); goHome(); };
$('#againBtn').onclick = () => {
  Sound.tap(); if (!G) return;
  if (G.buses.length || G.depot.flat().length !== G.lv.depot.flat().length) { prog.failed = G.n; keep(PROG_KEY, prog); }
  start(G.n);
};
addEventListener('resize', () => { if (G) resize(); if (!$('#shop').classList.contains('hidden')) renderShop(); });
renderHome();
// players who'd already cleared levels before tickets existed get 10 for each
if (!W.welcomed) {
  W.welcomed = true; const bonus = prog.wins * 10;
  if (bonus) { addTickets(bonus); renderHome(); setTimeout(() => {
    cover(`<div class="card"><span class="bigtk">${TK}</span><h3>Tickets are here!</h3><p>You get <b>${bonus}</b> tickets for the ${prog.wins} level${prog.wins > 1 ? 's' : ''} you've already cleared. Spend them in the shop on bus styles, hats and more.</p>
      <div class="hrow"><button class="ghost" id="cOk">Later</button><button class="primary" id="cShop">Open the shop</button></div></div>`);
    $('.bigtk svg').style.cssText = 'width:100%;height:100%';
    $('#cOk').onclick = closeCover; $('#cShop').onclick = () => { closeCover(); openShop(); };
  }, 400); }
  else saveW();
}
if (!load('colourbus-seen-how', 0)) { keep('colourbus-seen-how', 1); setTimeout(how, 500); }

window.RizzoHooks = {
  previewSound: () => Sound.board(2),
  leaveWarning: () => G && !G.over && outCount() ? 'You’re in the middle of a level.' : '',
};
</script>
