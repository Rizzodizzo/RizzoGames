<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flag Quiz</title>
<meta name="theme-color" content="#f7f3f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161113" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<script src="games.js" data-game="flagquiz" data-show-when="#home:not(.hidden)" data-hide-when=".panel.show, #game:not(.hidden)" data-sounds="sfx" data-top="16" data-left="16" data-pill-top="64"></script>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flag Quiz">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://flagcdn.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ======================================================================
   COLOURS: light or dark, following the device. Red for the game, and
   every continent has its own colour.
   ====================================================================== */
:root{--ease:cubic-bezier(.2,.8,.2,1);--pop:cubic-bezier(.3,1.6,.5,1);
  --bg:#f7f3f1;--panel:#ffffff;--ink:#2a1c21;--muted:#7a666d;--line:#ece1e1;--soft:#f5eaea;
  --accent:#e23d5b;--hi:#ff6b83;--edge:#ad2440;--onaccent:#ffffff;--shade:rgba(90,20,35,.10);--ok:#16a34a;--okbg:#dcf7e5;--bad:#e5484d;--badbg:#fde3e4;--gold:#d99a00;
  --rz-btn-bg:var(--panel);--rz-btn-fg:var(--accent);--rz-btn-border:1px solid var(--line);--rz-btn-radius:12px;--rz-btn-shadow:0 2px 8px var(--shade);--rz-btn-size:42px}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --bg:#161113;--panel:#221a1d;--ink:#f6ebee;--muted:#b49fa6;--line:#3a2a30;--soft:#2c2126;
  --accent:#ff5c77;--hi:#ff8a9c;--edge:#a8233b;--onaccent:#2a0710;--shade:rgba(0,0,0,.45);--ok:#2fd06b;--okbg:#123222;--bad:#ff5a5f;--badbg:#3a1518;--gold:#ffc83d}}
*{box-sizing:border-box}
html{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;height:100%;overflow-y:auto;overscroll-behavior:none;-webkit-overflow-scrolling:touch;background:var(--bg);color:var(--ink);
  font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.hidden{display:none!important}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.iconbtn{width:42px;height:42px;border-radius:12px;display:inline-grid;place-items:center;background:var(--panel);border:1px solid var(--line);box-shadow:0 2px 8px var(--shade);color:var(--accent)}
.iconbtn:active{transform:scale(.94)}
.primary{background:linear-gradient(180deg,var(--hi),var(--accent));color:var(--onaccent);box-shadow:0 4px 0 var(--edge),0 8px 18px var(--shade);border-radius:16px;font-weight:900}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.primary:disabled{filter:grayscale(.6);opacity:.6}

/* ================= HOME ================= */
.home{max-width:480px;margin:0 auto;height:100%;min-height:540px;display:flex;flex-direction:column;padding-top:48px}
.homeset{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;display:flex;gap:8px}
/* the title: the logo beside the name */
.hero{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 0}
.hero svg{width:auto;height:min(64px,8.5vh);flex:none;filter:drop-shadow(0 4px 8px var(--shade))}
.hero h1{margin:0;font-size:clamp(1.5rem,4vh,1.9rem);font-weight:900;letter-spacing:-.01em;white-space:nowrap}
/* region cards you swipe between (like the other games' mode cards) */
.hl{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.modes{position:relative;flex:1 1 0;min-height:150px;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:22px 20% 10px;margin:0 -16px;
  scrollbar-width:none;overscroll-behavior-x:contain;align-items:stretch}
.modes::-webkit-scrollbar{display:none}
@media (hover:hover) and (pointer:fine){.modes{cursor:grab}.modes.dragging{cursor:grabbing;scroll-snap-type:none}}
.mode{container-type:size;flex:0 0 100%;scroll-snap-align:center;max-height:360px;align-self:center;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.6vh,12px);
  background:var(--panel);border-radius:26px;box-shadow:0 6px 20px var(--shade);transition:transform .3s var(--ease),opacity .3s;position:relative}
.mode.active{outline:2.5px solid var(--accent);outline-offset:-2.5px}
.mode:not(.active){transform:scale(.84);opacity:.45}
.mode h2{margin:0;font-size:clamp(1.15rem,3vh,1.5rem);font-weight:900}
.mode p{margin:-4px 12px 0;color:var(--muted);font-weight:800;font-size:.85rem;text-align:center}
.mart{width:min(clamp(100px,min(52vw,28vh),220px),calc(100cqh - 96px));height:auto;flex:none;min-width:56px;filter:drop-shadow(0 6px 12px var(--shade))}
.mode .pb{position:absolute;top:-14px;left:50%;translate:-50% 0;z-index:2;display:flex;align-items:center;gap:5px;padding:5px 13px 5px 9px;border-radius:99px;background:var(--panel);color:var(--ink);font-weight:900;font-size:.9rem;white-space:nowrap;
  box-shadow:0 0 0 3px var(--bg),0 3px 10px var(--shade),inset 0 0 0 1.5px var(--line)}
.mode .pb.gold{background:#ffd23f;color:#3a2c00;box-shadow:0 0 0 3px var(--bg),0 3px 10px var(--shade)}
.mode .pb svg{width:16px;height:16px;color:#e0a800}
.mode .pb.gold svg{color:#3a2c00}
.mfan{position:relative;width:min(clamp(100px,min(52vw,28vh),220px),calc(100cqh - 96px));aspect-ratio:1;flex:none}
.mfan img,.mfan .em{position:absolute;left:50%;top:50%;width:62%;border-radius:6px;box-shadow:0 6px 14px var(--shade),0 0 0 1px rgba(0,0,0,.08);background:var(--soft)}
.mfan .em{width:auto;font-size:calc(min(clamp(100px,min(52vw,28vh),220px),calc(100cqh - 96px)) * .4);box-shadow:none;background:none;line-height:1}
.mfan>*:nth-child(1){transform:translate(-78%,-62%) rotate(-12deg)}
.mfan>*:nth-child(2){transform:translate(-22%,-58%) rotate(10deg)}
.mfan>*:nth-child(3){transform:translate(-50%,-36%) rotate(-2deg)}
.mfan .x{position:absolute;right:6%;bottom:8%;width:28%;aspect-ratio:1;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;box-shadow:0 4px 10px var(--shade);transform:none}
.mfan .x svg{width:55%;height:55%;stroke-width:3.2}
.modenav{flex:none;display:flex;align-items:center;justify-content:center;gap:12px;margin:2px 0 0}
.modearrow{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--muted)}
.modearrow .ic{width:18px;height:18px}
.modearrow.l svg{transform:scaleX(-1)}
.modearrow:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .25s var(--ease),background .25s}
.dots i.on{width:22px;background:var(--accent)}
.lbl{margin:12px 4px 6px;font-size:.74rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.row2{flex:none;display:grid;grid-template-columns:1.2fr 1fr;gap:10px}
.seg{display:flex;gap:3px;padding:4px;background:var(--panel);border-radius:15px;box-shadow:0 2px 8px var(--shade)}
.seg button{flex:1;min-width:0;padding:9px 2px;border-radius:11px;color:var(--muted);font-weight:900;font-size:.93rem;display:flex;align-items:center;justify-content:center;gap:5px;transition:background .2s,color .2s;white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--onaccent)}
.seg button .ic{width:17px;height:17px}
@media (max-width:370px){.seg button .ic{display:none}}
.play{flex:none;margin-top:14px;padding:15px;font-size:1.2rem;display:flex;flex-direction:column;align-items:center;gap:1px;width:100%}
.play small{font-size:.78rem;font-weight:800;opacity:.9}
.dl{flex:none;margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--panel);box-shadow:0 2px 8px var(--shade);text-align:center}
.dl b{display:block;font-weight:900;font-size:1.05rem}
.dl small{display:block;color:var(--muted);font-weight:800;font-size:.86rem;margin-top:2px}
.dl small.why{font-size:.78rem;margin-top:8px}
.dl .bar{margin-top:10px}
.dl.bad b{color:var(--bad)}
.dl .primary{margin-top:12px;padding:11px 22px;font-size:1rem}
@media (max-height:700px){
  .modes{padding-top:20px}.lbl{margin:8px 4px 5px}.seg button{padding:7px 2px}.play{padding:12px;margin-top:10px}.dl{margin-top:10px}
}

/* ================= THE QUIZ ================= */
.game{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.gtop{display:flex;align-items:center;gap:12px}
.prog{flex:1;min-width:0}
.prog .row{display:flex;justify-content:space-between;font-weight:900;font-size:.9rem;margin-bottom:5px}
.prog .row span{color:var(--muted)}
.bar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--hi));transition:width .35s var(--ease)}
.streak{display:flex;align-items:center;gap:4px;padding:0 11px;height:42px;border-radius:12px;background:var(--panel);box-shadow:0 2px 8px var(--shade);font-weight:900;color:var(--muted);transition:color .2s}
.streak.hot{color:#f97316}
.streak .ic{width:20px;height:20px}
.streak.pop{animation:pop .4s var(--pop)}
@keyframes pop{40%{transform:scale(1.18)}}
.stage{margin-top:16px;display:flex;flex-direction:column;align-items:center}
.flagbox{--fh:min(30vh,250px);position:relative;width:100%;height:var(--fh);display:flex;align-items:center;justify-content:center}
.game.typing .flagbox{--fh:min(24vh,200px)}
.flagbox img{max-width:100%;max-height:var(--fh);width:auto;height:auto;border-radius:8px;box-shadow:0 10px 30px var(--shade),0 0 0 1px rgba(0,0,0,.06);background:var(--soft);animation:flagin .45s var(--pop)}
@keyframes flagin{from{transform:scale(.85) rotate(-3deg);opacity:0}}
.flagbox .emoji{font-size:calc(var(--fh) * .8);line-height:1}
.flagbox .loading{height:calc(var(--fh) * .85);max-width:100%;aspect-ratio:3/2;border-radius:10px;background:linear-gradient(100deg,var(--soft) 30%,var(--panel) 50%,var(--soft) 70%) 0 0/200% 100%;animation:shimmer 1.1s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.ask{margin:12px 0 0;font-weight:900;font-size:1.05rem;color:var(--muted);text-align:center}
.answers{margin-top:12px;display:grid;grid-template-columns:1fr;gap:9px;width:100%}
@media (min-width:520px){.answers{grid-template-columns:1fr 1fr}}
.ans{min-height:50px;padding:12px 14px;border-radius:15px;background:var(--panel);box-shadow:0 3px 0 var(--line),0 6px 14px var(--shade);font-weight:900;font-size:1.05rem;text-align:center;line-height:1.2;transition:background .2s,color .2s,transform .15s}
.ans:active{transform:translateY(2px)}
.ans.right{background:var(--ok);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.ans.wrong{background:var(--bad);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 60%,#000);animation:shake .35s}
.ans.fade{opacity:.45}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.typer{margin-top:12px;width:100%;display:flex;gap:8px}
.typer input{flex:1;min-width:0;height:54px;padding:0 16px;border-radius:15px;border:2px solid var(--line);background:var(--panel);font-weight:800;font-size:1.1rem;outline:none;transition:border-color .2s,background .2s;-webkit-appearance:none}
.typer input:focus{border-color:var(--accent)}
.typer input.right{border-color:var(--ok);background:var(--okbg)}
.typer input.wrong{border-color:var(--bad);background:var(--badbg);animation:shake .35s}
.typer .go{width:64px;flex:none;display:grid;place-items:center}
.pattern{margin-top:10px;min-height:1.6em;font-weight:900;font-size:1.05rem;letter-spacing:.12em;color:var(--accent);text-align:center;font-variant-numeric:tabular-nums;word-break:break-word}
.tools{margin-top:6px;display:flex;gap:8px;justify-content:center}
.tool{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;background:var(--panel);box-shadow:0 2px 8px var(--shade);font-weight:900;font-size:.9rem;color:var(--muted)}
.tool .ic{width:18px;height:18px}
.tool:disabled{opacity:.4}
.tries{display:flex;gap:4px;align-items:center;margin-left:4px}
.tries i{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.tries i.used{background:var(--line)}
.feedback{margin-top:12px;min-height:46px;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border-radius:14px;font-weight:900;font-size:1.02rem;text-align:center;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
.feedback.show{opacity:1;transform:none}
.feedback.ok{background:var(--okbg);color:var(--ok)}
.feedback.no{background:var(--badbg);color:var(--bad)}
.feedback.hmm{background:var(--soft);color:var(--muted)}
.feedback .ic{width:20px;height:20px}
.tapnext{margin-top:6px;text-align:center;color:var(--muted);font-weight:800;font-size:.8rem;min-height:1.2em}

/* ================= RESULTS ================= */
.results{max-width:520px;margin:0 auto;padding-top:20px;text-align:center}
.ring{position:relative;width:170px;height:170px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:2.6rem;font-weight:900;line-height:1}
.ring small{color:var(--muted);font-weight:800}
.results h2{margin:14px 0 2px;font-size:1.6rem;font-weight:900}
.results .sub{color:var(--muted);font-weight:800}
.newbest{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:99px;background:var(--gold);color:#2a1c00;font-weight:900;font-size:.85rem;animation:pop .5s var(--pop)}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.rstats div{background:var(--panel);border-radius:14px;padding:10px 6px;box-shadow:0 2px 8px var(--shade)}
.rstats small{display:block;color:var(--muted);font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.rstats b{font-size:1.25rem;font-weight:900}
.rbtns{display:flex;gap:10px}
.rbtns button{flex:1;padding:14px;font-size:1.05rem}
.ghost{background:var(--panel);border-radius:16px;font-weight:900;color:var(--accent);box-shadow:0 2px 8px var(--shade)}
.missed{margin-top:22px;text-align:left}
.missed h3{margin:0 4px 10px;font-size:.8rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.fcard{background:var(--panel);border-radius:14px;padding:10px;box-shadow:0 2px 8px var(--shade);display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.fcard .fi{width:100%;aspect-ratio:3/2;display:grid;place-items:center}
.fcard img{max-width:100%;max-height:100%;border-radius:4px;box-shadow:0 2px 6px var(--shade),0 0 0 1px rgba(0,0,0,.06)}
.fcard .em{font-size:3rem;line-height:1}
.fcard b{font-weight:900;font-size:.88rem;line-height:1.2}
.fcard small{color:var(--muted);font-weight:800;font-size:.72rem;margin-top:-4px}
.fcard .mdot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:4px;vertical-align:1px}
.confetti{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;pointer-events:none;z-index:50;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}

/* ================= PANELS ================= */
.panel{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s var(--ease);visibility:hidden}
.panel.show{transform:none;visibility:visible}
.phead{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 8px;max-width:640px;width:100%;margin:0 auto}
.phead h2{margin:0;font-size:1.35rem;font-weight:900;flex:1}
.pbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px calc(env(safe-area-inset-bottom,0px) + 24px);max-width:640px;width:100%;margin:0 auto}
.search{width:100%;height:46px;padding:0 14px 0 40px;border-radius:14px;border:2px solid var(--line);background:var(--panel) no-repeat 12px 50%/20px;outline:none;font-weight:800;font-size:1rem;-webkit-appearance:none}
.search:focus{border-color:var(--accent)}
.searchwrap{position:relative}
.searchwrap .ic{position:absolute;left:12px;top:12px;width:20px;height:20px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.chip{padding:6px 11px;border-radius:99px;background:var(--panel);box-shadow:0 2px 6px var(--shade);font-weight:900;font-size:.82rem;color:var(--muted);border:2px solid transparent}
.chip.on{border-color:var(--rc,var(--accent));color:var(--ink)}
.count{color:var(--muted);font-weight:800;font-size:.85rem;margin:0 4px 10px}
.how ul{padding-left:20px;margin:0}
.how li{margin:0 0 11px;font-weight:700;line-height:1.45}
.how b{color:var(--accent)}
.mrow{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:11px 14px;margin-bottom:8px;box-shadow:0 2px 8px var(--shade)}
.mrow .dotc{width:12px;height:12px;border-radius:50%;background:var(--rc);flex:none}
.mrow .nm{flex:1;font-weight:900}
.mrow .mb{width:38%;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.mrow .mb i{display:block;height:100%;background:var(--rc)}
.mrow small{width:52px;text-align:right;color:var(--muted);font-weight:800;font-size:.8rem}
.bigstats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.bigstats div{background:var(--panel);border-radius:14px;padding:11px 13px;box-shadow:0 2px 8px var(--shade)}
.bigstats small{display:block;color:var(--muted);font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.bigstats b{font-size:1.3rem;font-weight:900}
.sect{margin:18px 4px 8px;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btable{width:100%;border-collapse:separate;border-spacing:0 6px}
.btable td,.btable th{padding:8px 10px;text-align:left;font-weight:800}
.btable th{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.btable td{background:var(--panel)}
.btable td:first-child{border-radius:12px 0 0 12px}.btable td:last-child{border-radius:0 12px 12px 0}
.btable .dotc{width:10px;height:10px;border-radius:50%;background:var(--rc);display:inline-block;margin-right:7px}
.danger{margin-top:18px;width:100%;padding:12px;border-radius:14px;border:2px solid var(--bad);color:var(--bad);font-weight:900}
.reduce *{animation-duration:.01ms!important;transition-duration:.01ms!important}
</style>
</head>
<body>
<!-- ================= HOME ================= -->
<div class="home" id="home">
  <div class="homeset">
    <button class="iconbtn" id="atlasBtn" aria-label="Flag atlas"><svg class="ic" viewBox="0 0 24 24"><path d="M3.5 6.5l5.5-2.5 6 2.5 5.5-2.5v13.5l-5.5 2.5-6-2.5-5.5 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg></button>
    <button class="iconbtn" id="recBtn" aria-label="Records"><svg class="ic" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H4.5a3 3 0 0 0 3.5 4M16 6h3.5a3 3 0 0 1-3.5 4M12 13v4M8.5 20h7"/></svg></button>
  </div>

const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch { return d; } };
const keep = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const PREF_KEY = 'flagquiz-prefs-v1', STATS_KEY = 'flagquiz-stats-v1', FLAGS_KEY = 'flagquiz-flags-v1';
const prefs = Object.assign({mode: 'choose', regions: ['world'], len: 10}, load(PREF_KEY, {}));

// stats: rounds played, flags answered, right, best streak, perfect rounds, and the best score for each kind of round
const stats = Object.assign({rounds: 0, answered: 0, right: 0, bestStreak: 0, perfect: 0, best: {}}, load(STATS_KEY, {}));
// for every flag: times right, times wrong, and how many right in a row since the last miss
const flagStats = load(FLAGS_KEY, {});
const fs = code => flagStats[code] || {r: 0, w: 0, run: 0};
const isMistake = code => { const f = fs(code); return f.w > 0 && f.run < 2; };
const known = code => fs(code).run >= 2;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmtTime = s => { s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const vibrate = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

/* ======================================================================
   THE FLAG PICTURES
   All 197 are downloaded once and kept on the device (in the game's own
   storage), so the game works without the internet afterwards. Every time
   the game opens it checks they're all still there and fetches any that
   are missing. You can't play until every flag is ready.
   They come from flagcdn.com; if one can't be fetched from there, the
   country-flags collection on jsDelivr is tried instead.
   ====================================================================== */
const SOURCES = [code => `https://flagcdn.com/w640/${code}.png`, code => `https://cdn.jsdelivr.net/gh/hampusborgos/country-flags@main/svg/${code}.svg`];
const FLAG_CACHE = 'flagquiz-flags-v1';
const flagKey = code => new URL(`flagquiz-flag/${code}`, location.href).href;   // just a name for it in storage
const flagEmoji = code => code.toUpperCase().replace(/./g, ch => String.fromCodePoint(0x1F1E6 + ch.charCodeAt(0) - 65));
const SRC = {};   // code -> a picture the page can show straight away
const flagSrc = code => SRC[code] || SOURCES[0](code);
function flagImg(code, w, alt = '') {
  return `<img src="${flagSrc(code)}" alt="${esc(alt)}" decoding="async" onerror="this.outerHTML='<span class=em>${flagEmoji(code)}</span>'">`;
}
const Flags = {have: 0, total: COUNTRIES.length, busy: false, failed: false, ready: false};
async function fetchFlag(code) {
  for (const src of SOURCES) {
    try {
      const res = await fetch(src(code), {mode: 'cors', cache: 'no-cache'});
      if (!res.ok) continue;
      const blob = await res.blob();
      if (blob.size < 60 || !/^image\//.test(blob.type)) continue;
      return blob;
    } catch {}
  }
  return null;
}
// with no storage (very old browsers, or some previews), just load every picture now and wait for them
function loadPlain(code) {
  return new Promise(ok => { const im = new Image(); im.onload = () => ok(true); im.onerror = () => ok(false); im.src = SOURCES[0](code); SRC[code] = im.src; });
}
async function checkFlags() {
  if (Flags.busy) return;
  Flags.busy = true; Flags.failed = false; renderPlay();
  let cache = null;
  try { cache = await caches.open(FLAG_CACHE); } catch {}
  const missing = [];
  if (cache) {
    // what's already saved
    await Promise.all(COUNTRIES.map(async c => {
      if (SRC[c.code] && SRC[c.code].startsWith('blob:')) return;
      try { const r = await cache.match(flagKey(c.code)); if (r) { SRC[c.code] = URL.createObjectURL(await r.blob()); return; } } catch {}
      missing.push(c.code);
    }));
  } else missing.push(...COUNTRIES.map(c => c.code).filter(code => !SRC[code]));
  Flags.have = Flags.total - missing.length; renderPlay();
  // fetch the rest, six at a time
  let k = 0, bad = 0;
  const worker = async () => {
    while (k < missing.length) {
      const code = missing[k++];
      let ok = false;
      if (cache) {
        const blob = await fetchFlag(code);
        if (blob) {
          try { await cache.put(flagKey(code), new Response(blob, {headers: {'content-type': blob.type}})); } catch {}
          SRC[code] = URL.createObjectURL(blob); ok = true;
        }
      } else ok = await loadPlain(code);
      if (ok) Flags.have++; else bad++;
      renderDownload();
    }
  };
  await Promise.all(Array.from({length: 6}, worker));
  Flags.busy = false; Flags.failed = bad > 0; Flags.ready = Flags.have >= Flags.total;
  if (Flags.ready && missing.length && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  renderHome();
  if ($('#atlasPanel').classList.contains('show')) renderAtlas();
}
addEventListener('online', () => { if (!Flags.ready) checkFlags(); });
// the box that stands in for the Play button until every flag is ready
function renderDownload() {
  const box = $('#dlBox'); if (!box) return;
  const pct = Math.round(100 * Flags.have / Flags.total);
  if (Flags.ready) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  box.classList.toggle('bad', Flags.failed && !Flags.busy);
  if (Flags.busy) box.innerHTML = `<b>Getting the flags ready</b><small>${Flags.have} of ${Flags.total} downloaded</small><div class="bar"><i style="width:${pct}%"></i></div><small class="why">This happens once, so the game works without the internet after.</small>`;
  else if (!Flags.have) box.innerHTML = `<b>The flags need downloading</b><small>Connect to the internet to download all ${Flags.total} flags. You only need to do this once.</small><button class="primary" id="dlRetry">Try again</button>`;
  else box.innerHTML = `<b>Some flags are missing</b><small>${Flags.have} of ${Flags.total} downloaded. Connect to the internet to get the rest; you can play once every flag is here.</small><div class="bar"><i style="width:${pct}%"></i></div><button class="primary" id="dlRetry">Try again</button>`;
  const r = $('#dlRetry'); if (r) r.onclick = () => checkFlags();
}

/* ---------- sound effects (follow the shared Rizzo volume) ---------- */
const Sound = (() => {
  let ctx = null;
  const vol = () => RZ ? RZ.level('sfx') : 0.6;
  const ac = () => { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); return ctx; };
  function tone(freq, dur, type = 'sine', gain = .2, delay = 0, slide = 0) {
    const v = vol(); if (!v) return;
    try {
      const c = ac(), t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(gain * v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .02);
    } catch {}
  }
  return {
    tap() { tone(660, .03, 'triangle', .05); },
    right(n) { const f = 560 * Math.pow(2, Math.min(n, 12) / 24); tone(f, .1, 'triangle', .14); tone(f * 1.5, .12, 'sine', .08, .06); },
    wrong() { tone(220, .18, 'square', .05, 0, .7); },
    nope() { tone(300, .08, 'square', .035, 0, .85); },
    hint() { tone(880, .05, 'sine', .06); tone(1100, .06, 'sine', .05, .05); },
    streak() { [660, 830, 990, 1320].forEach((f, k) => tone(f, .12, 'triangle', .1, k * .06)); },
    done(perfect) { (perfect ? [523, 659, 784, 1047, 1319] : [523, 659, 784]).forEach((f, k) => tone(f, .22, 'triangle', .15, k * .1)); },
  };
})();

/* ======================================================================
   MATCHING TYPED ANSWERS
   Lower case, no accents, no punctuation or spaces, "st" means "saint",
   "&" means "and", and "the" is ignored. Small typos are fine: one slip in
   a name of 5 to 7 letters, two in a longer one, none in a short one. But
   if what you typed is closer to (or is) another country, it doesn't count.
   ====================================================================== */
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/&/g, ' and ')
  .replace(/\bst\b\.?/g, 'saint').replace(/\bthe\b/g, '').replace(/[^a-z]/g, '');
const KEYS = COUNTRIES.map(c => ({code: c.code, keys: [c.name, ...c.alts].map(norm)}));
function dist(a, b) {
  if (Math.abs(a.length - b.length) > 3) return 9;
  let prev = Array.from({length: b.length + 1}, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
// 'exact', 'close' (counts, with a "close enough" note) or false
function checkTyped(text, code) {
  const t = norm(text); if (!t) return false;
  let best = null, bd = 99, bkey = '';
  for (const k of KEYS) for (const key of k.keys) {
    const d = key === t ? 0 : dist(t, key);
    if (d < bd || (d === bd && k.code === code)) { bd = d; best = k.code; bkey = key; }
  }
  if (best !== code) return false;
  if (bd === 0) return 'exact';
  const len = bkey.length, tol = len <= 4 ? 0 : len <= 7 ? 1 : 2;
  return bd <= tol ? 'close' : false;
}

    <p style="color:var(--muted);font-weight:700;font-size:.85rem;margin:6px 4px 0">A flag counts as known once you've got it right twice in a row.</p>
    ${rows.length ? `<div class="sect">Best rounds</div><table class="btable"><tr><th>Round</th><th>Score</th><th>Time</th></tr>${rows.map(([k, v]) => { const [mode, reg] = k.split('|');
      return `<tr><td>${esc(regName(reg))}<br><small style="color:var(--muted)">${mode === 'type' ? 'Type' : 'Choose'} · ${v.total} flags</small></td><td><b>${v.right}/${v.total}</b></td><td>${fmtTime(v.time)}</td></tr>`; }).join('')}</table>` : ''}
    <button class="danger" id="resetBtn">Reset records</button>`;
  $('#resetBtn').onclick = e => {
    const b = e.currentTarget;
    if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = 'Tap again to delete all records'; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'Reset records'; } }, 3000); return; }
    Object.assign(stats, {rounds: 0, answered: 0, right: 0, bestStreak: 0, perfect: 0, best: {}}); keep(STATS_KEY, stats);
    for (const k in flagStats) delete flagStats[k]; keep(FLAGS_KEY, flagStats);
    renderRecords(); renderHome();
  };
}
$('#recBtn').onclick = () => { renderRecords(); openPanel('#recPanel'); };

$('#playBtn').onclick = () => { Sound.tap(); startRound(); };

/* ---------- start ---------- */
checkFlags();
if (!LENS.includes(prefs.len)) prefs.len = 10;
renderHome();

/* ---------- Rizzo Games hooks (menu, updates) ---------- */
window.RizzoHooks = {
  previewSound: () => Sound.right(4),
  canReload: () => !G || G.done,   // never update in the middle of a round
};
</script>
</body>
</html>
