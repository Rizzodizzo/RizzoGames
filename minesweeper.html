    return same(d, now) ? d.toLocaleTimeString(undefined, {hour: 'numeric', minute: '2-digit'}) : same(d, y) ? 'Yesterday' : d.toLocaleDateString(undefined, {day: 'numeric', month: 'short'}); };
  $('#hlist').innerHTML = list.length ? list.slice(0, 150).map(h => {
    const M = MODES[h.m] || MODES.classic, sz = M.sizes[h.z] || {label: ''};
    const badge = h.m === 'time' ? 't' : h.w ? 'w' : 'l';
    const val = h.m === 'time' ? `${h.sc} ${ic('grid')}` : h.w ? fmt(h.ms, true) : `<span style="color:var(--boom)">${fmt(h.ms)}</span>`;
    return `<div class="hrow${h.rp ? ' rp' : ''}"${h.rp ? ` data-t="${h.t}" role="button" tabindex="0" aria-label="Watch timelapse"` : ''}><span class="hb ${badge}">${h.m === 'time' ? ic('clock') : h.w ? ic(M.icon) : ic('close')}</span>
      <span class="hm"><b>${M.name}</b><small>${sz.label} · ${day(h.t)}</small></span>
      <span class="hv">${h.b ? ic('trophy') : ''}${h.h ? ic('bulb') : ''}${val}${h.rp ? `<i class="hplay">${ic('play')}</i>` : ''}</span></div>`;
  }).join('') : `<p class="hempty">${ic('history')}No games yet</p>`;
  $('#histClear').classList.toggle('hidden', !all.length);
  $('#histClear').textContent = 'Clear history';
}
$('#hfilt').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { histFilter = b.dataset.f; renderHistory(); } });
$('#histClear').onclick = () => {
  const b = $('#histClear');
  if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Tap again to clear'; setTimeout(() => { delete b.dataset.sure; b.textContent = 'Clear history'; }, 3000); return; }
  delete b.dataset.sure; keep(HIST_KEY, []); renderHistory(); renderHistBadge();
};
$('#historyBtn').onclick = () => { prefs.histSeen = Date.now(); savePrefs(); renderHistBadge(); renderHistory(); openPanel('histPanel'); };


/* ---------- Timelapse: watch a finished game play back ---------- */
const RP = (() => {
  let e = null, ev = [], P = [], end = 0, head = 0, playing = false, last = 0, raf = 0, speed = 1, shownK = -1, f = null, fb = -1;
  const v = new BoardView($('#rpBoard'));
  v.locked = true;
  const SPEEDS = [1, 2, 4, 8];
  function open(t) {
    e = history().find(h => h.t === t); if (!e || !e.rp) return;
    const M = MODES[e.m] || MODES.classic;
    $('#rpTitle').textContent = M.name;
    $('#rpSub').textContent = (M.sizes[e.z] ? M.sizes[e.z].label + ' · ' : '') + new Date(e.t).toLocaleDateString(undefined, {day: 'numeric', month: 'short', year: 'numeric'});
    ev = []; e.rp.boards.forEach((b, bi) => b.log.forEach(([t, k, i]) => ev.push({b: bi, t, k, i})));
    // playback timing: real gaps, but long thinks are squeezed and each new board gets a beat
    // a typical game plays back in about 5 seconds: real rhythm, squeezed hard, so it looks satisfyingly quick
    const raw = ev.length ? ev[ev.length - 1].t - ev[0].t : 0, squeeze = raw ? Math.min(1, 5000 / raw) : 1;
    P = []; let pt = 450;                     // a moment to see the untouched field first
    ev.forEach((x, j) => { if (j) { const p = ev[j - 1]; pt += x.b !== p.b ? 550 : Math.min(320, Math.max(35, (x.t - p.t) * squeeze)); } P.push(pt); });
    end = pt + 900; head = 0; shownK = -1; fb = -1; speed = 1;
    $('#rpSpeed').textContent = '1×';
    $('#rpBoards').parentElement.classList.toggle('hidden', e.rp.boards.length < 2);
    openPanel('rpPanel');
    requestAnimationFrame(() => { seek(0, true); play(true); });
  }
  const fieldFor = bi => {
    const b = e.rp.boards[bi], g = new Field({rows: e.rp.rows, cols: e.rp.cols, mines: 0, hex: !!e.rp.hex});
    const list = []; for (let i = 0; i < b.mine.length; i++) if (b.mine[i] === '1') list.push(i);
    g.setMines(list); return g;
  };
  const apply = (g, x) => { const r = x.k === 'f' ? (g.toggleFlag(x.i), null) : x.k === 'c' ? g.chord(x.i) : g.dig(x.i); if (!g.over) g.checkWin(); return r; };
  const movesAt = h => { let lo = 0, hi = P.length; while (lo < hi) { const m = (lo + hi) >> 1; if (P[m] <= h) lo = m + 1; else hi = m; } return lo; };
  function seek(h, force) {
    head = Math.max(0, Math.min(end, h));
    const k = movesAt(head), bi = k ? ev[k - 1].b : 0;
    if (force || k !== shownK) {
      if (!force && f && k === shownK + 1 && ev[k - 1].b === fb) {
        // one more move on the same board: play it with the dig animation
        const x = ev[k - 1], r = apply(f, x);
        if (x.k === 'f') v.paint(x.i, 0, true);
        else if (r) { for (const [j, d] of r.opened) v.paint(j, reduced() ? 0 : Math.min(d * 18 / speed, 220), true); if (r.boom >= 0 || f.won) v.paintAll(); }
        if (f.won) v.paintAll();
      } else {
        f = fieldFor(bi);
        for (let j = 0; j < k; j++) if (ev[j].b === bi) apply(f, ev[j]);
        if (fb !== bi) { v.setField(f); v.locked = true; layout(); } else { v.f = f; v.paintAll(); }
        fb = bi;
      }
      shownK = k;
      $('#rpBoard').classList.toggle('done', f.over);
    }
    $('#rpScrub').value = Math.round(head / end * 1000);
    const now = k ? ev[k - 1].t : 0;
    $('#rpTime').textContent = fmt(e.m === 'time' ? now : Math.min(now, e.ms), false);
    $('#rpMoves').textContent = k;
    $('#rpFlags').textContent = f ? f.flags : 0;
    $('#rpBoards').textContent = (bi + 1) + ' / ' + e.rp.boards.length;
  }
  function layout() { const w = $('#rpWrap'); if (v.f) v.layout(w.clientWidth - 8, w.clientHeight - 8, 10, 40); }
  function tick(ts) {
    if (!playing) return;
    const dt = Math.min(100, ts - (last || ts)); last = ts;
    seek(head + dt * speed);
    if (head >= end) { play(false); return; }
    raf = requestAnimationFrame(tick);
  }
  function play(on) {
    playing = on; cancelAnimationFrame(raf); last = 0;
    $('#rpPlay').innerHTML = ic(on ? 'pause' : 'play'); $('#rpPlay').setAttribute('aria-label', on ? 'Pause' : 'Play');
    if (on) { if (head >= end) seek(0, true); raf = requestAnimationFrame(tick); }
  }
  $('#rpPlay').onclick = () => play(!playing);
  $('#rpScrub').addEventListener('input', () => { play(false); seek($('#rpScrub').value / 1000 * end); });
  $('#rpSpeed').onclick = () => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; $('#rpSpeed').textContent = speed + '×'; };
  addEventListener('resize', () => { if ($('#rpPanel').classList.contains('show')) layout(); });
  return {open, stop: () => play(false)};
})();
$('#hlist').addEventListener('click', ev => { const r = ev.target.closest('.hrow.rp'); if (r) RP.open(+r.dataset.t); });
$('#hlist').addEventListener('keydown', ev => { if (ev.key === 'Enter') { const r = ev.target.closest('.hrow.rp'); if (r) RP.open(+r.dataset.t); } });

/* ---------- How to play: little boards you can try ---------- */
const How = (() => {
  let step = 0, cleanup = null, demo = null;
  const stage = () => $('#howStage');
  const capTxt = (icon, html, done) => { const c = $('#howCap'); c.className = 'cap' + (done ? ' done' : ''); c.innerHTML = `<span class="ci">${icon}</span><span>${html}</span>`; };
  const flagIcon = `<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><use href="#i-flag"/></svg>`;
  // one 6×6 field shared by the first few steps
  const MINES = [4, 11, 19, 30, 23];
  const base = () => { const f = new Field({rows: 6, cols: 6, mines: MINES.length}); f.setMines(MINES); return f; };
  const dug = () => { const f = base(); f.dig(27); return f; };
  function makeBoard(f, onAct) {
    stage().innerHTML = '<div class="board"></div>';
    const v = new BoardView(stage().firstChild, {onAct});
    v.setField(f); demo = v; relayout();
    return v;
  }
  function relayout() { if (demo) { const w = Math.min(stage().clientWidth - 32, 330); demo.layout(w, 300, 20, 54); } }
  // the first mine next to the dug area, and a number next to it that it completes
  function flagSpot(f) {
    for (const m of MINES) {
      if (!f.nb[m].some(j => f.state[j] === 1)) continue;
      for (const c of f.nb[m]) if (f.state[c] === 1 && f.count[c] === 1 && f.nb[c].some(j => f.state[j] === 0 && !f.mine[j])) return {m, c};
    }
    return null;
  }
  const STEPS = [
    {title: 'Dig', run() {
      const f = base();
      const v = makeBoard(f, i => {
        if (f.over) return;
        const r = f.state[i] === 0 ? f.dig(i) : null; if (!r) return;
        v.mark(27, 'tapme', false);
        for (const [j, d] of r.opened) v.paint(j, Math.min(d * 40, 500), true);
        if (r.boom >= 0) { v.paintAll(); capTxt(MINE_INK, 'Boom! Try the glowing square'); setTimeout(() => STEPS[0].run(), 1100); return; }
        Sound.dig(r.opened.length);
        capTxt(ic('check'), 'Empty areas open up by themselves', true);
      });
      v.mark(27, 'tapme');
      capTxt(ic('hand'), touchFirst ? 'Tap a square to dig' : 'Click a square to dig');
    }},
    {title: 'Numbers', run() {
      const f = dug(), v = makeBoard(f, () => {});
      const nums = []; for (let i = 0; i < f.n; i++) if (f.state[i] === 1 && f.count[i]) nums.push(i);
      let k = 0;
      const show = () => {
        const c = nums[k++ % nums.length];
        v.highlight({kind: 'mine', clues: [c], targets: f.nb[c].filter(j => f.mine[j])});
      };
      show(); const t = setInterval(show, 1700);
      capTxt(`<b class="n2" style="font-size:1.3rem">2</b>`, `= 2 mines touching it`);
      return () => clearInterval(t);
    }},
    {title: 'Flag', run() {
      const f = dug(), spot = flagSpot(f), v = makeBoard(f, i => {
        if (i !== spot.m || f.state[i] === 2) return;
        f.toggleFlag(i); v.paint(i, 0, true); v.mark(i, 'tapme', false); Sound.flag(true); vibrate(18);
        capTxt(flagIcon, 'Flagged. Flags mark mines so you don\'t dig them', true);
      });
      v.highlight({kind: 'mine', clues: [spot.c], targets: []}); v.mark(spot.m, 'tapme');
      capTxt(flagIcon, touchFirst ? 'Hold the glowing square to flag it' : 'Right-click the glowing square to flag it');
    }},
    {title: 'Clear around', run() {
      const f = dug(), spot = flagSpot(f); f.toggleFlag(spot.m);
      const v = makeBoard(f, i => {
        if (i !== spot.c) return;
        const r = f.chord(i); if (!r) return;
        v.clearHighlight(); v.mark(spot.c, 'tapme', false);
        for (const [j, d] of r.opened) v.paint(j, d * 50, true);
        Sound.dig(r.opened.length);
        capTxt(ic('check'), 'Its other squares are dug for you', true);
      });
      v.mark(spot.c, 'tapme');
      capTxt(ic('hand'), `Tap a number once its flags are done`);
    }},
    {title: 'Stuck?', run() {
      const f = dug(), spot = flagSpot(f); f.toggleFlag(spot.m);
      const h = f.hint();
      const v = makeBoard(f, i => {
        if (!h.targets.includes(i) || h.kind !== 'safe') return;
        const r = f.dig(i); if (!r) return;
        for (const [j, d] of r.opened) v.paint(j, d * 40, true);
        v.mark(i, 'hsafe', false); h.targets = h.targets.filter(t => t !== i);
        Sound.dig(1);
        if (!h.targets.length) { v.clearHighlight(); capTxt(ic('check'), 'Use hints any time. Best times only count without them', true); }
      });
      stage().insertAdjacentHTML('beforeend', `<div class="mini-tools"><span class="bulb pulse">${ic('bulb')}Hint</span></div>`);
      setTimeout(() => { v.highlight(h); Sound.hint(); }, 700);
      capTxt(ic('bulb'), `<span><span class="sw" style="display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--hclue);vertical-align:middle"></span> proves <span class="sw" style="display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--hsafe);vertical-align:middle"></span> is safe. Tap it</span>`);
    }},
    {title: 'Hexagon', run() {
      const f = new Field({rows: 5, cols: 5, mines: 2, hex: true});
      f.setMines([7, 16]);
      for (let i = 0; i < f.n; i++) if (!f.mine[i]) f.state[i] = 1;
      f.opened = f.n - 2;
      const v = makeBoard(f, () => {});
      v.highlight({kind: 'mine', clues: [12], targets: [7, 16]});
      capTxt(ic('hex'), `Six neighbours instead of eight`);
    }},
    {title: 'Time Attack', run() {
      stage().innerHTML = `<div class="stats" style="margin:0"><span class="chip" id="hwClock"></span><span class="chip" id="hwScore"></span></div><div class="board"></div>
        <div class="legend"><span class="up">${ic('grid')}+5s</span><span class="down"><svg viewBox="0 0 24 24" style="color:var(--boom)"><use href="#i-mine"/></svg>−10s</span><span class="down">${ic('bulb')}−5s</span></div>`;
      const v = new BoardView(stage().querySelector('.board'), {}); demo = v;
      let score = 0, t = 60, f;
      const fresh = () => { f = new Field({rows: 5, cols: 5, mines: 3}); f.place(12); f.state.fill(0); f.opened = 0; v.setField(f); relayout(); };
      fresh();
      const draw = () => { $('#hwClock').innerHTML = ic('clock') + fmt(t * 1000); $('#hwScore').innerHTML = ic('grid') + score; };
      draw();
      let order = [];
      const tick = setInterval(() => {
        if (!order.length) { order = []; for (let i = 0; i < f.n; i++) if (!f.mine[i]) order.push(i); }
        const i = order.shift();
        if (f.state[i] === 0) { const r = f.dig(i); if (r) for (const [j, d] of r.opened) v.paint(j, d * 30, true); }
        if (f.opened === f.n - f.mines) {
          f.checkWin(); v.paintAll(); score++; t += 5; draw(); order = [];
          const b = v.el; b.classList.remove('slidein'); setTimeout(() => { fresh(); b.classList.remove('slidein'); void b.offsetWidth; b.classList.add('slidein'); }, 500);
        }
      }, 260);
      const clock = setInterval(() => { t = t > 1 ? t - 1 : 60; draw(); }, 1000);
      capTxt(ic('clock'), 'Clear as many boards as you can');
      return () => { clearInterval(tick); clearInterval(clock); };
    }},
  ];
  function go(k) {
    if (cleanup) { cleanup(); cleanup = null; }
    demo = null;
    step = Math.max(0, Math.min(STEPS.length - 1, k));
    $('#howTitle').innerHTML = `<span class="hn">${step + 1}</span>${STEPS[step].title}`;
    $('#howCount').textContent = `${step + 1} / ${STEPS.length}`;
    $('#howDots').innerHTML = STEPS.map((_, j) => `<i class="${j === step ? 'on' : ''}"></i>`).join('');
    $('#howPrev').style.visibility = step ? 'visible' : 'hidden';
    $('#howNext').textContent = step === STEPS.length - 1 ? 'Play' : 'Next';
    cleanup = STEPS[step].run() || null;
  }
  $('#howPrev').onclick = () => go(step - 1);
  $('#howNext').onclick = () => { if (step === STEPS.length - 1) { closePanel($('#howPanel')); if (!$('#home').classList.contains('hidden')) play(false); } else go(step + 1); };
  return {
    open() { openPanel('howPanel'); requestAnimationFrame(() => go(0)); },
    stop() { if (cleanup) { cleanup(); cleanup = null; } },
    relayout,
  };
})();
$('#howBtn').onclick = () => How.open();

/* ---------- start ---------- */
RZT.config({theme: () => TH.resolved, fxOn: () => !reduced() && prefs.fx !== false, reduceMotion: reduced, sound: k => Sound[k] && Sound[k]()});
TH.ready = true;
applyTheme();
fillIcons();
drawTitle();
renderModes(); setMode(modeIdx); renderSizes(); renderPlay(); renderHistBadge();
$('#modePrev').disabled = modeIdx === 0; $('#modeNext').disabled = modeIdx === MODE_IDS.length - 1;

/* ---------- Rizzo Games hooks (menu, updates) ---------- */
if (RZ) RZ.onChange(() => applyTheme());   // e.g. Reduce motion switched off: bring the decorations back
window.RizzoHooks = {
  onMenuOpen: () => updatePaused(),
  onMenuClose: () => updatePaused(),
  previewSound: () => Sound.dig(2),
  beforeReload() { saveGame(); return {inGame: !$('#game').classList.contains('hidden') && G && !G.ended ? G.mode : null}; },
  afterReload(info) { const s = info && info.inGame && load(saveKey(info.inGame), null); if (s && resumeGame(s)) showGame(); },
};
