<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Emoji Quiz</title>
<meta name="theme-color" content="#fff8ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17120b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<script src="games.js" data-game="emojiquiz" data-show-when="#home:not(.hidden)" data-hide-when=".panel.show, #game:not(.hidden)" data-sounds="sfx" data-top="16" data-left="16" data-pill-top="64"></script>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Emoji Quiz">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* COLOURS: light or dark, following the device */
:root{--ease:cubic-bezier(.2,.8,.2,1);--pop:cubic-bezier(.3,1.6,.5,1);
  --bg:#fff8ec;--panel:#ffffff;--ink:#2b2113;--muted:#7d6a52;--line:#f0e3cf;--soft:#f7ecd9;
  --accent:#f08a00;--hi:#ffb347;--edge:#b56200;--onaccent:#2b1a00;--shade:rgba(120,70,0,.13);
  --ok:#16a34a;--okbg:#dcf7e5;--near:#d97706;--nearbg:#fff1d6;--bad:#e5484d;--badbg:#fde3e4;--gold:#d99a00;
  --rz-btn-bg:var(--panel);--rz-btn-fg:var(--accent);--rz-btn-border:1px solid var(--line);--rz-btn-radius:12px;--rz-btn-shadow:0 2px 8px var(--shade);--rz-btn-size:42px}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --bg:#17120b;--panel:#241c12;--ink:#fbf1e2;--muted:#b9a58a;--line:#3a2d1c;--soft:#2d2316;
  --accent:#ffab3d;--hi:#ffc670;--edge:#a85f00;--onaccent:#2b1a00;--shade:rgba(0,0,0,.45);
  --ok:#2fd06b;--okbg:#123222;--near:#f5a524;--nearbg:#3a2a0c;--bad:#ff5a5f;--badbg:#3a1518;--gold:#ffc83d}}
*{box-sizing:border-box}
html{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.iconbtn{width:42px;height:42px;border-radius:12px;display:inline-grid;place-items:center;background:var(--panel);border:1px solid var(--line);box-shadow:0 2px 8px var(--shade);color:var(--accent)}
.iconbtn:active{transform:scale(.94)}
.primary{background:linear-gradient(180deg,var(--hi),var(--accent));color:var(--onaccent);box-shadow:0 4px 0 var(--edge),0 8px 18px var(--shade);border-radius:16px;font-weight:900}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.primary:disabled{filter:grayscale(.7);opacity:.55;transform:none}
.bar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--hi));transition:width .35s var(--ease)}

/* ================= HOME ================= */
.home{max-width:480px;margin:0 auto;height:100%;min-height:520px;display:flex;flex-direction:column;padding-top:48px}
.hero{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 0}
.hero svg{width:auto;height:min(64px,8.5vh);flex:none;filter:drop-shadow(0 4px 8px var(--shade))}
.hero h1{margin:0;font-size:clamp(1.45rem,4vh,1.85rem);font-weight:900;letter-spacing:-.01em;white-space:nowrap}
.hl{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.modes{position:relative;flex:1 1 0;min-height:150px;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:22px 20% 10px;margin:0 -16px;
  scrollbar-width:none;overscroll-behavior-x:contain;align-items:stretch}
.modes::-webkit-scrollbar{display:none}
@media (hover:hover) and (pointer:fine){.modes{cursor:grab}.modes.dragging{cursor:grabbing;scroll-snap-type:none}}
.mode{container-type:size;flex:0 0 100%;scroll-snap-align:center;max-height:360px;align-self:center;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.6vh,12px);
  background:var(--panel);border-radius:26px;box-shadow:0 6px 20px var(--shade);transition:transform .3s var(--ease),opacity .3s;position:relative}
.mode.active{outline:2.5px solid var(--accent);outline-offset:-2.5px}
.mode:not(.active){transform:scale(.84);opacity:.45}
.mode h2{margin:0;font-size:clamp(1.15rem,3vh,1.5rem);font-weight:900}
.mode p{margin:-4px 12px 0;color:var(--muted);font-weight:800;font-size:.85rem;text-align:center}
.mart{width:min(clamp(100px,min(52vw,28vh),220px),calc(100cqh - 96px));height:auto;flex:none;min-width:56px;filter:drop-shadow(0 6px 12px var(--shade))}
.mode .pb{position:absolute;top:-14px;left:50%;translate:-50% 0;z-index:2;display:flex;align-items:center;gap:5px;padding:5px 13px 5px 9px;border-radius:99px;background:var(--panel);color:var(--ink);font-weight:900;font-size:.9rem;white-space:nowrap;
  box-shadow:0 0 0 3px var(--bg),0 3px 10px var(--shade),inset 0 0 0 1.5px var(--line)}
.mode .pb.gold{background:#ffd23f;color:#3a2c00;box-shadow:0 0 0 3px var(--bg),0 3px 10px var(--shade)}
.mode .pb svg{width:16px;height:16px;color:#e0a800}
.mode .pb.gold svg{color:#3a2c00}
.modenav{flex:none;display:flex;align-items:center;justify-content:center;gap:12px;margin:2px 0 0}
.modearrow{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--muted)}
.modearrow .ic{width:18px;height:18px}
.modearrow.l svg{transform:scaleX(-1)}
.modearrow:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .25s var(--ease),background .25s}
.dots i.on{width:22px;background:var(--accent)}
.lbl{margin:12px 4px 6px;font-size:.74rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;gap:3px;padding:4px;background:var(--panel);border-radius:15px;box-shadow:0 2px 8px var(--shade)}
.seg button{flex:1;min-width:0;padding:9px 2px;border-radius:11px;color:var(--muted);font-weight:900;font-size:.95rem;transition:background .2s,color .2s;white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--onaccent)}
.play{flex:none;margin-top:14px;padding:15px;font-size:1.2rem;display:flex;flex-direction:column;align-items:center;gap:1px;width:100%}
.play small{font-size:.78rem;font-weight:800;opacity:.9}
.dl{flex:none;margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--panel);box-shadow:0 2px 8px var(--shade);text-align:center}
.dl b{display:block;font-weight:900;font-size:1.05rem}
.dl small{display:block;color:var(--muted);font-weight:800;font-size:.86rem;margin-top:2px}
.dl small.why{font-size:.78rem;margin-top:8px}
.dl .bar{margin-top:10px}
.dl.bad b{color:var(--bad)}
.dl .primary{margin-top:12px;padding:11px 22px;font-size:1rem}
@media (max-height:700px){.modes{padding-top:20px}.lbl{margin:8px 4px 5px}.seg button{padding:7px 2px}.play{padding:12px;margin-top:10px}.dl{margin-top:10px}}

/* ================= RESULTS ================= */
.results{max-width:520px;margin:0 auto;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:58px 0 10px;text-align:center}
.big{font-size:3.2rem;font-weight:900;line-height:1;margin-top:6px;color:var(--accent)}
.big small{font-size:1.1rem;color:var(--muted)}
.results h2{margin:10px 0 2px;font-size:1.6rem;font-weight:900}
.results .sub{color:var(--muted);font-weight:800}
.newbest{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:99px;background:var(--gold);color:#2a1c00;font-weight:900;font-size:.85rem}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.rstats div{background:var(--panel);border-radius:14px;padding:10px 6px;box-shadow:0 2px 8px var(--shade)}
.rstats small{display:block;color:var(--muted);font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.rstats b{font-size:1.25rem;font-weight:900}
.rbtns{display:flex;gap:10px}
.rbtns button{flex:1;padding:14px;font-size:1.05rem}
.ghost{background:var(--panel);border-radius:16px;font-weight:900;color:var(--accent);box-shadow:0 2px 8px var(--shade)}
.rlist{margin-top:20px;text-align:left}
.rlist h3{margin:0 4px 10px;font-size:.8rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rrow{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:14px;padding:9px 12px;margin-bottom:7px;box-shadow:0 2px 8px var(--shade)}
.rrow .fl{width:44px;height:30px;flex:none;display:grid;place-items:center}
.rrow .fl img{display:block;width:auto;height:auto;max-width:44px;max-height:30px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.rrow .fl .em{font-size:1.6rem}
.rrow .nm{flex:1;min-width:0;font-weight:900}
.rrow .nm small{display:block;color:var(--muted);font-weight:800;font-size:.78rem}
.rrow .p{font-weight:900;padding:3px 9px;border-radius:9px;color:#fff;font-size:.88rem}
.rrow .p.ok{background:var(--ok)}.rrow .p.near{background:var(--near)}.rrow .p.no{background:var(--bad)}
.confetti{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;pointer-events:none;z-index:50;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
.reduce *{animation-duration:.01ms!important;transition-duration:.01ms!important}
.homeset{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;display:flex;gap:8px}
.mfan{position:relative;width:min(clamp(100px,min(52vw,28vh),220px),calc(100cqh - 96px));aspect-ratio:1;flex:none}
.mfan img,.mfan .em{position:absolute;left:50%;top:50%;width:62%;border-radius:6px;box-shadow:0 6px 14px var(--shade),0 0 0 1px rgba(0,0,0,.08);background:var(--soft)}
.mfan .em{width:auto;font-size:calc(min(clamp(100px,min(52vw,28vh),220px),calc(100cqh - 96px)) * .4);box-shadow:none;background:none;line-height:1}
.mfan>*:nth-child(1){transform:translate(-78%,-62%) rotate(-12deg)}
.mfan>*:nth-child(2){transform:translate(-22%,-58%) rotate(10deg)}
.mfan>*:nth-child(3){transform:translate(-50%,-36%) rotate(-2deg)}
.mfan .x{position:absolute;right:6%;bottom:8%;width:28%;aspect-ratio:1;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;box-shadow:0 4px 10px var(--shade);transform:none}
.mfan .x svg{width:55%;height:55%;stroke-width:3.2}
.panel{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s var(--ease);visibility:hidden}
.panel.show{transform:none;visibility:visible}
.phead{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 8px;max-width:640px;width:100%;margin:0 auto}
.phead h2{margin:0;font-size:1.35rem;font-weight:900;flex:1}
.pbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px calc(env(safe-area-inset-bottom,0px) + 24px);max-width:640px;width:100%;margin:0 auto}
.mrow{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:11px 14px;margin-bottom:8px;box-shadow:0 2px 8px var(--shade)}
.mrow .dotc{width:12px;height:12px;border-radius:50%;background:var(--rc);flex:none}
.mrow .nm{flex:1;font-weight:900}
.mrow .mb{width:38%;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.mrow .mb i{display:block;height:100%;background:var(--rc)}
.mrow small{width:52px;text-align:right;color:var(--muted);font-weight:800;font-size:.8rem}
.bigstats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.bigstats div{background:var(--panel);border-radius:14px;padding:11px 13px;box-shadow:0 2px 8px var(--shade)}
.bigstats small{display:block;color:var(--muted);font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.bigstats b{font-size:1.3rem;font-weight:900}
.sect{margin:18px 4px 8px;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btable{width:100%;border-collapse:separate;border-spacing:0 6px}
.btable td,.btable th{padding:8px 10px;text-align:left;font-weight:800}
.btable th{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.btable td{background:var(--panel)}
.btable td:first-child{border-radius:12px 0 0 12px}.btable td:last-child{border-radius:0 12px 12px 0}
.danger{margin-top:18px;width:100%;padding:12px;border-radius:14px;border:2px solid var(--bad);color:var(--bad);font-weight:900}
.ring{position:relative;width:170px;height:170px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:2.6rem;font-weight:900;line-height:1}
.ring small{color:var(--muted);font-weight:800}
.results{padding-top:58px}
.mart.emo{display:grid;place-items:center;font-size:min(clamp(64px,min(30vw,17vh),130px),calc(100cqh - 110px));line-height:1;width:auto;filter:drop-shadow(0 6px 10px var(--shade))}
.row2{flex:none;display:grid;grid-template-columns:1.2fr 1fr;gap:10px}

/* ================= THE GAME (shared by the quiz games) ================= */
.game{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.gtop{flex:none;display:flex;align-items:center;gap:12px}
.prog{flex:1;min-width:0}
.prog .row{display:flex;justify-content:space-between;font-weight:900;font-size:.9rem;margin-bottom:5px}
.prog .row span{color:var(--muted)}
.streak{display:flex;align-items:center;gap:4px;padding:0 11px;height:42px;border-radius:12px;background:var(--panel);box-shadow:0 2px 8px var(--shade);font-weight:900;color:var(--muted);transition:color .2s}
.streak.hot{color:#ff7a1a}
.streak .ic{width:18px;height:18px}
.feedback{min-height:1.6em;text-align:center;font-weight:900;margin-top:10px;opacity:0;transition:opacity .2s}
.feedback.show{opacity:1}
.feedback.ok{color:var(--ok)}.feedback.no{color:var(--bad)}.feedback.hmm{color:var(--near)}
.feedback b{color:var(--ink)}
.rrow .em2{font-size:1.5rem;flex:none;max-width:40%;line-height:1.1}
.stage{flex:1 1 0;min-height:0;display:flex;flex-direction:column;justify-content:safe center;padding:10px 0;overflow-y:auto;scrollbar-width:none}
.stage::-webkit-scrollbar{display:none}
.catname{text-align:center;color:var(--muted);font-weight:900;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase}
.emo{flex:0 1 auto;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.08em;margin:8px 0 14px;padding:18px 12px;border-radius:26px;background:var(--panel);box-shadow:0 6px 20px var(--shade);
  font-size:min(22vw,13vh,110px);line-height:1.15;text-align:center;min-height:1.6em}
.emo[data-n="3"]{font-size:min(19vw,12vh,96px)}.emo[data-n="4"]{font-size:min(16vw,11vh,84px)}
.emo.pop{animation:epop .4s var(--pop)}
@keyframes epop{from{transform:scale(.7);opacity:0}}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{min-height:58px;padding:10px 12px;border-radius:15px;background:var(--panel);box-shadow:0 3px 0 var(--line),0 6px 14px var(--shade);font-weight:900;font-size:1rem;text-align:center;line-height:1.2;transition:background .2s,color .2s,transform .15s}
.ans:active{transform:translateY(2px)}
.ans.right{background:var(--ok);color:#fff;box-shadow:none}.ans.wrong{background:var(--bad);color:#fff;box-shadow:none}
.spellbox{display:none}
.game.spell .answers{display:none}.game.spell .spellbox{display:block}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;--sz:34px}
.slots.long{--sz:27px;gap:5px 10px}
.word{display:flex;gap:4px;align-items:flex-end}
.slot{width:var(--sz);height:calc(var(--sz) * 1.2);border-radius:8px;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);font-weight:900;font-size:calc(var(--sz) * .56);display:grid;place-items:center}
.slot.full{box-shadow:inset 0 0 0 2px var(--accent)}
.slot.lock{background:var(--okbg);box-shadow:inset 0 0 0 2px var(--ok);color:var(--ok)}
.punc{font-weight:900;font-size:calc(var(--sz) * .6);padding:0 1px;align-self:center}
.slots.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:16px}
.tile{width:42px;height:46px;border-radius:11px;background:linear-gradient(180deg,var(--hi),var(--accent));color:var(--onaccent);font-weight:900;font-size:1.25rem;box-shadow:0 3px 0 var(--edge);transition:opacity .15s,transform .1s}
.tile:active{transform:translateY(2px)}
.tile.used{opacity:.18;box-shadow:none}
.tools{display:flex;justify-content:center;gap:8px;margin-top:14px}
.tool{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;background:var(--panel);box-shadow:0 2px 8px var(--shade);font-weight:900;font-size:.9rem;color:var(--muted)}
.next{width:100%;padding:14px;font-size:1.1rem;margin-top:10px}
.foot{flex:none;min-height:62px}
@media (max-height:640px){.emo{padding:10px;margin:4px 0 10px;font-size:min(18vw,11vh)}.tile{width:38px;height:40px}.ans{min-height:48px}}
@media (max-height:740px){.game.spell .emo{font-size:min(15vw,8.5vh);padding:8px 10px;margin:4px 0 10px;border-radius:18px}.game.spell .bank{margin-top:10px;gap:6px}.game.spell .tools{margin-top:10px}.game.spell .tile{width:38px;height:40px;font-size:1.1rem}.game.spell .foot{min-height:54px}.game.spell .next{padding:11px;margin-top:6px}}
.game.spell .foot{min-height:0}
.game.spell.done .bank,.game.spell.done .tools{display:none}

</style>
</head>
<body>
<div class="home" id="home">
  <div class="homeset">
    <button class="iconbtn" id="recBtn" aria-label="Records"><svg class="ic" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H4.5a3 3 0 0 0 3.5 4M16 6h3.5a3 3 0 0 1-3.5 4M12 13v4M8.5 20h7"/></svg></button>
  </div>
  <div class="hero" role="img" aria-label="Emoji Quiz">
    <svg viewBox="0 0 150 120" aria-hidden="true"><defs><radialGradient id="fy" cx="38%" cy="30%" r="80%"><stop offset="0" stop-color="#ffe77a"/><stop offset=".7" stop-color="#ffc93a"/><stop offset="1" stop-color="#f0a010"/></radialGradient></defs>
      <circle cx="58" cy="66" r="48" fill="url(#fy)"/>
      <ellipse cx="41" cy="56" rx="6.5" ry="9" fill="#4a3000"/><ellipse cx="72" cy="56" rx="6.5" ry="9" fill="#4a3000"/>
      <circle cx="43.5" cy="52" r="2.4" fill="#fff"/><circle cx="74.5" cy="52" r="2.4" fill="#fff"/>

const reduced = () => document.documentElement.classList.contains('rz-reduce-motion') || matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmtTime = s => { s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const vibrate = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };
const starIc = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.8l2.8 5.7 6.3.9-4.55 4.45 1.07 6.25L12 17.15 6.38 20.1l1.07-6.25L2.9 9.4l6.3-.9z"/></svg>';
/* sound effects (follow the shared Rizzo volume) */
const Sound = (() => {
  let ctx = null;
  const vol = () => RZ ? RZ.level('sfx') : 0.6;
  const ac = () => { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); return ctx; };
  function tone(freq, dur, type = 'sine', gain = .2, delay = 0, slide = 0) {
    const v = vol(); if (!v) return;
    try {
      const c = ac(), t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);

    tap() { tone(660, .03, 'triangle', .05); },
    pop() { tone(520, .04, 'triangle', .07); },

function Cards(o) {   // o: ids(), html(id, active), aria(id), get(), set(id), play(), canPlay()
  const m = $('#modes');

  const scrollTo = (k, instant) => { const c = m.children[k]; if (!c || $('#home').classList.contains('hidden')) return; m.scrollTo({left: c.offsetLeft - (m.clientWidth - c.clientWidth) / 2, behavior: instant || reduced() ? 'auto' : 'smooth'}); };
  function render() {
    const ids = o.ids();
    if (!ids.includes(o.get())) o.set(ids[0]);

    const ids = o.ids();

    idx = k;
    [...m.children].forEach((c, j) => c.classList.toggle('active', j === k));

    clearTimeout(t);

      let best = 0, bd = 1e9;
      [...m.children].forEach((c, k) => { const d = Math.abs(c.offsetLeft + c.clientWidth / 2 - mid); if (d < bd) { bd = d; best = k; } });
      set(best);
    }, 60);
  });

  m.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse' && e.button === 0) drag = {x: e.clientX, s: m.scrollLeft, moved: false}; });

function startRound(list) {
  if (!list) {
    // puzzles you haven't solved come first
    const p = shuffle(pool().slice());
    p.sort((a, b) => (stats.solved[a.key] ? 1 : 0) - (stats.solved[b.key] ? 1 : 0));
    list = shuffle(p.slice(0, lenFor(prefs.cat)));
  }
  G = {mode: prefs.mode, cat: prefs.cat, practice: arguments.length > 0, list, i: 0, right: 0, streak: 0, bestStreak: 0, missed: [], start: Date.now()};
  showScreen('#game');
  $('#game').classList.toggle('spell', G.mode === 'spell');
  showQuestion();
}
const isLetter = ch => /[A-Z]/.test(ch);
function showQuestion() {
  const q = G.list[G.i];
  G.done = false; G.tries = 0; G.hints = 0;
  $('#game').classList.remove('done');
  $('#progText').textContent = `${G.i + 1} / ${G.list.length}`;
  $('#progBar').style.width = `${100 * G.i / G.list.length}%`;
  $('#scoreText').textContent = `${G.right} right`;
  $('#streakN').textContent = G.streak; $('#streak').classList.toggle('hot', G.streak >= 3);
  $('#catName').textContent = CAT[q.cat].name;
  const n = [...new Intl.Segmenter().segment(q.e)].length;
  $('#emo').textContent = q.e; $('#emo').dataset.n = Math.min(n, 4);
  $('#emo').classList.remove('pop'); void $('#emo').offsetWidth; $('#emo').classList.add('pop');
  $('#feedback').className = 'feedback'; $('#feedback').innerHTML = '';
  $('#nextBtn').classList.add('hidden');
  if (G.mode === 'choose') {
    const others = shuffle(CAT[q.cat].items.filter(p => p.a !== q.a)).slice(0, 3);
    $('#answers').innerHTML = shuffle([q, ...others]).map(p => `<button class="ans" data-a="${esc(p.a)}">${esc(p.a)}</button>`).join('');
  } else setupSpell(q);
}
/* ----- choose ----- */
$('#answers').addEventListener('click', e => {
  const b = e.target.closest('.ans'); if (!b || G.done) return;
  const q = G.list[G.i], ok = b.dataset.a === q.a;
  b.classList.add(ok ? 'right' : 'wrong');
  if (!ok) document.querySelectorAll('.ans').forEach(x => { if (x.dataset.a === q.a) x.classList.add('right'); });
  answered(ok);
});
/* ----- spell: blanks to fill from a bank of letter tiles ----- */
let SP = null;
function setupSpell(q) {
  const up = q.a.toUpperCase();
  const slots = [...up].map(ch => ({ch, letter: isLetter(ch), tile: null, lock: false}));
  const need = slots.filter(s => s.letter).map(s => s.ch);
  // a few extra letters to make you think (fewer for long answers)
  const extra = Math.max(2, Math.min(5, 14 - need.length)), abc = 'ABCDEFGHIKLMNOPRSTUW';
  const tiles = shuffle([...need, ...Array.from({length: extra}, () => abc[Math.random() * abc.length | 0])]).map(ch => ({ch, used: false}));
  SP = {slots, tiles};
  drawSpell();
}
function drawSpell() {
  // words stay together; each word is a group of boxes
  let html = '', word = '';
  const flush = () => { if (word) { html += `<span class="word">${word}</span>`; word = ''; } };
  SP.slots.forEach((s, k) => {
    if (s.ch === ' ') { flush(); return; }
    word += s.letter ? `<button class="slot${s.tile != null ? ' full' : ''}${s.lock ? ' lock' : ''}" data-k="${k}">${s.tile != null ? SP.tiles[s.tile].ch : ''}</button>` : `<span class="punc">${esc(s.ch)}</span>`;
  });
  flush();
  $('#slots').innerHTML = html;
  $('#slots').classList.toggle('long', SP.slots.length > 16);
  $('#bank').innerHTML = SP.tiles.map((t, k) => `<button class="tile${t.used ? ' used' : ''}" data-k="${k}" ${t.used ? 'disabled' : ''}>${t.ch}</button>`).join('');
}
function placeTile(k) {
  if (G.done || SP.tiles[k].used) return;
  const s = SP.slots.find(s => s.letter && s.tile == null); if (!s) return;
  s.tile = k; SP.tiles[k].used = true; Sound.pop();
  drawSpell();
  if (SP.slots.every(s => !s.letter || s.tile != null)) checkSpell();
}
function clearSlot(s) { if (s.tile != null && !s.lock) { SP.tiles[s.tile].used = false; s.tile = null; } }
function checkSpell() {
  const ok = SP.slots.every(s => !s.letter || SP.tiles[s.tile].ch === s.ch);
  if (ok) { answered(true); return; }
  G.tries++;
  const el = $('#slots'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  Sound.nope(); vibrate(30);
  if (G.tries >= 3) { reveal(); answered(false); return; }
  // letters in the right place stay; the rest go back
  setTimeout(() => {
    if (G.done) return;
    SP.slots.forEach(s => { if (s.letter && s.tile != null) { if (SP.tiles[s.tile].ch === s.ch) s.lock = true; else clearSlot(s); } });
    drawSpell();
    feedback('hmm', `Not quite. ${3 - G.tries} ${3 - G.tries === 1 ? 'try' : 'tries'} left`);
  }, 380);
}
function reveal() {
  SP.slots.forEach(s => { if (s.letter) clearSlot(s), s.lock = false; });
  SP.slots.forEach(s => { if (s.letter) { const k = SP.tiles.findIndex(t => !t.used && t.ch === s.ch); s.tile = k; SP.tiles[k].used = true; s.lock = true; } });
  drawSpell();
}
function hint() {
  if (G.done || G.mode !== 'spell') return;
  // the first box that's empty or wrong gets its letter, and keeps it
  const s = SP.slots.find(s => s.letter && !s.lock && (s.tile == null || SP.tiles[s.tile].ch !== s.ch)); if (!s) return;
  clearSlot(s);
  let k = SP.tiles.findIndex(t => !t.used && t.ch === s.ch);
  if (k < 0) { const other = SP.slots.find(o => o.letter && !o.lock && o.tile != null && SP.tiles[o.tile].ch === s.ch); k = other.tile; other.tile = null; }
  s.tile = k; SP.tiles[k].used = true; s.lock = true; G.hints++;
  Sound.hint(); drawSpell();
  if (SP.slots.every(s => !s.letter || s.tile != null)) checkSpell();
}
$('#bank').addEventListener('click', e => { const b = e.target.closest('.tile'); if (b) placeTile(+b.dataset.k); });
$('#slots').addEventListener('click', e => { const b = e.target.closest('.slot'); if (!b || G.done) return; const s = SP.slots[+b.dataset.k]; if (s.tile != null && !s.lock) { clearSlot(s); Sound.tap(); drawSpell(); } });
$('#hintBtn').onclick = hint;
$('#clearBtn').onclick = () => { if (G.done) return; SP.slots.forEach(clearSlot); Sound.tap(); drawSpell(); };
$('#skipBtn').onclick = () => { if (G.done) return; reveal(); answered(false, true); };
/* ----- after an answer ----- */
function feedback(kind, html) { const f = $('#feedback'); f.className = 'feedback show ' + kind; f.innerHTML = html; }
function answered(ok, skipped) {
  const q = G.list[G.i];
  G.done = true;
  $('#game').classList.add('done');
  stats.answered++;
  if (ok) {
    G.right++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak); stats.right++; stats.solved[q.key] = 1;
    stats.bestStreak = Math.max(stats.bestStreak, G.streak);
    if (G.streak > 0 && G.streak % 5 === 0) Sound.streak(); else Sound.right(G.streak);
    vibrate(15);
    feedback('ok', G.hints ? 'Got it!' : ['Correct!', 'Nice!', 'Yes!', 'Spot on!'][Math.random() * 4 | 0]);
  } else {
    G.streak = 0; G.missed.push(q);
    if (!skipped) { Sound.wrong(); vibrate([30, 40, 30]); }
    feedback('no', `It was <b>${esc(q.a)}</b>`);
  }
  keep(STATS_KEY, stats);
  $('#scoreText').textContent = `${G.right} right`;
  $('#streakN').textContent = G.streak; $('#streak').classList.toggle('hot', G.streak >= 3);
  $('#progBar').style.width = `${100 * (G.i + 1) / G.list.length}%`;
  const b = $('#nextBtn'); b.textContent = G.i + 1 < G.list.length ? 'Next' : 'See results'; b.classList.remove('hidden');
  clearTimeout(G.auto);
  if (ok) G.auto = setTimeout(next, 1100);   // right answers move on by themselves
}
function next() {
  if (!G || !G.done) return;
  clearTimeout(G.auto);
  G.i++;
  if (G.i >= G.list.length) finish(); else showQuestion();
}
$('#nextBtn').onclick = () => { Sound.tap(); next(); };
document.addEventListener('keydown', e => {
  if ($('#game').classList.contains('hidden') || !G) { if (e.key === 'Escape') document.querySelectorAll('.panel.show').forEach(p => p.classList.remove('show')); return; }
  if (G.done) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } return; }
  if (G.mode === 'choose') { const k = '1234'.indexOf(e.key); const b = k >= 0 && document.querySelectorAll('.ans')[k]; if (b) b.click(); return; }
  if (e.key === 'Backspace') { const s = SP.slots.filter(s => s.letter && s.tile != null && !s.lock).pop(); if (s) { clearSlot(s); drawSpell(); } return; }
  if (/^[a-z]$/i.test(e.key)) { const k = SP.tiles.findIndex(t => !t.used && t.ch === e.key.toUpperCase()); if (k >= 0) placeTile(k); }
});
let quitArmed = 0;
$('#quitBtn').onclick = () => {
  if (!G || (G.i === 0 && !G.done) || Date.now() - quitArmed < 2500) { goHome(); return; }
  quitArmed = Date.now(); feedback('hmm', 'Tap X again to stop this round');
};
function goHome() { if (G) clearTimeout(G.auto); G = null; showScreen('#home'); renderHome(); }

/* ---------- results ---------- */
function finish() {
  const n = G.list.length, time = (Date.now() - G.start) / 1000, perfect = G.right === n;
  const key = !G.practice && `${G.mode}|${G.cat}|${n}`;
  const old = key && stats.best[key], better = !!key && (!old || G.right > old.right || (G.right === old.right && time < old.time));
  if (better) stats.best[key] = {right: G.right, total: n, time: Math.round(time), at: Date.now()};
  stats.rounds++; if (perfect) stats.perfect++;
  keep(STATS_KEY, stats);
  const pct = Math.round(100 * G.right / n), C = 2 * Math.PI * 70;
  const title = perfect ? 'Perfect!' : pct >= 80 ? 'Brilliant!' : pct >= 60 ? 'Nice work!' : pct >= 40 ? 'Good effort!' : 'Keep practising!';
  const missed = G.missed.slice();
  $('#results').innerHTML = `
    <div class="ring"><svg viewBox="0 0 160 160"><circle cx="80" cy="80" r="70" fill="none" stroke="var(--soft)" stroke-width="14"/>
      <circle id="ringArc" cx="80" cy="80" r="70" fill="none" stroke="${perfect ? 'var(--gold)' : 'var(--accent)'}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1s var(--ease)"/></svg>
      <div class="num"><b>${G.right}</b><small>out of ${n}</small></div></div>
    <h2>${title}</h2>
    <div class="sub">${G.practice ? 'Practice' : esc(cardName(G.cat))} · ${G.mode === 'spell' ? 'Spelled' : 'Chose'}</div>
    ${better && old ? '<div class="newbest">New best!</div>' : ''}
    <div class="rstats"><div><small>Right</small><b>${pct}%</b></div><div><small>Best streak</small><b>${G.bestStreak}</b></div><div><small>Time</small><b>${fmtTime(time)}</b></div></div>
    <div class="rbtns"><button class="ghost" id="homeBtn">Home</button><button class="primary" id="againBtn">Play again</button></div>
    ${missed.length ? `<button class="ghost" id="practiseBtn" style="width:100%;padding:13px;margin-top:10px">Practise the ${missed.length} I missed</button>
      <div class="rlist"><h3>The ones you missed</h3>${missed.map(q => `<div class="rrow"><div class="em2">${q.e}</div><div class="nm">${esc(q.a)}<small>${CAT[q.cat].name}</small></div></div>`).join('')}</div>` : ''}`;
  showScreen('#results');
  requestAnimationFrame(() => requestAnimationFrame(() => { const a = $('#ringArc'); if (a) a.style.strokeDashoffset = C * (1 - G.right / n); }));
  Sound.done(perfect);
  if (perfect || better && old) confetti();
  $('#homeBtn').onclick = goHome;
  $('#againBtn').onclick = () => startRound();
  if ($('#practiseBtn')) $('#practiseBtn').onclick = () => startRound(shuffle(missed));
}

/* ---------- records ---------- */
function renderRecords() {
  const acc = stats.answered ? Math.round(100 * stats.right / stats.answered) + '%' : '—';
  const rows = Object.entries(stats.best).sort((a, b) => b[1].at - a[1].at).slice(0, 12);
  const solved = ALL.filter(p => stats.solved[p.key]).length;
  $('#recBody').innerHTML = `
    <div class="bigstats"><div><small>Rounds</small><b>${stats.rounds}</b></div><div><small>Perfect rounds</small><b>${stats.perfect}</b></div>
      <div><small>Right overall</small><b>${acc}</b></div><div><small>Best streak</small><b>${stats.bestStreak}</b></div></div>
    <div class="sect">Puzzles solved · ${solved} / ${ALL.length}</div>
    ${CATS.map(c => { const k = c.items.filter(p => stats.solved[p.key]).length; return `<div class="mrow" style="--rc:var(--accent)"><span style="font-size:1.2rem">${c.e}</span><span class="nm">${c.name}</span><span class="mb"><i style="width:${100 * k / c.items.length}%"></i></span><small>${k}/${c.items.length}</small></div>`; }).join('')}
    ${rows.length ? `<div class="sect">Best rounds</div><table class="btable"><tr><th>Round</th><th>Score</th><th>Time</th></tr>${rows.map(([k, v]) => { const [mode, cat] = k.split('|');
      return `<tr><td>${esc(cardName(cat))}<br><small style="color:var(--muted)">${mode === 'spell' ? 'Spell' : 'Choose'} · ${v.total} puzzles</small></td><td><b>${v.right}/${v.total}</b></td><td>${fmtTime(v.time)}</td></tr>`; }).join('')}</table>` : ''}
    <button class="danger" id="resetBtn">Reset records</button>`;
  let armed = 0;
  $('#resetBtn').onclick = e => {
    if (Date.now() - armed > 3000) { armed = Date.now(); e.target.textContent = 'Tap again to reset everything'; return; }
    Object.assign(stats, {rounds: 0, answered: 0, right: 0, bestStreak: 0, perfect: 0, best: {}, solved: {}});
    keep(STATS_KEY, stats); renderRecords(); renderHome();
  };
}
$('#recBtn').onclick = () => { Sound.tap(); renderRecords(); $('#recPanel').classList.add('show'); };

renderHome();
window.RizzoHooks = {previewSound: () => Sound.right(4), canReload: () => !G};
</script>
</body>
</html>
